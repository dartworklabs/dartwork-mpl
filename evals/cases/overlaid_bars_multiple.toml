# cluster: two groups on one row (thin grey bar plus marker for the other group) instead of side-by-side bars, with a right-hand column of multiples; refs: 2b96947d-125d-808b-85ff-e845a8f1ae9c, d8c95b11-f8d7-46cc-a556-09b9d64219cd, 1b76947d-125d-80a0-a21f-e45cb836e7c9
prompt = "habits.csv: the share of teams doing each management practice, for teams that hit their transformation goals and for all the others. I don't want two bars side by side per practice. Draw the others as a thin grey bar with the successful teams marked on the same row, and add a column on the right showing how many times more likely the successful ones are (2.1x and so on). Sort by that multiple. It's for a consulting-style report page."

[files]
"habits.csv" = """
practice,others_pct,successful_pct
Weekly leadership check-ins,17,36
Monthly or quarterly performance reviews,26,41
Clear owner for every target,29,44
One-to-one performance conversations,33,45
Annual planning tied to the transformation,35,47
Unit-level performance reviews,38,48
Capital allocated to transformation priorities,39,55
Dedicated IT resources,46,62
Dedicated talent pool,49,68
"""

[expect]
panels = 1
texts = ["Weekly leadership check-ins", "Dedicated talent pool"]
any_text = ["2.1x", "2.1×", "2.1 x"]
