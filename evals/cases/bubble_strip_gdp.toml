# cluster: one-dimensional bubble strip (a single value axis, bubble size by a second measure), names beside the bubbles, a dashed reference at the average; refs: 2936947d-125d-80bf-9749-f02b10a6c210
prompt = "A compact one for the trade report: openness.csv has trade as a share of GDP for seven economies, and their GDP. One horizontal axis, a bubble per economy sized by its GDP, the names next to the bubbles, and a dashed line at the world average of 58%."

[files]
"openness.csv" = """
economy,trade_pct_of_gdp,gdp_usd_trillion
United States,25,29.2
Brazil,34,2.2
China,37,18.7
India,46,3.9
United Kingdom,64,3.6
Germany,83,4.7
Vietnam,166,0.5
"""

[expect]
panels = 1
texts = ["United States", "Vietnam", "Germany"]
any_text = ["World average", "world average", "58"]
