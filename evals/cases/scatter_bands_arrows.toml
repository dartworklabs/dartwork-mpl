"energy.py" = '''
"""Energy use per person against the human development index, 60 countries."""

import numpy as np
import pandas as pd

NAMED = {
    # name: (hdi_2015, mwh_2015, hdi_2023, mwh_2023)
    "Vietnam": (0.68, 7.9, 0.73, 12.6),
    "Bangladesh": (0.59, 2.4, 0.67, 3.5),
    "Kenya": (0.55, 1.6, 0.60, 2.0),
    "Türkiye": (0.80, 18.9, 0.86, 22.4),
    "Uruguay": (0.80, 16.1, 0.83, 18.8),
}


def load() -> pd.DataFrame:
    """Columns: country, hdi_2023, mwh_2023, hdi_2015, mwh_2015 (NaN unless named)."""
    rng = np.random.default_rng(12)
    hdi = np.sort(rng.uniform(0.39, 0.96, 55)).round(3)
    mwh = (0.6 * np.exp(5.2 * (hdi - 0.39)) * rng.lognormal(0, 0.28, 55)).round(1)
    rows = [
        {"country": f"Country {i + 1:02d}", "hdi_2023": h, "mwh_2023": m}
        for i, (h, m) in enumerate(zip(hdi, mwh))
    ]
    for name, (h0, m0, h1, m1) in NAMED.items():
        rows.append({"country": name, "hdi_2023": h1, "mwh_2023": m1,
                     "hdi_2015": h0, "mwh_2015": m0})
    return pd.DataFrame(rows)
'''

