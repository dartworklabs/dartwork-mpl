prompt = "`from plants import load` returns a table of 60 plants with their automation maturity score and output per worker in 2023, and for five named plants their 2015 position too. Scatter for an operations brief: shade the maturity bands (basic below 0.55, developing to 0.70, advanced to 0.80, leading above) and name them, label only the five named plants, and draw an arrow from where each was in 2015 to where it is now."

