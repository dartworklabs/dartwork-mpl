"plants.py" = '''
"""Output per worker against the automation maturity score, 60 plants."""

import numpy as np
import pandas as pd

NAMED = {
    # name: (maturity_2015, output_2015, maturity_2023, output_2023)
    "Harbour Works": (0.68, 7.9, 0.73, 12.6),
    "Millbrook": (0.59, 2.4, 0.67, 3.5),
    "Eastfield": (0.55, 1.6, 0.60, 2.0),
    "Northgate": (0.80, 18.9, 0.86, 22.4),
    "Riverside": (0.80, 16.1, 0.83, 18.8),
}


def load() -> pd.DataFrame:
    """Columns: plant, maturity_2023, output_2023 (thousand units per worker),
    maturity_2015, output_2015 (NaN unless named)."""
    rng = np.random.default_rng(12)
    maturity = np.sort(rng.uniform(0.39, 0.96, 55)).round(3)
    output = (0.6 * np.exp(5.2 * (maturity - 0.39)) * rng.lognormal(0, 0.28, 55)).round(1)
    rows = [
        {"plant": f"Plant {i + 1:02d}", "maturity_2023": m, "output_2023": o}
        for i, (m, o) in enumerate(zip(maturity, output))
    ]
    for name, (m0, o0, m1, o1) in NAMED.items():
        rows.append({"plant": name, "maturity_2023": m1, "output_2023": o1,
                     "maturity_2015": m0, "output_2015": o0})
    return pd.DataFrame(rows)
'''

