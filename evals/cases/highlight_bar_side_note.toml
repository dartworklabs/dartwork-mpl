# cluster: one highlighted bar, grey context, side note with the earlier value and delta; refs: 2966947d-125d-801d-a954-c55086c1c3cd, 1386947d-125d-80b0-8578-e7d9c6e9fe8f
prompt = "features.csv is from our customer survey: the share of respondents who put each feature in their top three for 2025, plus the 2023 number. Horizontal bars for 2025. Offline mode is the story because it fell the most, so make that the one bar that stands out and put a short note next to it with the 2023 figure and the drop in points. Everything else can stay quiet. It's for the annual product report."

[files]
"features.csv" = """
feature,share_2025,share_2023
Faster search,58,54
Shared folders,51,47
Offline mode,37,46
Calendar sync,33,31
Dark theme,29,30
Keyboard shortcuts,26,24
Export to PDF,22,23
Custom fonts,9,8
"""

[expect]
panels = 1
marks = ["bar"]
texts = ["Offline mode", "Faster search", "Custom fonts"]
any_text = ["46"]
