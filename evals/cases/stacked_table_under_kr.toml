# cluster: 100% stacked columns across ordered stages with category names beside the first column and table rows under the axis aligned to the columns; refs: 1066947d-125d-805f-96eb-ed3cd9431564, 1946947d-125d-806f-a034-fd1121c0d693, 19e6947d-125d-8033-9bbd-cca7a473e92f
prompt = "process.csv 는 공정 단계별 생산 물량 구성(%)이야. 1공장/2공장을 다시 자체 생산과 외주로 나눴어. 단계별 100% 누적 막대로 그리고, 막대 아래에 표처럼 2025년·2022년·2019년 1공장 비율을 단계에 맞춰 줄 세워 적어줘. 범례 상자 대신 항목 이름은 막대 옆에 써주면 좋겠어. 생산 운영 보고서에 들어가."

[files]
"process.csv" = """
공정 단계,1공장 자체 생산,1공장 외주,2공장 자체 생산,2공장 외주,1공장비율_2022,1공장비율_2019
원료 처리,0,47,0,53,45,44
성형,31,11,42,16,39,36
가공,26,9,48,17,32,29
조립,22,7,53,18,26,22
검사,17,6,57,20,21,16
포장,12,7,54,27,15,11
"""

[expect]
marks = ["bar"]
texts = ["원료 처리", "포장", "1공장 자체 생산", "2공장 외주", "2022", "2019"]
