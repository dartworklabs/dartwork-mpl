# cluster: compact heatmap with long column names set at an angle above the grid, numeric columns to the left of the grid, single-hue scale with a low-to-high legend, no cell text; refs: 2926947d-125d-809b-ac19-ce33cf6e5beb, 8ad3e393-01d6-4a25-b755-0041e896908f
prompt = "impact.csv: 산업별·업무 기능별 생성형 AI의 예상 생산성 효과야(매출 대비 %). 히트맵으로 그려줘. 기능 이름이 길어서 열 제목은 비스듬히 세워도 좋아. 왼쪽에는 산업별 합계 범위 열도 같이 넣어줘. 값은 칸에 안 적어도 되고, 범례는 낮음~높음 정도면 돼. 산업 리포트용이야."

