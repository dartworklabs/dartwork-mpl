# g24-vague-ko — generate / ko / unspecified / held-out
id: g24-vague-ko
kind: generate
lang: ko
purpose: unspecified
held_out: true
prompt: 이 데이터로 보기 좋은 그래프 하나 만들어 주세요.
data: [quarterly_sales.csv]
oracle:
- type: any_of
  group: values
  name: revenue shown with identity
  checks:
