      col: region
    series:
      col: quarter
    value: revenue
  - type: series
    group: values
    name: one line per region
    file: quarterly_sales.csv
    x:
      col: quarter
      kind: order
    identity: named
    series:
    - y: revenue
      aliases: [North]
      where:
        region: North
    - y: revenue
      aliases: [South]
      where:
        region: South
    - y: revenue
      aliases: [East]
      where:
        region: East
    - y: revenue
      aliases: [West]
      where:
        region: West
