# g01-line-gdp — generate / en / report
id: g01-line-gdp
kind: generate
lang: en
purpose: report
held_out: false
prompt: Plot real GDP growth for all five countries from 2012 to 2023 as a line chart.
data: [gdp_growth.csv]
auxiliary: [reference_lines]
oracle:
- type: series
  group: values
  name: country series
  file: gdp_growth.csv
  x:
    col: year
    kind: num
  identity: named
  series:
  - y: Korea
    aliases: [Korea, 한국]
  - y: Japan
    aliases: [Japan, 일본]
  - y: United States
    aliases: [United States, USA, US, 미국]
  - y: Germany
    aliases: [Germany, 독일]
  - y: France
    aliases: [France, 프랑스]
  artists: [line]
