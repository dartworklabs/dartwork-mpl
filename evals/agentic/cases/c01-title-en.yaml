# c01-title-en — generate / en / report (customization: a named title)
id: c01-title-en
kind: generate
lang: en
purpose: report
held_out: false
prompt: Line chart of real GDP growth for every country in gdp_growth.csv, titled "Real GDP growth by country".
data: [gdp_growth.csv]
auxiliary: [reference_lines]
oracle:
- type: series
  group: values
  name: country series
  file: gdp_growth.csv
  x:
    col: year
    kind: num
  identity: named
  series:
  - y: Korea
    aliases: [Korea, 한국]
  - y: Japan
    aliases: [Japan, 일본]
  - y: United States
    aliases: [United States, USA, US, 미국]
  - y: Germany
    aliases: [Germany, 독일]
  - y: France
    aliases: [France, 프랑스]
  artists: [line]
- type: title
  group: spec
  name: requested title
  contains: Real GDP growth by country
