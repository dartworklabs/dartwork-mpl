# g15-korean-barh — generate / ko / report / held-out
id: g15-korean-barh
kind: generate
lang: ko
purpose: report
held_out: true
prompt: 시도별 인구를 가로 막대그래프로 그려 주세요. 인구가 많은 시도가 위에 오도록 정렬해 주세요.
data: [sido_population.csv]
oracle:
- type: bars
  group: values
  name: 시도 -> 인구
  file: sido_population.csv
  category:
    col: 시도
    aliases:
      서울특별시: [서울, Seoul]
      부산광역시: [부산, Busan]
      대구광역시: [대구, Daegu]
      인천광역시: [인천, Incheon]
      광주광역시: [광주, Gwangju]
      대전광역시: [대전, Daejeon]
      울산광역시: [울산, Ulsan]
      세종특별자치시: [세종, Sejong]
      경기도: [경기, Gyeonggi]
      강원특별자치도: [강원, Gangwon]
      충청북도: [충북, Chungbuk]
      충청남도: [충남, Chungnam]
      전북특별자치도: [전북, Jeonbuk]
      전라남도: [전남, Jeonnam]
      경상북도: [경북, Gyeongbuk]
      경상남도: [경남, Gyeongnam]
      제주특별자치도: [제주, Jeju]
  value: 인구(천명)
  orientation: h
  scales: [1, 1000, 0.1, 0.001]
- type: bars_sorted
  group: spec
  name: largest on top
  orientation: h
