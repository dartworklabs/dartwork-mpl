# Local convenience only; CI's `lint` job is the authority (ruff check,
# ruff format --check, basedpyright).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '^(src/dartwork_mpl/asset/|src/dartwork_mpl/_colors/_generated\.py$|docs/[^/]+/images/|.*\.svg$)'
      - id: end-of-file-fixer
        exclude: '^(src/dartwork_mpl/asset/|src/dartwork_mpl/_colors/_generated\.py$|docs/[^/]+/images/|.*\.svg$)'
      - id: check-merge-conflict
      - id: check-toml
      - id: check-yaml
        args: [--allow-multiple-documents]

  # Keep in step with the ruff version in uv.lock.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  # ~5 s on the whole package; uses the project venv so it sees the same
  # dependencies as CI. `--frozen` never rewrites uv.lock.
  - repo: local
    hooks:
      - id: basedpyright
        name: basedpyright
        entry: uv run --frozen basedpyright
        language: system
        types: [python]
        pass_filenames: false
