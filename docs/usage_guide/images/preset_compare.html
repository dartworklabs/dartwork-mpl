<meta charset="utf-8" />
<style>
  .dm-pc-widget {
    font-family: var(--dm-f-sys);
    max-width: 100%;
    margin: 0 auto;
  }
  /* ── Top status bar (preset name + index, replaces the old 7-button row) ── */
  .dm-pc-statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 10px;
    gap: 16px;
  }
  .dm-pc-current {
    display: flex;
    align-items: baseline;
    gap: 12px;
    min-width: 0;
  }
  .dm-pc-name {
    font-size: var(--dm-type-heading-size);
    font-weight: var(--dm-type-heading-weight);
    color: var(--dm-text-strong);
    letter-spacing: 0;
  }
  .dm-pc-desc {
    font-size: var(--dm-type-caption-size);
    color: var(--dm-text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .dm-pc-counter {
    font-size: var(--dm-type-caption-size);
    color: var(--dm-text-faint);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  /* ── Main layout: chart top, params bottom ── */
  .dm-pc-body {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  /* ── Chart stage (fixed size + nav arrows) ── */
  .dm-pc-stage-wrap {
    position: relative;
  }
  .dm-pc-stage {
    position: relative;
    background: var(--dm-bg-panel);
    border: 1px solid var(--dm-border-faint);
    border-radius: var(--dm-radius-4);
    overflow: hidden;
    width: 100%;
    aspect-ratio: 9.00 / 6.00;
  }
  .dm-pc-panel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
  }
  .dm-pc-panel.is-active {
    opacity: 1;
    pointer-events: auto;
  }
  .dm-pc-panel svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* Prev/Next arrows */
  .dm-pc-arrow {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 36px;
    height: 36px;
    border-radius: var(--dm-radius-full);
    border: 1px solid var(--dm-border-faint);
    background: var(--dm-bg-panel);
    color: var(--dm-text-strong);
    font-size: 16px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--dm-shadow-1);
    transition: all 0.15s ease;
    user-select: none;
    z-index: 2;
  }
  .dm-pc-arrow:hover {
    background: var(--dm-i-active-soft);
    border-color: var(--dm-i-soft-border);
    color: var(--dm-i-active-text);
    box-shadow: var(--dm-shadow-2);
  }
  .dm-pc-arrow-prev { left: 8px; }
  .dm-pc-arrow-next { right: 8px; }
  /* Dot indicators */
  .dm-pc-dots {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
  }
  .dm-pc-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--dm-gray-a5);
    border: 1px solid transparent;
    padding: 0;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .dm-pc-dot:hover {
    background: var(--dm-gray-a7);
    transform: scale(1.15);
  }
  .dm-pc-dot.is-active,
  .dm-pc-dot[aria-pressed="true"] {
    background: var(--dm-i-active-line);
    border-color: var(--dm-i-active-line);
    width: 22px;
    border-radius: var(--dm-radius-2);
  }
  /* Autoplay progress bar */
  .dm-pc-progress {
    height: 2px;
    background: var(--dm-gray-a4);
    margin-top: 8px;
    border-radius: 1px;
    overflow: hidden;
  }
  .dm-pc-progress-bar {
    height: 100%;
    background: var(--dm-i-active-line);
    width: 0%;
    transition: width 0.1s linear;
  }
  /* ── Parameter info panel (multi-column grid) ── */
  .dm-pc-params {
    font-size: var(--dm-type-caption-size);
    background: var(--dm-bg-subtle);
    border: 1px solid var(--dm-border-faint);
    border-radius: var(--dm-radius-4);
    padding: 16px;
  }
  .dm-pc-params-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 13rem), 1fr));
    gap: 10px 28px;
  }
  .dm-pc-param-item {
    display: flex;
    justify-content: flex-start;
    align-items: baseline;
    column-gap: var(--dm-space-2);
    border-bottom: 1px solid var(--dm-border-faint);
    padding-bottom: 6px;
    min-width: 0;
  }
  .dm-pc-param-key {
    flex: 0 0 11.5ch;
    font-family: var(--dm-f-mono);
    color: var(--dm-text-muted);
    white-space: nowrap;
  }
  .dm-pc-param-val {
    font-weight: 600;
    color: var(--dm-text-strong);
    min-width: 0;
    overflow-wrap: anywhere;
  }
  .dm-pc-param-special {
    grid-column: 1 / -1;
    border-bottom: none;
    padding-top: 4px;
    align-items: center;
  }
  .dm-pc-param-special .dm-pc-param-key {
    flex: 0 0 auto;
    margin-right: 12px;
  }
</style>

<script>
(function() {
  var presets = ["scientific", "report", "presentation", "poster", "web", "minimal", "dark"];
  var meta = {"scientific": {"use": "papers & journals", "desc": "Compact fonts, all four spines"}, "report": {"use": "reports & dashboards", "desc": "Slightly larger, top/right spines hidden"}, "presentation": {"use": "slides & talks", "desc": "Scientific x 2.6 on its 23.4 cm slide canvas, shown scaled"}, "poster": {"use": "conference posters", "desc": "Largest fonts, thick lines"}, "web": {"use": "web & documentation", "desc": "Screen-optimized, spine-light"}, "minimal": {"use": "data-ink focus (Tufte)", "desc": "No spines, no ticks — data only"}, "dark": {"use": "dark mode", "desc": "Inverted colors for dark backgrounds"}};
  var params = {"scientific": {"font.size": "7.5 pt", "axes.titlesize": "8.5 pt", "axes.labelsize": "7.5 pt", "xtick.labelsize": "7 pt", "ytick.labelsize": "7 pt", "legend.fontsize": "6 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0.3", "spines": "top/right hidden"}, "report": {"font.size": "8 pt", "axes.titlesize": "9 pt", "axes.labelsize": "8 pt", "xtick.labelsize": "8 pt", "ytick.labelsize": "8 pt", "legend.fontsize": "6 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0.3", "spines": "top/right hidden"}, "presentation": {"font.size": "19.5 pt", "axes.titlesize": "22.1 pt", "axes.labelsize": "19.5 pt", "xtick.labelsize": "18.2 pt", "ytick.labelsize": "18.2 pt", "legend.fontsize": "15.6 pt", "lines.linewidth": "2.6 pt", "axes.linewidth": "0.8", "spines": "top/right hidden"}, "poster": {"font.size": "12 pt", "axes.titlesize": "14 pt", "axes.labelsize": "12 pt", "xtick.labelsize": "11 pt", "ytick.labelsize": "11 pt", "legend.fontsize": "9 pt", "lines.linewidth": "1.5 pt", "axes.linewidth": "0.5", "spines": "top/right hidden"}, "web": {"font.size": "11 pt", "axes.titlesize": "13 pt", "axes.labelsize": "11 pt", "xtick.labelsize": "10 pt", "ytick.labelsize": "10 pt", "legend.fontsize": "8.5 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0.4", "spines": "top/right hidden"}, "minimal": {"font.size": "7.5 pt", "axes.titlesize": "8.5 pt", "axes.labelsize": "7.5 pt", "xtick.labelsize": "7 pt", "ytick.labelsize": "7 pt", "legend.fontsize": "5.5 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0", "spines": "all hidden"}, "dark": {"font.size": "11 pt", "axes.titlesize": "13 pt", "axes.labelsize": "11 pt", "xtick.labelsize": "10 pt", "ytick.labelsize": "10 pt", "legend.fontsize": "8.5 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0.4", "spines": "top/right hidden"}};
  var AUTOPLAY_MS = 5000;     // 5s per slide
  var PROGRESS_TICK_MS = 50;

  document.addEventListener("DOMContentLoaded", function() {
    var widget   = document.getElementById("dm-pc-widget");
    var panels   = document.querySelectorAll(".dm-pc-panel");
    var dots     = document.querySelectorAll(".dm-pc-dot");
    var prevBtn  = document.getElementById("dm-pc-prev");
    var nextBtn  = document.getElementById("dm-pc-next");
    var nameEl   = document.getElementById("dm-pc-name");
    var descEl   = document.getElementById("dm-pc-desc");
    var ctrEl    = document.getElementById("dm-pc-counter");
    var progress = document.getElementById("dm-pc-progress-bar");
    var pgrid    = document.getElementById("dm-pc-params-grid");

    var idx = 0;
    var autoplayTimer = null;
    var progressTimer = null;
    var paused = false;

    function activate(newIdx) {
      idx = (newIdx + presets.length) % presets.length;
      var preset = presets[idx];

      panels.forEach(function(p, i) {
        var selected = i === idx;
        p.classList.toggle("is-active", selected);
        p.setAttribute("aria-hidden", selected ? "false" : "true");
      });
      dots.forEach(function(d, i) {
        var selected = i === idx;
        d.classList.toggle("is-active", selected);
        d.setAttribute("aria-pressed", selected ? "true" : "false");
        d.tabIndex = selected ? 0 : -1;
      });

      nameEl.textContent = preset;
      descEl.textContent = meta[preset] ? "— " + meta[preset].desc : "";
      ctrEl.textContent = (idx + 1) + " / " + presets.length;

      if (params[preset]) {
        var html = "";
        var p = params[preset];
        Object.keys(p).forEach(function(k) {
          if (k === "spines" || k === "best_for") return;
          html += "<div class='dm-pc-param-item'><span class='dm-pc-param-key'>"
                  + k + "</span><span class='dm-pc-param-val'>" + p[k] + "</span></div>";
        });
        if (p["spines"]) {
          html += "<div class='dm-pc-param-item'><span class='dm-pc-param-key'>spines</span><span class='dm-pc-param-val'>"
                  + p["spines"] + "</span></div>";
        }
        if (meta[preset]) {
          html += "<div class='dm-pc-param-item dm-pc-param-special'><span class='dm-pc-param-key'>best for</span><span class='dm-pc-param-val'>"
                  + meta[preset].use + "</span></div>";
        }
        pgrid.innerHTML = html;
      }
    }

    function next() { activate(idx + 1); }
    function prev() { activate(idx - 1); }

    function startAutoplay() {
      stopAutoplay();
      var elapsed = 0;
      progress.style.width = "0%";
      progressTimer = setInterval(function() {
        if (paused) return;
        elapsed += PROGRESS_TICK_MS;
        progress.style.width = Math.min(100, (elapsed / AUTOPLAY_MS) * 100) + "%";
        if (elapsed >= AUTOPLAY_MS) {
          elapsed = 0;
          next();
          progress.style.width = "0%";
        }
      }, PROGRESS_TICK_MS);
    }
    function stopAutoplay() {
      if (progressTimer) { clearInterval(progressTimer); progressTimer = null; }
      progress.style.width = "0%";
    }

    prevBtn.addEventListener("click", function() { prev(); startAutoplay(); });
    nextBtn.addEventListener("click", function() { next(); startAutoplay(); });
    dots.forEach(function(d, i) {
      d.addEventListener("click", function() { activate(i); startAutoplay(); });
    });

    // Pause on hover or keyboard focus — accessibility-friendly
    widget.addEventListener("mouseenter", function() { paused = true;  });
    widget.addEventListener("mouseleave", function() { paused = false; });
    widget.addEventListener("focusin",    function() { paused = true;  });
    widget.addEventListener("focusout",   function() { paused = false; });

    // Keyboard navigation
    widget.tabIndex = 0;
    widget.addEventListener("keydown", function(e) {
      if (e.key === "ArrowLeft")  { prev(); startAutoplay(); }
      if (e.key === "ArrowRight") { next(); startAutoplay(); }
    });

    // Respect reduced-motion users — no autoplay, manual only
    var reduceMotion = window.matchMedia &&
      window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    activate(0);
    if (!reduceMotion) startAutoplay();
  });
})();
</script>
