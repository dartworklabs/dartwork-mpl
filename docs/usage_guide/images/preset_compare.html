<meta charset="utf-8" />
<style>
  .dm-pc-widget {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      sans-serif;
    max-width: 100%;
    margin: 0 auto;
  }
  .dm-pc-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 12px;
  }
  .dm-pc-tab {
    padding: 5px 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f8f8f8;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: #555;
    transition: all 0.15s ease;
    user-select: none;
  }
  .dm-pc-tab:hover {
    background: #e8e8e8;
    border-color: #999;
  }
  .dm-pc-tab.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }
  /* ── Main layout: chart left, params right ── */
  .dm-pc-body {
    display: flex;
    gap: 16px;
    align-items: stretch;
  }
  /* ── Chart stage (fixed size) ── */
  .dm-pc-stage {
    position: relative;
    background: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    overflow: hidden;
    flex: 1 1 0;
    /* Fixed aspect ratio via padding-bottom */
    aspect-ratio: 255.12 / 170.08;
  }
  .dm-pc-panel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .dm-pc-panel.active {
    opacity: 1;
    pointer-events: auto;
  }
  .dm-pc-panel svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* ── Parameter info panel (fixed width) ── */
  .dm-pc-params {
    flex: 0 0 240px;
    font-size: 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .dm-pc-params table {
    width: 100%;
    border-collapse: collapse;
  }
  .dm-pc-params td {
    padding: 4px 0;
    border-bottom: 1px solid #eee;
    vertical-align: middle;
  }
  .dm-pc-params td:first-child {
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    color: #555;
    white-space: nowrap;
    width: 140px;
  }
  .dm-pc-params td:last-child {
    text-align: right;
    font-weight: 600;
    color: #333;
    white-space: nowrap;
  }
  .dm-pc-params tr:last-child td {
    border-bottom: none;
    padding-top: 8px;
    font-style: italic;
    color: #888;
    font-weight: 500;
  }
  .dm-pc-params tr:last-child td:first-child {
    font-family: inherit;
    font-style: italic;
  }
  .dm-pc-params tr:last-child td:last-child {
    font-weight: 600;
  }
  /* ── Responsive: stack on narrow screens ── */
  @media (max-width: 680px) {
    .dm-pc-body {
      flex-direction: column;
    }
    .dm-pc-params {
      flex: none;
      width: 100%;
    }
  }
</style>

<script>
(function() {
  var meta = {"scientific": {"use": "papers & journals", "desc": "Compact fonts, all four spines"}, "report": {"use": "reports & dashboards", "desc": "Slightly larger, top/right spines hidden"}, "presentation": {"use": "slides & talks", "desc": "Large fonts for projection"}, "poster": {"use": "conference posters", "desc": "Largest fonts, thick lines"}, "web": {"use": "web & documentation", "desc": "Screen-optimized, spine-light"}, "minimal": {"use": "data-ink focus (Tufte)", "desc": "No spines, no ticks — data only"}, "dark": {"use": "dark mode", "desc": "Inverted colors for dark backgrounds"}};
  var params = {"scientific": {"font.size": "7.5 pt", "axes.titlesize": "8.5 pt", "axes.labelsize": "7.5 pt", "xtick.labelsize": "7 pt", "ytick.labelsize": "7 pt", "legend.fontsize": "5.5 pt", "lines.linewidth": "0.5 pt", "axes.linewidth": "0.3", "spines": "all visible"}, "report": {"font.size": "8 pt", "axes.titlesize": "9 pt", "axes.labelsize": "8 pt", "xtick.labelsize": "7 pt", "ytick.labelsize": "7 pt", "legend.fontsize": "6 pt", "lines.linewidth": "0.5 pt", "axes.linewidth": "0.3", "spines": "top/right hidden"}, "presentation": {"font.size": "10.5 pt", "axes.titlesize": "11.5 pt", "axes.labelsize": "10.5 pt", "xtick.labelsize": "10 pt", "ytick.labelsize": "10 pt", "legend.fontsize": "8.5 pt", "lines.linewidth": "0.5 pt", "axes.linewidth": "0.3", "spines": "all visible"}, "poster": {"font.size": "12 pt", "axes.titlesize": "14 pt", "axes.labelsize": "12 pt", "xtick.labelsize": "11 pt", "ytick.labelsize": "11 pt", "legend.fontsize": "9 pt", "lines.linewidth": "1.5 pt", "axes.linewidth": "0.5", "spines": "top/right hidden"}, "web": {"font.size": "11 pt", "axes.titlesize": "13 pt", "axes.labelsize": "11 pt", "xtick.labelsize": "10 pt", "ytick.labelsize": "10 pt", "legend.fontsize": "8.5 pt", "lines.linewidth": "0.5 pt", "axes.linewidth": "0.4", "spines": "top/right hidden"}, "minimal": {"font.size": "7.5 pt", "axes.titlesize": "8.5 pt", "axes.labelsize": "7.5 pt", "xtick.labelsize": "7 pt", "ytick.labelsize": "7 pt", "legend.fontsize": "5.5 pt", "lines.linewidth": "0.5 pt", "axes.linewidth": "0", "spines": "all hidden"}, "dark": {"font.size": "11 pt", "axes.titlesize": "13 pt", "axes.labelsize": "11 pt", "xtick.labelsize": "10 pt", "ytick.labelsize": "10 pt", "legend.fontsize": "8.5 pt", "lines.linewidth": "0.5 pt", "axes.linewidth": "0.4", "spines": "top/right hidden"}};
  document.addEventListener("DOMContentLoaded", function() {
    var tabs = document.querySelectorAll(".dm-pc-tab");
    var panels = document.querySelectorAll(".dm-pc-panel");
    var ptable = document.getElementById("dm-pc-params-table");

    function activate(preset) {
      tabs.forEach(function(t) {
        t.classList.toggle("active", t.dataset.preset === preset);
      });
      panels.forEach(function(p) {
        p.classList.toggle("active", p.dataset.preset === preset);
      });
      // Update params table
      if (params[preset]) {
        var html = "";
        var p = params[preset];
        var keys = Object.keys(p);
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          if (k === "spines" || k === "best_for") continue;
          html += "<tr><td>" + k + "</td><td>" + p[k] + "</td></tr>";
        }
        if (p["spines"]) {
          html += "<tr><td>spines</td><td>" + p["spines"] + "</td></tr>";
        }
        if (meta[preset]) {
          html += "<tr><td>best for</td><td>" + meta[preset].use + "</td></tr>";
        }
        ptable.innerHTML = html;
      }
    }

    tabs.forEach(function(t) {
      t.addEventListener("click", function() {
        activate(t.dataset.preset);
      });
    });

    // Default: activate first preset
    activate("scientific");
  });
})();
</script>
