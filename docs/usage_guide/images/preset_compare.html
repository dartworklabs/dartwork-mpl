<meta charset="utf-8" />
<style>
  .dm-pc-widget {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
      sans-serif;
    max-width: 100%;
    margin: 0 auto;
  }
  .dm-pc-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin-bottom: 12px;
  }
  .dm-pc-tab {
    padding: 5px 12px;
    border: 1px solid #ccc;
    border-radius: 4px;
    background: #f8f8f8;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: #555;
    transition: all 0.15s ease;
    user-select: none;
  }
  .dm-pc-tab:hover {
    background: #e8e8e8;
    border-color: #999;
  }
  .dm-pc-tab.active {
    background: #333;
    color: #fff;
    border-color: #333;
  }
  /* ── Main layout: chart top, params bottom ── */
  .dm-pc-body {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  /* ── Chart stage (fixed size) ── */
  .dm-pc-stage {
    position: relative;
    background: #fafafa;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    overflow: hidden;
    width: 100%;
    /* Fixed aspect ratio via padding-bottom */
    aspect-ratio: 255.12 / 170.08;
  }
  .dm-pc-panel {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  .dm-pc-panel.active {
    opacity: 1;
    pointer-events: auto;
  }
  .dm-pc-panel svg {
    display: block;
    width: 100%;
    height: 100%;
  }
  /* ── Parameter info panel (multi-column grid) ── */
  .dm-pc-params {
    font-size: 13px;
    background: #fdfdfd;
    border: 1px solid #e0e0e0;
    border-radius: 6px;
    padding: 16px;
  }
  .dm-pc-params-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px 48px; /* wider gap between columns */
  }
  .dm-pc-param-item {
    display: flex;
    justify-content: flex-start;
    align-items: baseline;
    border-bottom: 1px solid #eee;
    padding-bottom: 6px;
  }
  .dm-pc-param-key {
    flex: 0 0 130px; /* fixed width for alignment */
    font-family: "SF Mono", "Fira Code", "Consolas", monospace;
    color: #555;
    white-space: nowrap;
  }
  .dm-pc-param-val {
    font-weight: 600;
    color: #333;
    white-space: nowrap;
  }
  .dm-pc-param-special {
    grid-column: 1 / -1; /* Make 'best for' span full width if needed, or just let it flow */
    border-bottom: none;
    padding-top: 4px;
    align-items: center;
  }
  .dm-pc-param-special .dm-pc-param-key {
    flex: 0 0 auto;
    margin-right: 12px;
</style>

<script>
(function() {
  var meta = {"scientific": {"use": "papers & journals", "desc": "Compact fonts, all four spines"}, "report": {"use": "reports & dashboards", "desc": "Slightly larger, top/right spines hidden"}, "presentation": {"use": "slides & talks", "desc": "Large fonts for projection"}, "poster": {"use": "conference posters", "desc": "Largest fonts, thick lines"}, "web": {"use": "web & documentation", "desc": "Screen-optimized, spine-light"}, "minimal": {"use": "data-ink focus (Tufte)", "desc": "No spines, no ticks — data only"}, "dark": {"use": "dark mode", "desc": "Inverted colors for dark backgrounds"}};
  var params = {"scientific": {"font.size": "7.5 pt", "axes.titlesize": "8.5 pt", "axes.labelsize": "7.5 pt", "xtick.labelsize": "7 pt", "ytick.labelsize": "7 pt", "legend.fontsize": "6 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0.3", "spines": "top/right hidden"}, "report": {"font.size": "8 pt", "axes.titlesize": "9 pt", "axes.labelsize": "8 pt", "xtick.labelsize": "7 pt", "ytick.labelsize": "7 pt", "legend.fontsize": "6 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0.3", "spines": "top/right hidden"}, "presentation": {"font.size": "10.5 pt", "axes.titlesize": "11.5 pt", "axes.labelsize": "10.5 pt", "xtick.labelsize": "10 pt", "ytick.labelsize": "10 pt", "legend.fontsize": "8.5 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0.3", "spines": "top/right hidden"}, "poster": {"font.size": "12 pt", "axes.titlesize": "14 pt", "axes.labelsize": "12 pt", "xtick.labelsize": "11 pt", "ytick.labelsize": "11 pt", "legend.fontsize": "9 pt", "lines.linewidth": "1.5 pt", "axes.linewidth": "0.5", "spines": "top/right hidden"}, "web": {"font.size": "11 pt", "axes.titlesize": "13 pt", "axes.labelsize": "11 pt", "xtick.labelsize": "10 pt", "ytick.labelsize": "10 pt", "legend.fontsize": "8.5 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0.4", "spines": "top/right hidden"}, "minimal": {"font.size": "7.5 pt", "axes.titlesize": "8.5 pt", "axes.labelsize": "7.5 pt", "xtick.labelsize": "7 pt", "ytick.labelsize": "7 pt", "legend.fontsize": "5.5 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0", "spines": "all hidden"}, "dark": {"font.size": "11 pt", "axes.titlesize": "13 pt", "axes.labelsize": "11 pt", "xtick.labelsize": "10 pt", "ytick.labelsize": "10 pt", "legend.fontsize": "8.5 pt", "lines.linewidth": "1 pt", "axes.linewidth": "0.4", "spines": "top/right hidden"}};
  document.addEventListener("DOMContentLoaded", function() {
    var tabs = document.querySelectorAll(".dm-pc-tab");
    var panels = document.querySelectorAll(".dm-pc-panel");
    var pgrid = document.getElementById("dm-pc-params-grid");

    function activate(preset) {
      tabs.forEach(function(t) {
        t.classList.toggle("active", t.dataset.preset === preset);
      });
      panels.forEach(function(p) {
        p.classList.toggle("active", p.dataset.preset === preset);
      });
      // Update params grid
      if (params[preset]) {
        var html = "";
        var p = params[preset];
        var keys = Object.keys(p);
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          if (k === "spines" || k === "best_for") continue;
          html += "<div class='dm-pc-param-item'><span class='dm-pc-param-key'>" + k + "</span><span class='dm-pc-param-val'>" + p[k] + "</span></div>";
        }
        if (p["spines"]) {
          html += "<div class='dm-pc-param-item'><span class='dm-pc-param-key'>spines</span><span class='dm-pc-param-val'>" + p["spines"] + "</span></div>";
        }
        if (meta[preset]) {
          html += "<div class='dm-pc-param-item dm-pc-param-special'><span class='dm-pc-param-key'>best for</span><span class='dm-pc-param-val'>" + meta[preset].use + "</span></div>";
        }
        pgrid.innerHTML = html;
      }
    }

    tabs.forEach(function(t) {
      t.addEventListener("click", function() {
        activate(t.dataset.preset);
      });
    });

    // Default: activate first preset
    activate("scientific");
  });
})();
</script>
