    function applyPreset(name) {
      var p = presets[name];

      /* ── Info panel ── */
      document.getElementById("dm-pc-fs").textContent = p.fs + " pt";
      document.getElementById("dm-pc-ts").textContent = p.ts + " pt";
      document.getElementById("dm-pc-als").textContent = p.als + " pt";
      document.getElementById("dm-pc-xts").textContent = p.xts + " pt";
      document.getElementById("dm-pc-yts").textContent = p.yts + " pt";
      document.getElementById("dm-pc-ls").textContent = p.ls + " pt";
      document.getElementById("dm-pc-lw").textContent = p.lw + " pt";
      document.getElementById("dm-pc-alw").textContent = p.alw;
      document.getElementById("dm-pc-sp").textContent = p.spines;
      document.getElementById("dm-pc-use").textContent = p.use;

      /* ── SVG text sizes (only font-size changes, positions stay fixed) ── */
      var title = document.getElementById("dm-pc-title");
      var xlabel = document.getElementById("dm-pc-xlabel");
      var ylabel = document.getElementById("dm-pc-ylabel");
      var legA = document.getElementById("dm-pc-legend-a");
      var legB = document.getElementById("dm-pc-legend-b");

      title.setAttribute("font-size", p.titleSize);
      xlabel.setAttribute("font-size", p.labelSize);
      ylabel.setAttribute("font-size", p.labelSize);
      legA.setAttribute("font-size", p.legendSize);
      legB.setAttribute("font-size", p.legendSize);

      document.querySelectorAll(".dm-pc-xtick").forEach(function (t) {
        t.setAttribute("font-size", p.tickSize);
      });
      document.querySelectorAll(".dm-pc-ytick").forEach(function (t) {
        t.setAttribute("font-size", p.tickSize);
      });

      /* ── Spines ── */
      var spTop = document.getElementById("dm-pc-spine-top");
      var spRight = document.getElementById("dm-pc-spine-right");
      var spLeft = document.getElementById("dm-pc-spine-left");
      var spBottom = document.getElementById("dm-pc-spine-bottom");
      spTop.style.opacity = p.showTop ? "1" : "0";
      spRight.style.opacity = p.showRight ? "1" : "0";
      spLeft.style.opacity = p.showLeft ? "1" : "0";
      spBottom.style.opacity = p.showBottom ? "1" : "0";
      [spTop, spRight, spLeft, spBottom].forEach(function (s) {
        s.setAttribute("stroke", p.spineColor);
        s.setAttribute("stroke-width", p.spineWidth);
      });

      /* ── Tick marks ── */
      document.querySelectorAll(".dm-pc-xtick-mark").forEach(function (t) {
        t.style.opacity = p.showTicks ? "1" : "0";
        t.setAttribute("stroke", p.spineColor);
        t.setAttribute("stroke-width", p.tickWidth);
        t.setAttribute("y2", SPINE_BOTTOM + p.tickLen);
      });
      document.querySelectorAll(".dm-pc-ytick-mark").forEach(function (t) {
        t.style.opacity = p.showTicks ? "1" : "0";
        t.setAttribute("stroke", p.spineColor);
        t.setAttribute("stroke-width", p.tickWidth);
        t.setAttribute("x1", SPINE_LEFT - p.tickLen);
      });

      /* ── Line widths ── */
      document
        .getElementById("dm-pc-line-a")
        .setAttribute("stroke-width", p.lineWidth);
      document
        .getElementById("dm-pc-line-b")
        .setAttribute("stroke-width", p.lineWidth);

      /* ── Dot sizes ── */
      document.querySelectorAll(".dm-pc-dot-a").forEach(function (d) {
        d.setAttribute("r", p.dotR);
      });
      document.querySelectorAll(".dm-pc-dot-b").forEach(function (d) {
        var sz = p.dotR * 2;
        d.setAttribute("width", sz);
        d.setAttribute("height", sz);
      });

      /* ── Legend line widths ── */
      var legLines = document.querySelectorAll("#dm-pc-legend-group line");
      legLines.forEach(function (l) {
        l.setAttribute("stroke-width", p.lineWidth);
      });

      /* ── Colors ── */
      document.getElementById("dm-pc-bg").setAttribute("fill", p.bgColor);
      title.setAttribute("fill", p.textColor);
      xlabel.setAttribute("fill", p.labelColor);
      ylabel.setAttribute("fill", p.labelColor);
      legA.setAttribute("fill", p.tickColor);
      legB.setAttribute("fill", p.tickColor);

      document
        .querySelectorAll(".dm-pc-xtick, .dm-pc-ytick")
        .forEach(function (t) {
          t.setAttribute("fill", p.tickColor);
        });

      /* ── Chart container border — match dark bg ── */
      var chart = document.getElementById("dm-pc-chart");
      if (name === "dark") {
        chart.style.background = p.bgColor;
        chart.style.borderColor = p.spineColor;
      } else {
        chart.style.background = "#fff";
        chart.style.borderColor = "";
      }

      /* ── Active tab ── */
      document.querySelectorAll(".dm-pc-tab").forEach(function (tab) {
        tab.classList.toggle("dm-pc-tab-active", tab.dataset.preset === name);
      });
    }

    document.addEventListener("DOMContentLoaded", function () {
      document.querySelectorAll(".dm-pc-tab").forEach(function (tab) {
        tab.addEventListener("click", function () {
          applyPreset(this.dataset.preset);
        });
      });
      applyPreset("scientific");
    });
  })();
</script>
