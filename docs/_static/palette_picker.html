<style>
  /* Reusable palette picker — embed via `:file: _static/palette_picker.html`.
     Reads /docs/_static/palette_demo/manifest.json at runtime to populate
     itself, so adding/removing palettes never requires changing this file. */

  .dm-pp {
    width: 100%;
    max-width: 100%;
    margin: 1.6em auto 2em;
    font-family: var(--dm-f-sys);
  }

  /* Demo image — picker swaps its src */
  .dm-pp-stage {
    position: relative;
    width: 100%;
    border-radius: var(--dm-radius-4);
    border: 1px solid var(--dm-border-faint);
    background: var(--dm-bg-panel);
    overflow: hidden;
    margin-bottom: 12px;
  }
  .dm-pp-stage img {
    display: block;
    width: 100%;
    height: auto;
    transition: opacity 0.15s ease;
  }
  .dm-pp-stage img.is-loading { opacity: 0.55; }

  .dm-pp-caption {
    font-size: var(--dm-type-caption-size);
    color: var(--dm-text-muted);
    text-align: center;
    margin-bottom: 16px;
  }
  .dm-pp-caption code {
    background: var(--dm-i-code-surface);
    color: var(--dm-i-active-text);
    padding: 1px 5px;
    border-radius: var(--dm-radius-2);
    font-size: 0.9em;
  }

  /* Tabs (one per namespace: dc / oc / tw / md / ad / cu / pr) */
  .dm-pp-tabs.dm-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    border-bottom: 1px solid var(--dm-border-faint);
    margin-bottom: 10px;
  }
  .dm-pp-tab.dm-tab {
    border: none;
    background: transparent;
    padding: 6px 14px;
    font-size: var(--dm-type-label-size);
    color: var(--dm-text-muted);
    cursor: pointer;
    border-radius: var(--dm-radius-3) var(--dm-radius-3) 0 0;
    border-bottom: 2px solid transparent;
    font-family: var(--dm-f-mono);
  }
  .dm-pp-tab.dm-tab:hover { color: var(--dm-i-active-text); }
  .dm-pp-tab.dm-tab.is-active,
  .dm-pp-tab.dm-tab[aria-selected="true"] {
    color: var(--dm-i-active-text);
    border-bottom-color: var(--dm-i-active-line);
    font-weight: 600;
  }

  /* Palette buttons — borderless, low-profile pills so the picker
     reads as a control row rather than a stack of cards. Only the
     swatch carries weight; hover/active states use a subtle text
     color shift instead of a full background fill. */
  .dm-pp-buttons {
    display: flex;
    flex-wrap: wrap;
    gap: var(--dm-space-2);
    margin: 8px 0 12px;
  }
  .dm-pp-btn.dm-chip {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 4px 8px;
    border-radius: var(--dm-radius-full);
    border: 1px solid var(--dm-border-faint);
    background: transparent;
    cursor: pointer;
    font-family: var(--dm-f-mono);
    font-size: var(--dm-type-caption-size);
    color: var(--dm-text-muted);
    transition:
      background 0.12s ease,
      border-color 0.12s ease,
      color 0.12s ease;
  }
  .dm-pp-btn.dm-chip:hover {
    color: var(--dm-i-active-text);
    border-color: var(--dm-border);
  }
  .dm-pp-btn.dm-chip.is-active,
  .dm-pp-btn.dm-chip[aria-pressed="true"] {
    background: var(--dm-i-active-soft);
    border-color: var(--dm-i-soft-border);
    color: var(--dm-i-active-text);
    font-weight: 600;
  }
  .dm-pp-btn.dm-chip.is-active .dm-pp-swatch,
  .dm-pp-btn.dm-chip[aria-pressed="true"] .dm-pp-swatch {
    box-shadow: 0 0 0 2px var(--dm-i-active-line);
  }
  .dm-pp-swatch {
    display: inline-flex;
    border-radius: 999px;
    overflow: hidden;
    border: 1px solid var(--dm-border-faint);
    flex-shrink: 0;
  }
  .dm-pp-swatch span {
    width: 8px;
    height: 14px;
    display: block;
  }

  .dm-pp-active-info {
    font-size: var(--dm-type-caption-size);
    color: var(--dm-text-muted);
    margin-top: 8px;
    font-family: var(--dm-f-mono);
  }
  .dm-pp-active-info code {
    background: var(--dm-i-code-surface);
    color: var(--dm-i-active-text);
    padding: 1px 6px;
    border-radius: var(--dm-radius-2);
  }
</style>

<div class="dm-pp">
  <div class="dm-pp-tabs dm-tabs" id="dm-pp-tabs" role="tablist" aria-label="Palette namespace"></div>
  <div class="dm-pp-buttons" id="dm-pp-buttons"></div>

  <div class="dm-pp-stage">
    <img id="dm-pp-img" src="" alt="palette demo" />
  </div>
  <p class="dm-pp-caption" id="dm-pp-caption">Loading palette demos…</p>
  <p class="dm-pp-active-info" id="dm-pp-info"></p>
</div>

<script>
  (function () {
    // Path resolution. Three deploy contexts to support:
    //   1. Direct open under _static/ → "palette_demo/"
    //   2. Sphinx page at site root (e.g. /landing_pocs.html) → "_static/palette_demo/"
    //   3. Sphinx sub-page (e.g. /usage_guide/colors.html) → must walk
    //      up to the asset root, so use a path absolute to the doc root.
    // For (3) we cannot hard-code a single prefix because GitHub
    // Pages may serve under a subpath. The safest portable rule is:
    // compute how many directories deep the current page is and
    // prepend that many "../" before "_static/".
    var here = window.location.pathname;
    var base;
    if (here.indexOf("/_static/") !== -1) {
      base = "palette_demo/";
    } else {
      // strip leading "/" and the filename, count remaining dir segments
      var dirs = here.replace(/^\/+|\/+[^\/]*$/g, "").split("/").filter(Boolean);
      var up = dirs.length > 0 ? "../".repeat(dirs.length) : "";
      base = up + "_static/palette_demo/";
    }

    var img      = document.getElementById("dm-pp-img");
    var caption  = document.getElementById("dm-pp-caption");
    var tabsHost = document.getElementById("dm-pp-tabs");
    var btnsHost = document.getElementById("dm-pp-buttons");
    var infoHost = document.getElementById("dm-pp-info");

    fetch(base + "manifest.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (manifest) {
        render(manifest);
      })
      .catch(function (err) {
        caption.textContent = "Failed to load palette manifest: " + err;
      });

    function render(manifest) {
      caption.innerHTML = manifest.demo_caption
        || "Same chart, same data — only the prop_cycle changes.";

      var groups = manifest.groups;
      if (!groups || !groups.length) {
        caption.textContent = "No palettes registered.";
        return;
      }

      var activeNs = groups[0].namespace;
      var activePalette = groups[0].entries[0].id;

      // Build namespace tabs.
      groups.forEach(function (g) {
        var tab = document.createElement("button");
        var selected = g.namespace === activeNs;
        tab.className = "dm-pp-tab dm-tab" + (selected ? " is-active" : "");
        tab.dataset.ns = g.namespace;
        tab.type = "button";
        tab.setAttribute("role", "tab");
        tab.setAttribute("aria-selected", selected ? "true" : "false");
        tab.tabIndex = selected ? 0 : -1;
        tab.textContent = g.namespace + ".*";
        tab.addEventListener("click", function () { showNamespace(g.namespace); });
        tab.addEventListener("keydown", function (ev) {
          var tabs = Array.prototype.slice.call(tabsHost.querySelectorAll(".dm-pp-tab"));
          var pos = tabs.indexOf(tab);
          if (ev.key === "ArrowRight") { ev.preventDefault(); tabs[(pos + 1) % tabs.length].click(); tabs[(pos + 1) % tabs.length].focus(); }
          if (ev.key === "ArrowLeft") { ev.preventDefault(); tabs[(pos - 1 + tabs.length) % tabs.length].click(); tabs[(pos - 1 + tabs.length) % tabs.length].focus(); }
          if (ev.key === "Home") { ev.preventDefault(); tabs[0].click(); tabs[0].focus(); }
          if (ev.key === "End") { ev.preventDefault(); tabs[tabs.length - 1].click(); tabs[tabs.length - 1].focus(); }
        });
        tabsHost.appendChild(tab);
      });

      function showNamespace(ns) {
        activeNs = ns;
        tabsHost.querySelectorAll(".dm-pp-tab").forEach(function (t) {
          var selected = t.dataset.ns === ns;
          t.classList.toggle("is-active", selected);
          t.setAttribute("aria-selected", selected ? "true" : "false");
          t.tabIndex = selected ? 0 : -1;
        });
        var group = groups.find(function (g) { return g.namespace === ns; });
        btnsHost.innerHTML = "";
        btnsHost.setAttribute("role", "group");
        btnsHost.setAttribute("aria-label", "Palette choices");
        group.entries.forEach(function (e, idx) {
          var btn = document.createElement("button");
          btn.className = "dm-pp-btn dm-chip";
          btn.dataset.id = e.id;
          btn.type = "button";
          btn.setAttribute("aria-pressed", "false");
          var swatchHtml = '<span class="dm-pp-swatch">'
            + e.swatch.map(function (c) {
                return '<span style="background:' + c + ';"></span>';
              }).join("")
            + '</span>';
          btn.innerHTML = swatchHtml + " " + e.label;
          btn.addEventListener("click", function () { setPalette(e); });
          btnsHost.appendChild(btn);
          if (idx === 0 || e.id === activePalette) setPalette(e);
        });
      }

      function setPalette(entry) {
        activePalette = entry.id;
        img.classList.add("is-loading");
        var nextSrc = base + entry.file;
        var temp = new Image();
        temp.onload = function () {
          img.src = nextSrc;
          img.classList.remove("is-loading");
        };
        temp.src = nextSrc;
        btnsHost.querySelectorAll(".dm-pp-btn").forEach(function (b) {
          var selected = b.dataset.id === entry.id;
          b.classList.toggle("is-active", selected);
          b.setAttribute("aria-pressed", selected ? "true" : "false");
        });
        infoHost.innerHTML = "Active palette: <code>" + entry.id
          + "</code> · " + entry.swatch.length + " colors · pass to "
          + "<code>plt.rcParams['axes.prop_cycle']</code> via "
          + "<code>cycler(color=[...])</code>.";
      }

      showNamespace(activeNs);
    }
  })();
</script>
