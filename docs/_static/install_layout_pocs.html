<!doctype html>
<!--
  install_layout_pocs.html — code-surface × selector LAYOUT directions for the
  install picker. Goal: ONE cohesive unit (selector fused with the command
  surface) instead of nested rectangles (card > seg-track > code-box). Links
  the REAL dartwork-design.css + dm-interactive.css tokens; only the per-POC
  layout is local. winget-Git prereq removed (PyPI install needs no Git).
  Serve from docs/_static: python3 -m http.server 8137
-->
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Install picker — code-surface layouts</title>
  <link rel="stylesheet" href="dartwork-design.css" />
  <link rel="stylesheet" href="dm-interactive.css" />
  <style>
    body { margin:0; background:var(--dm-bg-page); color:var(--dm-gray-12);
      font-family:var(--dm-f-sys,"Inter",system-ui,sans-serif); letter-spacing: 0; }
    .wrap { max-width:760px; margin:0 auto; padding:36px 24px 120px; }
    .bar { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:12px 16px; margin:-36px -24px 12px; background:var(--dm-bg-panel);
      border-bottom:1px solid var(--dm-border-faint); flex-wrap:wrap; }
    .bar .t { font-size:15px; font-weight:700; }
    .bar p { margin:0; font-size:12.5px; color:var(--dm-text-muted); flex-basis:100%; }
    .tt { background:var(--dm-bg-panel); color:var(--dm-gray-12); border:1px solid var(--dm-border);
      border-radius:999px; padding:6px 13px; font:inherit; font-size:13px; cursor:pointer; }
    .poc { margin-top:40px; }
    .poc-h { display:flex; align-items:baseline; gap:10px; margin-bottom:6px; flex-wrap:wrap; }
    .poc-id { font-family:var(--dm-f-mono,monospace); font-size:11px; font-weight:600; color:#fff;
      background:var(--dm-accent-9); border-radius:6px; padding:3px 8px; }
    .poc-n { font-size:16px; font-weight:600; margin:0; }
    .poc-d { width:100%; margin:0 0 16px; font-size:13px; color:var(--dm-text-muted); line-height:1.5; }

    /* shared bits */
    .ip-eyebrow { font-size:.7rem; font-weight:700; letter-spacing: 0; text-transform:uppercase; color:var(--dm-accent-11); }
    .ip-detected { font-size:.78rem; color:var(--dm-text-muted); }
    .ip-detected b { color:var(--dm-gray-12); font-weight:600; }
    .ip-note { font-size:.78rem; color:var(--dm-text-muted); margin-top:10px; }
    .mono { font-family:var(--dm-f-mono,ui-monospace,monospace); font-size:.9rem; }
    .prompt { color:var(--dm-accent-11); user-select:none; }
    .copy { display:inline-flex; align-items:center; justify-content:center; width:28px; height:28px;
      border-radius:6px; border:1px solid transparent; background:transparent; color:var(--dm-text-muted);
      cursor:pointer; transition:all .15s; flex:none; }
    .copy svg { width:15px; height:15px; }
    .copy:hover { background:var(--dm-accent-3); color:var(--dm-accent-11); border-color:var(--dm-accent-7); }
    .row-eyebrow { display:flex; align-items:baseline; justify-content:space-between; gap:8px; margin-bottom:12px; flex-wrap:wrap; }

    /* tabs (underline) */
    .tabs { display:inline-flex; gap:2px; }
    .tab { appearance:none; background:none; border:0; border-bottom:2px solid transparent; color:var(--dm-text-muted);
      font:inherit; font-size:13.5px; font-weight:500; padding:7px 12px; cursor:pointer; transition:color .12s,border-color .12s; }
    .tab:hover { color:var(--dm-gray-12); }
    .tab.on { color:var(--dm-gray-12); border-bottom-color:var(--dm-accent-9); }
    /* chips (soft) */
    .chips { display:inline-flex; gap:6px; flex-wrap:wrap; }
    .chip { appearance:none; background:transparent; color:var(--dm-text-muted); border:1px solid var(--dm-border-faint);
      border-radius:7px; padding:4px 11px; font:inherit; font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; }
    .chip:hover { background:var(--dm-gray-a3); color:var(--dm-gray-12); }
    .chip.on { background:var(--dm-accent-3); color:var(--dm-accent-11); border-color:var(--dm-accent-7); font-weight:600; }
    /* text toggles (no box) */
    .txts { display:inline-flex; gap:14px; }
    .txt { appearance:none; background:none; border:0; color:var(--dm-text-muted); font:inherit; font-size:13.5px;
      font-weight:500; padding:2px 0; cursor:pointer; transition:color .12s; }
    .txt:hover { color:var(--dm-gray-12); }
    .txt.on { color:var(--dm-accent-11); font-weight:700; }
    .lbl { font-size:.66rem; font-weight:700; letter-spacing: 0; text-transform:uppercase; color:var(--dm-text-muted); margin-right:10px; }

    /* code-surface base */
    .code { position:relative; background:var(--dm-i-code-surface); font-family:var(--dm-f-mono,monospace);
      font-size:.9rem; color:var(--dm-gray-12); }

    /* ── C1 — Tabbed code block (tabs fused to the code-surface top bar) ── */
    .c1 .topbar { display:flex; align-items:center; gap:8px; background:var(--dm-i-code-surface);
      border:1px solid var(--dm-border-faint); border-bottom:none; border-radius:8px 8px 0 0; padding:0 6px 0 4px; }
    .c1 .topbar .tabs { flex:1; }
    .c1 .topbar .tab { padding:9px 12px; font-size:13px; }
    .c1 .topbar .os-toggle { display:inline-flex; gap:2px; }
    .c1 .topbar .os { appearance:none; background:none; border:0; color:var(--dm-text-muted); font:inherit;
      font-size:12px; font-weight:600; padding:4px 8px; border-radius:6px; cursor:pointer; }
    .c1 .topbar .os.on { color:var(--dm-accent-11); background:var(--dm-accent-3); }
    .c1 .code { border:1px solid var(--dm-border-faint); border-radius:0 0 8px 8px; padding:13px 50px 13px 16px; }
    .c1 .code .copy { position:absolute; top:8px; right:8px; }

    /* ── C2 — Header-strip chips (one surface, hairline-divided header) ── */
    .c2 { border:1px solid var(--dm-border-faint); border-radius:9px; overflow:hidden; background:var(--dm-bg-panel); }
    .c2 .hdr { display:flex; align-items:center; gap:14px; padding:10px 14px; border-bottom:1px solid var(--dm-border-faint); flex-wrap:wrap; }
    .c2 .hdr .sep { width:1px; align-self:stretch; background:var(--dm-border-faint); }
    .c2 .code { padding:13px 50px 13px 16px; }
    .c2 .code .copy { position:absolute; top:8px; right:8px; }

    /* ── C3 — Quick-Install idiom: frameless underline tabs + seamless code ── */
    .c3 .tabrow { display:flex; align-items:center; justify-content:space-between; gap:10px;
      border-bottom:1px solid var(--dm-border-faint); flex-wrap:wrap; }
    .c3 .os-txts { display:inline-flex; gap:12px; padding-right:4px; }
    .c3 .code { border:1px solid var(--dm-border-faint); border-top:none; border-radius:0 0 8px 8px;
      padding:13px 50px 13px 16px; margin-top:0; }
    .c3 .code .copy { position:absolute; top:8px; right:8px; }

    /* ── C4 — Floating chips + borderless tinted code (minimal outline) ── */
    .c4 .ctrls { display:flex; gap:18px; flex-wrap:wrap; margin-bottom:12px; }
    .c4 .ctrls .grp { display:flex; align-items:center; }
    .c4 .code { border:none; border-radius:8px; padding:14px 50px 14px 16px; }
    .c4 .code .copy { position:absolute; top:9px; right:9px; }

    /* ── C5 — Segmented fused into the code top bar (keeps slide dynamism) ── */
    .c5 { border:1px solid var(--dm-border-faint); border-radius:9px; overflow:hidden; background:var(--dm-bg-panel); }
    .c5 .hdr { display:flex; align-items:center; gap:12px; padding:9px 12px; border-bottom:1px solid var(--dm-border-faint); flex-wrap:wrap; }
    .c5 .seg { position:relative; display:inline-flex; background:var(--dm-gray-a3); border-radius:7px; padding:2px; }
    .c5 .seg .thumb { position:absolute; top:2px; left:0; height:calc(100% - 4px); background:var(--dm-bg-panel);
      border-radius:5px; box-shadow:var(--dm-shadow-2); transition:transform .24s cubic-bezier(.4,0,.2,1),width .24s cubic-bezier(.4,0,.2,1); }
    .c5 .seg button { position:relative; z-index:1; appearance:none; background:none; border:0; color:var(--dm-text-muted);
      font:inherit; font-size:12.5px; font-weight:500; padding:5px 11px; cursor:pointer; white-space:nowrap; transition:color .2s; }
    .c5 .seg button.on { color:var(--dm-gray-12); }
    .c5 .code { padding:13px 50px 13px 16px; }
    .c5 .code .copy { position:absolute; top:8px; right:8px; }
  </style>
</head>
<body class="yue">
  <div class="wrap">
    <div class="bar">
      <span class="t">Install picker — code-surface × selector</span>
      <button class="tt" id="tt" type="button">◐ theme</button>
      <p>Selector fused with the command surface — one cohesive unit, not nested boxes. Tabs / chips / segmented × code surface. Toggle theme; click Tool/OS.</p>
    </div>
    <div id="gallery"></div>
  </div>

  <script>
    const TOOLS = [
      { id:"uv", label:"uv", cmd:"uv add dartwork-mpl", note:"Fast Rust-based resolver — recommended." },
      { id:"pip", label:"pip", cmd:"pip install dartwork-mpl", note:"The standard Python installer." },
      { id:"poetry", label:"Poetry", cmd:"poetry add dartwork-mpl", note:"Adds to pyproject.toml automatically." },
      { id:"conda", label:"conda", cmd:"pip install dartwork-mpl   # in a conda env", note:"Use pip inside the conda environment." },
    ];
    const OSES = [
      { id:"macos", label:"macOS", prompt:"$ " },
      { id:"linux", label:"Linux", prompt:"$ " },
      { id:"windows", label:"Windows", prompt:"PS> " },
    ];
    const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';
    const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';

    const POCS = [
      { id:"C1", name:"Tabbed code block", cls:"c1",
        desc:"Tool = underline tabs fused to the code-surface top bar (a tabbed code block, like Stripe/Vercel docs). OS = quiet chip toggle at the bar's right. ONE surface; the tabs ARE its header — no nested boxes.",
        render: c1 },
      { id:"C2", name:"Header-strip chips", cls:"c2",
        desc:"One bordered surface with a hairline-divided header holding Tool + OS soft chips; command below. Internal division, not nested boxes. Chip selection = accent-3 wash.",
        render: c2 },
      { id:"C3", name:"Quick-Install idiom (frameless tabs + seamless code)", cls:"c3",
        desc:"Tool = frameless underline tabs (identical to the Quick Install tab-set below it); OS = text toggles at right; code surface attaches seamlessly under the tab strip (shared hairline). Maximum docs consistency, only one box.",
        render: c3 },
      { id:"C4", name:"Floating chips + borderless code", cls:"c4",
        desc:"Most minimal: Tool/OS as soft chips floating on the page (no box), command on a tinted code surface with NO border (just a rounded fill). Near-zero outlines.",
        render: c4 },
      { id:"C5", name:"Segmented fused in code header", cls:"c5",
        desc:"Keeps the sliding-thumb dynamism but folds both segmented controls into the code surface's own top bar — the segmented track lives INSIDE the one surface, so it reads as 'controls in a bar', not stacked cards.",
        render: c5 },
    ];

    /* ---- builders (return a wired DOM node) ---- */
    function toolBtn(t, cls, on){ const b=document.createElement("button"); b.type="button"; b.className=cls+(on?" on":"");
      b.dataset.tool=t.id; b.textContent=t.label; return b; }
    function osBtn(o, cls, on){ const b=document.createElement("button"); b.type="button"; b.className=cls+(on?" on":"");
      b.dataset.os=o.id; b.textContent=o.label; return b; }
    function copyBtn(){ const b=document.createElement("button"); b.type="button"; b.className="copy"; b.setAttribute("aria-label","Copy"); b.innerHTML=ICON; return b; }
    function codeInner(){ const wrap=document.createElement("div"); wrap.className="code";
      wrap.innerHTML='<span class="prompt mono"></span><span class="body mono"></span>'; wrap.appendChild(copyBtn()); return wrap; }

    function c1(){ const root=document.createElement("div"); root.className="c1";
      const eb=document.createElement("div"); eb.className="row-eyebrow";
      eb.innerHTML='<span class="ip-eyebrow">Live install command</span><span class="ip-detected">Detected: <b>macOS</b></span>'; root.appendChild(eb);
      const bar=document.createElement("div"); bar.className="topbar";
      const tabs=document.createElement("div"); tabs.className="tabs"; TOOLS.forEach((t,i)=>tabs.appendChild(toolBtn(t,"tab",i===0)));
      const ost=document.createElement("div"); ost.className="os-toggle"; OSES.forEach((o,i)=>ost.appendChild(osBtn(o,"os",i===0)));
      bar.appendChild(tabs); bar.appendChild(ost); root.appendChild(bar);
      root.appendChild(codeInner()); const n=document.createElement("div"); n.className="ip-note"; root.appendChild(n); return root; }

    function c2(){ const root=document.createElement("div"); root.className="c2";
      const hdr=document.createElement("div"); hdr.className="hdr";
      const tc=document.createElement("div"); tc.className="chips"; TOOLS.forEach((t,i)=>tc.appendChild(toolBtn(t,"chip",i===0)));
      const sep=document.createElement("div"); sep.className="sep";
      const oc=document.createElement("div"); oc.className="chips"; OSES.forEach((o,i)=>oc.appendChild(osBtn(o,"chip",i===0)));
      hdr.appendChild(tc); hdr.appendChild(sep); hdr.appendChild(oc); root.appendChild(hdr);
      root.appendChild(codeInner()); const n=document.createElement("div"); n.className="ip-note"; n.style.padding="0 14px 12px"; root.appendChild(n); return root; }

    function c3(){ const root=document.createElement("div"); root.className="c3";
      const eb=document.createElement("div"); eb.className="row-eyebrow";
      eb.innerHTML='<span class="ip-eyebrow">Live install command</span><span class="ip-detected">Detected: <b>macOS</b></span>'; root.appendChild(eb);
      const tr=document.createElement("div"); tr.className="tabrow";
      const tabs=document.createElement("div"); tabs.className="tabs"; TOOLS.forEach((t,i)=>tabs.appendChild(toolBtn(t,"tab",i===0)));
      const ot=document.createElement("div"); ot.className="os-txts"; OSES.forEach((o,i)=>ot.appendChild(osBtn(o,"txt",i===0)));
      tr.appendChild(tabs); tr.appendChild(ot); root.appendChild(tr);
      root.appendChild(codeInner()); const n=document.createElement("div"); n.className="ip-note"; root.appendChild(n); return root; }

    function c4(){ const root=document.createElement("div"); root.className="c4";
      const ctr=document.createElement("div"); ctr.className="ctrls";
      const g1=document.createElement("div"); g1.className="grp"; g1.innerHTML='<span class="lbl">Tool</span>';
      const tc=document.createElement("div"); tc.className="chips"; TOOLS.forEach((t,i)=>tc.appendChild(toolBtn(t,"chip",i===0))); g1.appendChild(tc);
      const g2=document.createElement("div"); g2.className="grp"; g2.innerHTML='<span class="lbl">OS</span>';
      const oc=document.createElement("div"); oc.className="chips"; OSES.forEach((o,i)=>oc.appendChild(osBtn(o,"chip",i===0))); g2.appendChild(oc);
      ctr.appendChild(g1); ctr.appendChild(g2); root.appendChild(ctr);
      root.appendChild(codeInner()); const n=document.createElement("div"); n.className="ip-note"; root.appendChild(n); return root; }

    function c5(){ const root=document.createElement("div"); root.className="c5";
      const hdr=document.createElement("div"); hdr.className="hdr";
      function seg(items,attr){ const s=document.createElement("div"); s.className="seg"; const th=document.createElement("span"); th.className="thumb"; s.appendChild(th);
        items.forEach((it,i)=>{ const b=document.createElement("button"); b.type="button"; b.className=(i===0?"on":""); b.dataset[attr]=it.id; b.textContent=it.label; s.appendChild(b); }); return s; }
      hdr.appendChild(seg(TOOLS,"tool")); hdr.appendChild(seg(OSES,"os")); root.appendChild(hdr);
      root.appendChild(codeInner()); const n=document.createElement("div"); n.className="ip-note"; n.style.padding="0 12px 12px"; root.appendChild(n); return root; }

    /* ---- generic wiring ---- */
    function wire(root){
      const state={ tool:"uv", os:"macos" };
      function paint(){
        const t=TOOLS.find(x=>x.id===state.tool), o=OSES.find(x=>x.id===state.os);
        root.querySelector(".prompt").textContent=o.prompt;
        root.querySelector(".body").textContent=t.cmd;
        const n=root.querySelector(".ip-note"); if(n) n.textContent=t.note;
        root.querySelectorAll("[data-tool]").forEach(b=>b.classList.toggle("on",b.dataset.tool===state.tool));
        root.querySelectorAll("[data-os]").forEach(b=>b.classList.toggle("on",b.dataset.os===state.os));
        root.querySelectorAll(".seg").forEach(moveThumb);
      }
      function moveThumb(seg){ const th=seg.querySelector(".thumb"), on=seg.querySelector("button.on"); if(!th||!on)return;
        th.style.width=on.offsetWidth+"px"; th.style.transform="translateX("+on.offsetLeft+"px)"; }
      root.addEventListener("click",e=>{
        const t=e.target.closest("[data-tool]"); if(t){ state.tool=t.dataset.tool; paint(); return; }
        const o=e.target.closest("[data-os]"); if(o){ state.os=o.dataset.os; paint(); return; }
        const c=e.target.closest(".copy"); if(c){ navigator.clipboard&&navigator.clipboard.writeText(root.querySelector(".body").textContent);
          c.innerHTML=CHECK; setTimeout(()=>c.innerHTML=ICON,1300); }
      });
      paint(); requestAnimationFrame(()=>root.querySelectorAll(".seg").forEach(moveThumb));
      window.addEventListener("resize",()=>root.querySelectorAll(".seg").forEach(moveThumb));
    }

    const g=document.getElementById("gallery");
    POCS.forEach(p=>{ const sec=document.createElement("section"); sec.className="poc";
      sec.innerHTML='<div class="poc-h"><span class="poc-id">'+p.id+'</span><h2 class="poc-n">'+p.name+'</h2><p class="poc-d">'+p.desc+'</p></div>';
      const node=p.render(); sec.appendChild(node); g.appendChild(sec); wire(node); });

    document.getElementById("tt").addEventListener("click",()=>{ const r=document.documentElement;
      r.classList.toggle("dark"); r.classList.toggle("light"); document.body.setAttribute("data-theme",r.classList.contains("dark")?"dark":"light");
      requestAnimationFrame(()=>document.querySelectorAll(".seg").forEach(s=>{ const th=s.querySelector(".thumb"),on=s.querySelector("button.on"); if(th&&on){th.style.width=on.offsetWidth+"px";th.style.transform="translateX("+on.offsetLeft+"px)";} })); });
  </script>
</body>
</html>
