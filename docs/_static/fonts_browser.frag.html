      '<section><p class="lbl">Weight ladder</p><div class="ladder">' + ladder + "</div></section>" +
      '<section><p class="lbl">Numerals &amp; symbols</p>' +
        '<p class="numerals" style="font-family:\'' + reg + "', var(--dm-f-mono)\">" + escapeHtml("0123456789 " + f.raw.chart_glyphs) + "</p>" +
        tnumProof + "</section>" +
      widthVariants +
      '<section><p class="lbl">Why this face</p>' +
        '<p class="intent-txt">' + escapeHtml(f.raw.intent) + "</p>" +
        '<p class="intent-txt">' + escapeHtml(f.raw.application) + "</p>" +
        '<p class="pairing-txt">Pairs well: ' + escapeHtml(f.raw.pairing) + "</p></section>" +
      '<section><p class="lbl">rcParams snippet</p>' +
        '<div class="snippet"><button type="button" class="snippet-copy">Copy</button>' + escapeHtml(snippet) + "</div></section>";

    dBody.querySelector(".snippet-copy").addEventListener("click", function () {
      copyText(snippet, "rcParams snippet copied");
    });
    dBody.querySelectorAll(".ladder-copy").forEach(function (row) {
      row.addEventListener("click", function () {
        var weight = "fontweight=" + row.dataset.weight;
        copyText(weight, weight + " copied");
      });
    });

    detail.removeAttribute("inert");
    detail.classList.add("open");
    detail.setAttribute("aria-hidden", "false");
    backdrop.classList.add("open");
    if (!wasOpen) ROOT.querySelector("#dClose").focus();
  }

  function stepDetail(delta) {
    var visible = visibleFamilies();
    if (visible.length === 0) return;
    var index = visible.findIndex(function (f) { return f.key === currentKey; });
    if (index === -1) index = delta > 0 ? -1 : 0;
    var nextIndex = (index + delta + visible.length) % visible.length;
    openDetail(visible[nextIndex].key);
  }

  function closeDetail() {
    detail.classList.remove("open");
    detail.setAttribute("aria-hidden", "true");
    detail.setAttribute("inert", "");
    backdrop.classList.remove("open");
    currentKey = null;
    markSelected("");
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  ROOT.querySelector("#dClose").addEventListener("click", closeDetail);
  dPrev.addEventListener("click", function () { stepDetail(-1); });
  dNext.addEventListener("click", function () { stepDetail(1); });
  backdrop.addEventListener("click", closeDetail);
  function isTypingTarget(target) {
    if (!target) return false;
    var tag = target.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT" || target.isContentEditable;
  }
  var FOCUSABLE_SELECTOR = [
    'a[href]',
    'button:not([disabled])',
    'input:not([disabled])',
    'select:not([disabled])',
    'textarea:not([disabled])',
    '[tabindex]:not([tabindex="-1"])'
  ].join(",");
  function trapDetailFocus(e) {
    if (e.key !== "Tab" || !detail.classList.contains("open")) return;
    var controls = Array.prototype.filter.call(
      detail.querySelectorAll(FOCUSABLE_SELECTOR),
      function (control) {
        return !control.hidden && !control.closest("[hidden]") && control.getAttribute("aria-hidden") !== "true";
      }
    );
    if (controls.length === 0) {
      e.preventDefault();
      detail.focus();
      return;
    }
    var first = controls[0];
    var last = controls[controls.length - 1];
    var active = document.activeElement;
    if (!detail.contains(active) || (e.shiftKey && active === first) || (!e.shiftKey && active === last)) {
      e.preventDefault();
      (e.shiftKey ? last : first).focus();
    }
  }
  document.addEventListener("keydown", function (e) {
    if (e.defaultPrevented) return;
    if (detail.classList.contains("open") && e.key === "Tab") {
      trapDetailFocus(e);
      return;
    }
    if (e.key === "Escape" && detail.classList.contains("open")) {
      e.preventDefault();
      closeDetail();
      return;
    }
    if (detail.classList.contains("open") && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
      e.preventDefault();
      stepDetail(e.key === "ArrowLeft" ? -1 : 1);
      return;
    }
    if (e.key === "/" && !detail.classList.contains("open") && !e.altKey && !e.ctrlKey && !e.metaKey && !isTypingTarget(e.target) && activeBrowserRoot() === ROOT) {
      e.preventDefault();
      searchEl.focus();
    }
  });

  // ---- boot --------------------------------------------------
  render();
})();
</script>
</div>
