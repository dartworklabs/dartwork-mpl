<style>
  /* before/after toggle — Distribution comparison (violin) (id-scoped to #dm-cmp-l8-violin) */
  #dm-cmp-l8-violin {
    max-width: 720px;
    margin: 1.6em auto;
    font-family: var(--dm-f-sys, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif);
  }
  #dm-cmp-l8-violin .dmc-radio {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  #dm-cmp-l8-violin .dmc-tabs {
    display: inline-flex;
    gap: 3px;
    padding: 3px;
    border-radius: var(--dm-radius-full, 999px);
    background: var(--dm-i-track, #ece9e3);
    margin: 0 0 0.7em;
  }
  #dm-cmp-l8-violin .dmc-tab {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    cursor: pointer;
    padding: 5px 15px;
    border-radius: var(--dm-radius-full, 999px);
    font-size: var(--dm-type-label-size, 0.8em);
    font-weight: 600;
    letter-spacing: 0;
    color: var(--dm-text-muted, #6b6862);
    transition: background 0.15s, color 0.15s, box-shadow 0.15s;
    user-select: none;
    -webkit-user-select: none;
  }
  #dm-cmp-l8-violin .dmc-tab::before {
    content: "";
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex: 0 0 auto;
  }
  #dm-cmp-l8-violin .dmc-tab-after::before {
    background: var(--dm-i-active-line, #12a594);
  }
  #dm-cmp-l8-violin .dmc-tab-before::before {
    background: var(--dm-danger-9, #e5484d);
  }
  #dm-cmp-l8-violin .dmc-stage {
    position: relative;
    border-radius: var(--dm-radius-4, 8px);
    border: 1px solid var(--dm-border-faint, #e4e2dd);
    background: var(--dm-bg-panel, #fbfaf7);
    overflow: hidden;
  }
  /* Graceful default: the "after" pane shows even if :checked is unsupported. */
  #dm-cmp-l8-violin .dmc-pane {
    margin: 0;
  }
  #dm-cmp-l8-violin .dmc-pane-after {
    display: block;
  }
  #dm-cmp-l8-violin .dmc-pane-before {
    display: none;
  }
  #dm-cmp-l8-violin .dmc-pane img {
    display: block;
    width: 100%;
    height: auto;
  }
  #dm-cmp-l8-violin-b:checked ~ .dmc-stage .dmc-pane-after {
    display: none;
  }
  #dm-cmp-l8-violin-b:checked ~ .dmc-stage .dmc-pane-before {
    display: block;
    animation: dmcIn 0.16s ease;
  }
  #dm-cmp-l8-violin-a:checked ~ .dmc-stage .dmc-pane-after {
    display: block;
    animation: dmcIn 0.16s ease;
  }
  #dm-cmp-l8-violin .dmc-tab-after {
    background: var(--dm-i-thumb, #fff);
    color: var(--dm-text-strong, #1a1a1a);
    box-shadow: var(--dm-shadow-1, 0 1px 3px rgba(0, 0, 0, 0.18));
  }
  #dm-cmp-l8-violin-b:checked ~ .dmc-tabs .dmc-tab-after {
    background: transparent;
    color: var(--dm-text-muted, #6b6862);
    box-shadow: none;
  }
  #dm-cmp-l8-violin-b:checked ~ .dmc-tabs .dmc-tab-before {
    background: var(--dm-i-thumb, #fff);
    color: var(--dm-text-strong, #1a1a1a);
    box-shadow: var(--dm-shadow-1, 0 1px 3px rgba(0, 0, 0, 0.18));
  }
  @keyframes dmcIn {
    from {
      opacity: 0.4;
    }
    to {
      opacity: 1;
    }
  }
</style>

<div id="dm-cmp-l8-violin">
  <input class="dmc-radio" type="radio" name="dm-cmp-l8-violin" id="dm-cmp-l8-violin-a" checked>
  <input class="dmc-radio" type="radio" name="dm-cmp-l8-violin" id="dm-cmp-l8-violin-b">
  <div class="dmc-tabs dm-tabs" role="tablist" aria-label="Distribution comparison (violin) — compare">
    <label class="dmc-tab dm-tab dmc-tab-after" for="dm-cmp-l8-violin-a">Dartwork</label>
    <label class="dmc-tab dm-tab dmc-tab-before" for="dm-cmp-l8-violin-b">Vanilla</label>
  </div>
  <div class="dmc-stage">
    <figure class="dmc-pane dmc-pane-after">
      <img src="../_static/landing_pocs/poc_08_distribution_after.svg" alt="Distribution comparison (violin) — Dartwork" loading="lazy">
    </figure>
    <figure class="dmc-pane dmc-pane-before">
      <img src="../_static/landing_pocs/poc_08_distribution_before.svg" alt="Distribution comparison (violin) — Vanilla" loading="lazy">
    </figure>
  </div>
</div>
