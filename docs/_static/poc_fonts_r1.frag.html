<div id="dm-fbr1">
<style>
#dm-fbr1 *, #dm-fbr1 *::before, #dm-fbr1 *::after { box-sizing: border-box; }
#dm-fbr1 {
  margin: 0; padding: 0;
  background: var(--dm-bg-page);
  color: var(--dm-text-default);
  font-family: var(--dm-f-sys);

  line-height: 1.5;

}

/* focus discipline: only keyboard focus draws the ring */

#dm-fbr1 :focus-visible {
  outline: 2px solid var(--dm-accent-8);
  outline-offset: 2px;
  border-radius: var(--dm-radius-2);

/* ---------- shell ---------- */
#dm-fbr1 .page { max-width: 880px; margin: 0 auto; padding: var(--dm-space-5) var(--dm-space-4) var(--dm-space-8); }

#dm-fbr1 .masthead { margin: var(--dm-space-2) 0 var(--dm-space-6); max-width: 62ch; }

}
#dm-fbr1 .masthead h1 {
  font-size: 27px; line-height: 1.12; letter-spacing: -0.02em;
  font-weight: 700; color: var(--dm-text-strong); margin: 0 0 var(--dm-space-2);
}
#dm-fbr1 .masthead p { margin: 0; color: var(--dm-text-muted); font-size: 14px; }

/* ---------- workbench: compact rail + results ---------- */
#dm-fbr1 .wb {

  grid-template-columns: 186px minmax(0, 1fr);
  gap: var(--dm-space-5);
  align-items: start;

/* ---------- LEFT: compact sticky rail ---------- */
#dm-fbr1 .rail { position: sticky; top: var(--dm-space-4); display: flex; flex-direction: column; gap: var(--dm-space-4); }

#dm-fbr1 .search-wrap { position: relative; }

#dm-fbr1 #search {

}
#dm-fbr1 #search::placeholder { color: var(--dm-text-faint); }

/* segmented Type control */

/* dense filter rows */
#dm-fbr1 .rows { display: flex; flex-direction: column; gap: 1px; }
#dm-fbr1 .row {

  transition: background .12s, border-color .12s, color .12s;
}
#dm-fbr1 .row:hover { background: var(--dm-bg-hover); }
#dm-fbr1 .row .tick {
  flex: 0 0 auto; width: 13px; height: 13px; border-radius: 4px;
  border: 1.5px solid var(--dm-border-strong); position: relative;
  transition: background .12s, border-color .12s;
}
#dm-fbr1 .row .rn { flex: 1 1 auto; min-width: 0; font-size: 12.5px; color: var(--dm-text-muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#dm-fbr1 .row .rc { flex: 0 0 auto; font-family: var(--dm-f-mono); font-size: 10.5px; color: var(--dm-text-faint); font-variant-numeric: tabular-nums; }
#dm-fbr1 .row[aria-pressed="true"] .tick { background: var(--dm-accent-9); border-color: var(--dm-accent-9); }
#dm-fbr1 .row[aria-pressed="true"] .tick::after {
  content: ""; position: absolute; left: 3.5px; top: 1px; width: 3.5px; height: 7px;
  border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(42deg);
}
#dm-fbr1 .row[aria-pressed="true"] .rn { color: var(--dm-text-strong); font-weight: 500; }
#dm-fbr1 .row[aria-pressed="true"] .rc { color: var(--dm-accent-11); }

#dm-fbr1 .rail-foot {

}
#dm-fbr1 .count-live { font-size: 12.5px; color: var(--dm-text-muted); }
#dm-fbr1 .count-live b { font-family: var(--dm-f-mono); font-variant-numeric: tabular-nums; color: var(--dm-text-strong); }
#dm-fbr1 .clear-all {
  border: 0; background: transparent; cursor: pointer; padding: 2px 3px;
  font-size: 12px; color: var(--dm-text-faint); text-decoration: underline;
  text-underline-offset: 2px; border-radius: var(--dm-radius-2);
}
#dm-fbr1 .clear-all:hover { color: var(--dm-accent-11); }
#dm-fbr1 .clear-all[disabled] { opacity: 0.4; cursor: default; text-decoration: none; }

/* ---------- RIGHT: results ---------- */
#dm-fbr1 .preview-bar { position: relative; margin-bottom: var(--dm-space-3); }
#dm-fbr1 .preview-bar > svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: var(--dm-accent-11); pointer-events: none; }
#dm-fbr1 #preview {
  width: 100%; padding: 10px 34px 10px 34px;
  font-size: 14px; font-family: var(--dm-f-sys);
  color: var(--dm-text-strong); background: var(--dm-bg-panel);
  border: 1px solid var(--dm-border); border-radius: var(--dm-radius-3);
  transition: border-color .15s, box-shadow .15s;
}
#dm-fbr1 #preview::placeholder { color: var(--dm-text-faint); font-weight: 400; }
#dm-fbr1 #preview:focus { border-color: var(--dm-accent-8); box-shadow: var(--dm-shadow-1); }
#dm-fbr1 .preview-clear {
  position: absolute; right: 7px; top: 50%; transform: translateY(-50%);
  border: 0; background: transparent; cursor: pointer; padding: 4px;
  color: var(--dm-text-faint); line-height: 0; border-radius: var(--dm-radius-full); display: none;
}
#dm-fbr1 .preview-bar.has-value .preview-clear { display: block; }
#dm-fbr1 .preview-clear:hover { color: var(--dm-text-default); background: var(--dm-bg-hover); }

#dm-fbr1 .rcount { font-size: 12px; color: var(--dm-text-muted); margin: 0 0 var(--dm-space-3); padding: 0 2px; }
#dm-fbr1 .rcount b { color: var(--dm-text-strong); font-variant-numeric: tabular-nums; }

#dm-fbr1 .grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: var(--dm-space-3); }

/* ---------- card ---------- */
#dm-fbr1 .card {
  background: var(--dm-bg-panel); border: 1px solid var(--dm-border);
  border-radius: var(--dm-radius-4); padding: var(--dm-space-4) var(--dm-space-4) var(--dm-space-3);

#dm-fbr1 .card[data-open="true"] { border-color: var(--dm-accent-8); box-shadow: var(--dm-shadow-2); }

#dm-fbr1 .card-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--dm-space-3); }
#dm-fbr1 .fam-toggle {

  border: 0; background: transparent; cursor: pointer; padding: 0; text-align: left;
}
#dm-fbr1 .fam-name {
  font-size: 22px; line-height: 1.14; letter-spacing: -0.01em;
  color: var(--dm-text-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#dm-fbr1 .chev { flex: 0 0 auto; color: var(--dm-text-faint); line-height: 0; transition: transform .2s, color .12s; }
#dm-fbr1 .fam-toggle:hover .chev { color: var(--dm-accent-11); }
#dm-fbr1 .card[data-open="true"] .chev { transform: rotate(180deg); color: var(--dm-accent-11); }

#dm-fbr1 .id-right { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; flex: 0 0 auto; }
#dm-fbr1 .mpl-chip {
  font-family: var(--dm-f-mono); font-size: 11px; font-weight: 500;
  color: var(--dm-text-muted); background: var(--dm-bg-subtle);
  border: 1px solid var(--dm-border-faint); border-radius: var(--dm-radius-2);
  padding: 3px 7px; cursor: copy; transition: background .12s, color .12s, border-color .12s;
  white-space: nowrap; line-height: 1.3;
}
#dm-fbr1 .mpl-chip:hover { background: var(--dm-accent-3); color: var(--dm-accent-11); border-color: var(--dm-accent-8); }
#dm-fbr1 .mpl-chip.copied { background: var(--dm-accent-3); color: var(--dm-accent-11); border-color: var(--dm-accent-8); }
#dm-fbr1 .badges { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
#dm-fbr1 .badge {
  font-size: 10px; font-weight: 500; padding: 2px 7px;
  border-radius: var(--dm-radius-full); line-height: 1.5;
  background: var(--dm-bg-subtle); color: var(--dm-text-muted);
  border: 1px solid var(--dm-border-faint);
}
#dm-fbr1 .badge.b-script { background: var(--dm-info-3); color: var(--dm-info-11); border-color: transparent; }
#dm-fbr1 .badge.b-mono { background: var(--dm-warning-3); color: var(--dm-warning-11); border-color: transparent; }

#dm-fbr1 .specimen {
  font-size: 20px; line-height: 1.3; color: var(--dm-text-default);
  margin: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* signature: weight-ladder strip */
#dm-fbr1 .wstrip-wrap { }
#dm-fbr1 .wstrip { display: flex; gap: 5px; overflow-x: auto; padding: 1px 1px 3px; }
#dm-fbr1 .wtile {
  flex: 0 0 auto; width: 46px; height: 48px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  border: 1px solid var(--dm-border); border-radius: var(--dm-radius-2);
  background: var(--dm-bg-subtle); cursor: copy;
  transition: transform .12s, border-color .12s, background .12s, box-shadow .12s;
}
#dm-fbr1 .wtile:hover { transform: translateY(-3px); border-color: var(--dm-accent-8); background: var(--dm-bg-panel); box-shadow: var(--dm-shadow-1); }
#dm-fbr1 .wtile.copied { border-color: var(--dm-accent-8); background: var(--dm-accent-3); }
#dm-fbr1 .wt-ag { font-size: 17px; line-height: 1; color: var(--dm-text-strong); }
#dm-fbr1 .wtile.copied .wt-ag { color: var(--dm-accent-11); }
#dm-fbr1 .wt-lbl { font-family: var(--dm-f-mono); font-size: 9.5px; color: var(--dm-text-faint); font-variant-numeric: tabular-nums; }
#dm-fbr1 .wtile.copied .wt-lbl { color: var(--dm-accent-11); }

/* expansion */
#dm-fbr1 .card-exp { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .26s cubic-bezier(.4,0,.2,1); }
#dm-fbr1 .card[data-open="true"] .card-exp { grid-template-rows: 1fr; }
#dm-fbr1 .exp-inner { overflow: hidden; min-height: 0; }
#dm-fbr1 .exp-pad { padding-top: var(--dm-space-3); margin-top: var(--dm-space-1); border-top: 1px dashed var(--dm-border-faint); display: flex; flex-direction: column; gap: var(--dm-space-4); }
#dm-fbr1 .exp-sec .lbl {

  color: var(--dm-text-faint); margin: 0 0 var(--dm-space-2);
}
#dm-fbr1 .hero-line { font-size: 30px; line-height: 1.2; color: var(--dm-text-strong); margin: 0; word-break: break-word; }
#dm-fbr1 .numerals { font-size: 20px; letter-spacing: 0.02em; color: var(--dm-text-default); margin: 0; font-variant-numeric: tabular-nums; }
#dm-fbr1 .intent-txt { font-size: 12.5px; line-height: 1.55; color: var(--dm-text-muted); margin: 0; }

#dm-fbr1 .ladder { display: flex; flex-direction: column; }
#dm-fbr1 .ladder-row { display: flex; align-items: baseline; gap: var(--dm-space-3); padding: 6px 0; border-bottom: 1px solid var(--dm-border-faint); }
#dm-fbr1 .ladder-row:last-child { border-bottom: 0; }
#dm-fbr1 .ladder-meta { flex: 0 0 92px; display: flex; align-items: baseline; gap: 6px; }

#dm-fbr1 .snippet {

#dm-fbr1 .snip-copy:hover { background: var(--dm-accent-3); color: var(--dm-accent-11); border-color: var(--dm-accent-8); }

/* ---------- empty state ---------- */
#dm-fbr1 .empty {
  grid-column: 1 / -1; text-align: center;
  padding: var(--dm-space-8) var(--dm-space-5);

}
#dm-fbr1 .empty button:hover { background: var(--dm-accent-10); }

/* ---------- toast ---------- */
#dm-fbr1 .toast {
  position: fixed; bottom: var(--dm-space-5); left: 50%; transform: translate(-50%, 12px);
  z-index: 80; background: var(--dm-gray-12); color: var(--dm-gray-1);
  font-size: 12.5px; font-weight: 500; padding: 9px 16px;
  border-radius: var(--dm-radius-full); box-shadow: var(--dm-shadow-3);

/* ---------- motion ---------- */
@keyframes fbr-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

/* ---------- responsive ---------- */
@media (max-width: 820px) {
  #dm-fbr1 .wb { grid-template-columns: 1fr; }
  #dm-fbr1 .rail { position: static; }
  #dm-fbr1 .masthead h1 { font-size: 23px; }

@media (prefers-reduced-motion: reduce) {
  #dm-fbr1 *, #dm-fbr1 *::before, #dm-fbr1 *::after { transition: none !important; animation: none !important; }
  #dm-fbr1 .card-exp { transition: none !important; }
}
</style>

var DM_FONT_ORDER = ["roboto", "inter", "source_sans", "inter_display", "ibm_plex_sans", "noto_sans", "noto_semicondensed", "noto_condensed", "pretendard", "paperlogy", "noto_cjk", "ibm_plex_mono", "jetbrains_mono", "source_code_pro", "roboto_mono", "noto_math"];
var DM_FONT_GROUPS = [{"title": "Workhorse", "items": ["roboto", "inter", "source_sans"]}, {"title": "Display", "items": ["inter_display"]}, {"title": "Technical", "items": ["ibm_plex_sans"]}, {"title": "Multilingual", "items": ["noto_sans"]}, {"title": "Condensed", "items": ["noto_semicondensed", "noto_condensed"]}, {"title": "Korean & CJK", "items": ["pretendard", "paperlogy", "noto_cjk"]}, {"title": "Monospace & Symbols", "items": ["ibm_plex_mono", "jetbrains_mono", "source_code_pro", "roboto_mono", "noto_math"]}];

/* ============================================================
   R1 — compact rail + weight-strip cards. Reads DM_FONT_DATA /
   DM_FONT_ORDER / DM_FONT_GROUPS (inlined above). Scoped to
   #dm-fbr1 so it never touches the rest of the docs page. Site
   owns the theme — this script never writes it.
   ============================================================ */
(function () {
  "use strict";

  var ROOT = document.getElementById("dm-fbr1");
  if (!ROOT) return;

  // ---- toast (shared) ---------------------------------------
  var toast = ROOT.querySelector("#toast");
  var toastTimer = null;
  function showToast(html) {
    toast.innerHTML = html;
    toast.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.classList.remove("show"); }, 1800);
  }
  function copyText(text, label) {
    var done = function () { showToast("Copied <b>" + escapeHtml(label) + "</b>"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else {
      legacyCopy(text, done);
    }
  }
  function legacyCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* no-op */ }
    document.body.removeChild(ta);
  }
  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function attr(s) { return String(s).replace(/"/g, "&quot;"); }
  function flash(el) {
    if (!el) return;
    el.classList.add("copied");
    setTimeout(function () { el.classList.remove("copied"); }, 700);
  }

  // ---- data model -------------------------------------------
  var DATA = window.DM_FONT_DATA || {};
  var ORDER = window.DM_FONT_ORDER || Object.keys(DATA);
  var GROUPS = window.DM_FONT_GROUPS || [];
  var MONO_GROUP = "Monospace & Symbols";

  function uniq(arr) {
    var seen = {}, out = [];
    arr.forEach(function (v) { if (!seen[v]) { seen[v] = 1; out.push(v); } });
    return out;
  }

  // pick the face that best carries the family's own identity (near-bold)
  function nameFace(f) {
    var best = f.regular, bd = Infinity;
    f.weights.forEach(function (w) {
      var d = Math.abs(w.num - 640);
      if (d < bd) { bd = d; best = w.face; }
    });
    return best;
  }

  var FAMILIES = ORDER.map(function (key) {
    var f = DATA[key];
    return {
      key: key, raw: f, name: f.name, mpl: f.mpl,
      group: f.group, script: f.script,
      isMono: f.group === MONO_GROUP,
      weightCount: f.weights.length,
      nameFace: nameFace(f),
      hay: [f.name, f.desc, f.personality, f.intent, f.mpl, f.script, f.group, f.application]
        .join(" ").toLowerCase()
    };
  });

  var GROUP_TITLES = GROUPS.map(function (g) { return g.title; });
  var SCRIPTS = uniq(FAMILIES.map(function (f) { return f.script; }));

  // ---- selection state --------------------------------------
  var sel = { group: new Set(), script: new Set(), style: new Set() };
  var query = "";
  var previewText = "";

  function famMatches(f, facet, value) {
    switch (facet) {
      case "group": return f.group === value;
      case "script": return f.script === value;
      case "style": return value === "Mono" ? f.isMono : !f.isMono;
    }
    return false;
  }
  function passesFacet(f, facet) {
    var s = sel[facet];
    if (s.size === 0) return true;
    var ok = false;
    s.forEach(function (v) { if (famMatches(f, facet, v)) ok = true; });
    return ok;
  }
  function passesSearch(f) { return query === "" || f.hay.indexOf(query) !== -1; }
  function isVisible(f) {
    return passesSearch(f) &&
      passesFacet(f, "group") && passesFacet(f, "script") && passesFacet(f, "style");
  }

  // count if `value` in `facet` were the selection, holding OTHER facets + search fixed
  function chipCount(facet, value) {
    return FAMILIES.filter(function (f) {
      if (!passesSearch(f)) return false;
      for (var k in sel) {
        if (k === facet) continue;
        if (!passesFacet(f, k)) return false;
      }
      return famMatches(f, facet, value);
    }).length;
  }
  // families passing search + every facet EXCEPT `skip`
  function passingExcept(skip) {
    return FAMILIES.filter(function (f) {
      if (!passesSearch(f)) return false;
      for (var k in sel) { if (k === skip) continue; if (!passesFacet(f, k)) return false; }
      return true;
    }).length;
  }

  // ---- build dense filter rows ------------------------------
  function buildRows(hostId, facet, values) {
    var host = ROOT.querySelector(hostId);
    values.forEach(function (value) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "row";
      b.setAttribute("aria-pressed", "false");
      b.dataset.facet = facet;
      b.dataset.value = value;
      b.innerHTML = '<span class="tick" aria-hidden="true"></span>' +
        '<span class="rn">' + escapeHtml(value) + '</span>' +
        '<span class="rc">0</span>';
      b.addEventListener("click", function () {
        if (b.dataset.empty === "true" && b.getAttribute("aria-pressed") !== "true") return;
        toggleRow(facet, value);
      });
      host.appendChild(b);
    });
  }
  buildRows("#facetGroup", "group", GROUP_TITLES);
  buildRows("#facetScript", "script", SCRIPTS);

  function toggleRow(facet, value) {
    var s = sel[facet];
    if (s.has(value)) s.delete(value); else s.add(value);
    render();
  }

  // ---- Type segmented ---------------------------------------
  var typeSeg = ROOT.querySelector("#typeSeg");
  typeSeg.querySelectorAll("button[data-style]").forEach(function (b) {
    b.addEventListener("click", function () {
      var v = b.dataset.style;
      sel.style.clear();
      if (v !== "All") sel.style.add(v);
      render();
    });
  });

  // ---- search + preview -------------------------------------
  var searchEl = ROOT.querySelector("#search");
  var searchWrap = ROOT.querySelector("#searchWrap");
  searchEl.addEventListener("input", function () {
    query = searchEl.value.trim().toLowerCase();
    searchWrap.classList.toggle("has-value", searchEl.value !== "");
    render();
  });
  ROOT.querySelector("#searchClear").addEventListener("click", function () {
    searchEl.value = ""; query = ""; searchWrap.classList.remove("has-value");
    searchEl.focus(); render();
  });

  var previewEl = ROOT.querySelector("#preview");
  var previewBar = ROOT.querySelector("#previewBar");
  previewEl.addEventListener("input", function () {
    previewText = previewEl.value;
    previewBar.classList.toggle("has-value", previewText !== "");
    applyPreview();
  });
  ROOT.querySelector("#previewClear").addEventListener("click", function () {
    previewEl.value = ""; previewText = ""; previewBar.classList.remove("has-value");
    previewEl.focus(); applyPreview();
  });
  function applyPreview() {
    grid.querySelectorAll(".specimen").forEach(function (el) {
      el.textContent = previewText !== "" ? previewText : el.dataset.sample;
    });
  }

  // ---- clear all --------------------------------------------
  var clearAllBtn = ROOT.querySelector("#clearAll");
  clearAllBtn.addEventListener("click", clearAll);
  function clearAll() {
    for (var k in sel) sel[k].clear();
    query = ""; searchEl.value = ""; searchWrap.classList.remove("has-value");
    render();
  }
  function anyActive() {
    if (query !== "") return true;
    for (var k in sel) if (sel[k].size) return true;
    return false;
  }

  // ---- render ------------------------------------------------
  var grid = ROOT.querySelector("#grid");
  var railCount = ROOT.querySelector("#railCount");
  var resultCount = ROOT.querySelector("#resultCount");
  var openKeys = {}; // preserve expanded state across re-renders

  function render() {
    // Type segmented: counts + pressed
    var allCt = passingExcept("style");
    ROOT.querySelector("#scAll").textContent = allCt;
    ROOT.querySelector("#scSans").textContent = chipCount("style", "Sans");
    ROOT.querySelector("#scMono").textContent = chipCount("style", "Mono");
    typeSeg.querySelectorAll("button[data-style]").forEach(function (b) {
      var v = b.dataset.style;
      var on = v === "All" ? sel.style.size === 0 : sel.style.has(v);
      b.setAttribute("aria-pressed", String(on));
    });

    // rows: counts + pressed + dim
    ROOT.querySelectorAll(".row").forEach(function (row) {
      var facet = row.dataset.facet, value = row.dataset.value;
      var pressed = sel[facet].has(value);
      var ct = chipCount(facet, value);
      row.setAttribute("aria-pressed", String(pressed));
      row.querySelector(".rc").textContent = ct;
      row.dataset.empty = String(ct === 0 && !pressed);
    });

    var visible = FAMILIES.filter(isVisible);
    railCount.textContent = visible.length;
    resultCount.textContent = visible.length;
    clearAllBtn.disabled = !anyActive();

    grid.innerHTML = "";
    if (visible.length === 0) { renderEmpty(); return; }
    visible.forEach(function (f, i) {
      var card = makeCard(f);
      card.style.animationDelay = Math.min(i * 22, 220) + "ms";
      grid.appendChild(card);
    });
    applyPreview();
  }

  function renderEmpty() {
    var box = document.createElement("div");
    box.className = "empty";
    box.innerHTML =
      '<div class="glyph">( ˘ ³˘)</div>' +
      "<h3>No families match</h3>" +
      "<p>Your filters are narrower than the library. Widen one to bring families back.</p>" +
      '<button type="button" id="emptyClear">Clear filters</button>';
    grid.appendChild(box);
    ROOT.querySelector("#emptyClear").addEventListener("click", clearAll);
  }

  function makeCard(f) {
    var r = f.raw;
    var card = document.createElement("div");
    card.className = "card";
    card.dataset.key = f.key;
    var isOpen = !!openKeys[f.key];
    card.dataset.open = String(isOpen);

    // identity: name in its own face + mpl chip + badges
    var monoBadge = f.isMono ? '<span class="badge b-mono">Mono</span>' : "";
    var head =
      '<div class="card-head">' +
        '<button type="button" class="fam-toggle" aria-expanded="' + isOpen + '">' +
          '<span class="fam-name" style="font-family:\'' + attr(f.nameFace) + "', var(--dm-f-sys)\">" + escapeHtml(f.name) + "</span>" +
          '<span class="chev" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg></span>' +
        "</button>" +
        '<div class="id-right">' +
          '<button type="button" class="mpl-chip" data-mpl="' + attr(f.mpl) + '" title="Copy the matplotlib family name">' + escapeHtml(f.mpl) + "</button>" +
          '<div class="badges">' +
            '<span class="badge b-script">' + escapeHtml(f.script) + "</span>" +
            monoBadge +
            '<span class="badge">' + f.weightCount + " weight" + (f.weightCount === 1 ? "" : "s") + "</span>" +
          "</div>" +
        "</div>" +
      "</div>";

    // live specimen line
    var specimen = '<p class="specimen" data-sample="' + attr(r.sample) + '" style="font-family:\'' +
      attr(r.regular) + "', var(--dm-f-sys)\">" + escapeHtml(r.sample) + "</p>";

    // weight-ladder strip (signature)
    var tiles = r.weights.map(function (w) {
      return '<button type="button" class="wtile" data-num="' + w.num + '" data-label="' + attr(w.label) +
        '" title="Copy fontweight — ' + attr(w.label + " (" + w.num + ")") + '">' +
        '<span class="wt-ag" style="font-family:\'' + attr(w.face) + "', var(--dm-f-sys)\">Ag</span>" +
        '<span class="wt-lbl">' + w.num + "</span></button>";
    }).join("");
    var strip = '<div class="wstrip-wrap"><div class="wstrip">' + tiles + "</div></div>";

    // expansion: full ladder + hero + numerals + intent + rcParams
    var ladder = r.weights.map(function (w) {
      return '<div class="ladder-row">' +
        '<div class="ladder-meta"><span class="w-label">' + escapeHtml(w.label) + '</span>' +
        '<span class="w-num">' + w.num + "</span></div>" +
        '<div class="ladder-sample" style="font-family:\'' + attr(w.face) + "', var(--dm-f-sys)\">Agile data 24</div>" +
        "</div>";
    }).join("");
    var exp =
      '<div class="card-exp"><div class="exp-inner"><div class="exp-pad">' +
        '<div class="exp-sec"><p class="lbl">Hero glyphs</p>' +
          '<p class="hero-line" style="font-family:\'' + attr(r.regular) + "', var(--dm-f-sys)\">" + escapeHtml(r.hero) + "</p></div>" +
        '<div class="exp-sec"><p class="lbl">Numerals &amp; symbols</p>' +
          '<p class="numerals" style="font-family:\'' + attr(r.regular) + "', var(--dm-f-mono)\">0123456789 &nbsp; . , $ %</p></div>" +
        '<div class="exp-sec"><p class="lbl">Weight ladder</p><div class="ladder">' + ladder + "</div></div>" +
        '<div class="exp-sec"><p class="lbl">Why this face</p><p class="intent-txt">' + escapeHtml(r.intent) + "</p></div>" +
        '<div class="exp-sec"><p class="lbl">rcParams</p>' +
          '<div class="snippet"><button type="button" class="snip-copy" data-mpl="' + attr(f.mpl) + '">Copy</button>' +
          escapeHtml("import dartwork_mpl as dm\ndm.set_theme()\nplt.rcParams[\"font.family\"] = \"" + f.mpl + "\"") +
          "</div></div>" +
      "</div></div></div>";

    card.innerHTML = head + specimen + strip + exp;
    return card;
  }

  function toggleCard(card) {
    var open = card.dataset.open === "true";
    card.dataset.open = String(!open);
    openKeys[card.dataset.key] = !open;
    var tog = card.querySelector(".fam-toggle");
    if (tog) tog.setAttribute("aria-expanded", String(!open));
  }

  // ---- delegated interactions -------------------------------
  grid.addEventListener("click", function (e) {
    var tile = e.target.closest(".wtile");
    if (tile) { var hint = "fontweight=" + tile.dataset.num; copyText(hint, hint); flash(tile); return; }
    var chip = e.target.closest(".mpl-chip");
    if (chip) { copyText(chip.dataset.mpl, chip.dataset.mpl); flash(chip); return; }
    var snip = e.target.closest(".snip-copy");
    if (snip) {
      var code = 'import dartwork_mpl as dm\ndm.set_theme()\nplt.rcParams["font.family"] = "' + snip.dataset.mpl + '"';
      copyText(code, "rcParams snippet"); return;
    }
    var tog = e.target.closest(".fam-toggle");
    if (tog) { toggleCard(tog.closest(".card")); return; }
  });

  // ---- boot --------------------------------------------------
  render();
})();
