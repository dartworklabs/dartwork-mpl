<!doctype html>
<!--
  landing_button_pocs.html — CTA button COLOR combinations. Decided: soft style,
  no underline. Open: the two-teal pairing felt off, so here are varied colour
  pairings (primary x secondary), all soft-leaning, no underline. Shown on the
  real L1 tagline + subtitle so the pairing is judged in context. Real tokens,
  theme toggle. Serve from docs/_static: python3 -m http.server 8137
-->
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Landing CTA — button colour combos</title>
  <link rel="stylesheet" href="dartwork-design.css" />
  <link rel="stylesheet" href="dm-interactive.css" />
  <style>
    body { margin:0; background:var(--dm-bg-page); color:var(--dm-gray-12);
      font-family:var(--dm-f-sys,"Inter",system-ui,sans-serif); letter-spacing:-.003em; }
    .wrap { max-width:920px; margin:0 auto; padding:36px 24px 120px; }
    .bar { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:12px 16px; margin:-36px -24px 16px; background:var(--dm-bg-panel);
      border-bottom:1px solid var(--dm-border-faint); flex-wrap:wrap; }
    .bar .t { font-size:15px; font-weight:700; }
    .bar p { margin:0; font-size:12.5px; color:var(--dm-text-muted); flex-basis:100%; line-height:1.5; }
    .tt { background:var(--dm-bg-panel); color:var(--dm-gray-12); border:1px solid var(--dm-border);
      border-radius:999px; padding:6px 13px; font:inherit; font-size:13px; cursor:pointer; }

    .tl { font-weight:800; line-height:1.12; letter-spacing:-.028em; margin:0 0 .4em; white-space:nowrap;
      font-size:clamp(20px,4.4vw,44px); color:var(--dm-gray-12); }
    .tl .bf, .tl .ai { color:var(--dm-accent-11); }
    .sub { font-size:1.05rem; color:var(--dm-text-muted); max-width:520px; margin:0 auto 1.5em; }

    .poc { margin-top:18px; padding:26px 20px; border:1px solid var(--dm-border-faint); border-radius:var(--dm-radius-5); text-align:center; }
    .poc .lbl { display:inline-block; font-family:var(--dm-f-mono,monospace); font-size:11px; font-weight:600;
      color:#fff; background:var(--dm-accent-9); border-radius:6px; padding:2px 8px; margin-bottom:6px; }
    .poc .lbl.rec { background:var(--dm-accent-11); }
    .poc .d { font-size:12px; color:var(--dm-text-muted); margin:2px 0 16px; }
    .cta { display:flex; justify-content:center; align-items:center; gap:14px; flex-wrap:wrap; }
    /* text-decoration:none !important — beat the .yue a link underline (the
       real .dm-landing-btn does the same; without it the POC showed a stray
       underline). No underline on these buttons, period. */
    .b { display:inline-flex; align-items:center; gap:7px; padding:11px 24px; font-size:.95rem; font-weight:600;
      border-radius:var(--dm-radius-5); text-decoration:none !important; cursor:pointer; transition:all .18s; border:1px solid transparent; }
    .b:hover { text-decoration:none !important; }

    /* primaries */
    .p-solid { background:var(--dm-accent-9); color:#fff; }
    .p-solid:hover { background:var(--dm-accent-10); }
    .p-soft { background:var(--dm-accent-3); color:var(--dm-accent-11); }
    .p-soft:hover { background:var(--dm-accent-4,#cdeee6); }
    .p-ink { background:var(--dm-gray-12); color:var(--dm-bg-page); }
    .p-ink:hover { background:var(--dm-gray-11); }
    /* secondaries (soft / ghost, no underline) */
    .s-gray { background:var(--dm-gray-3); color:var(--dm-gray-12); }
    .s-gray:hover { background:var(--dm-gray-4); }
    .s-ghost { background:transparent; color:var(--dm-gray-11); }
    .s-ghost:hover { background:var(--dm-gray-a3); color:var(--dm-gray-12); }
    .s-tealghost { background:transparent; color:var(--dm-accent-11); }
    .s-tealghost:hover { background:var(--dm-accent-3); }
    .s-softteal { background:var(--dm-accent-3); color:var(--dm-accent-11); }
    .s-softteal:hover { background:var(--dm-accent-4,#cdeee6); }
  </style>
</head>
<body class="yue">
  <div class="wrap">
    <div class="bar">
      <span class="t">Landing CTA — button colour combos</span>
      <button class="tt" id="tt" type="button">◐ theme</button>
      <p>Soft-leaning, no underline. Varied primary × secondary colour pairings so the two buttons read distinct (not two teals). Judge in the real hero context; toggle light/dark.</p>
    </div>
    <div id="g"></div>
  </div>
  <script>
    var HERO =
      '<p class="tl"><span>matplotlib, but </span><span class="bf">beautiful</span><span> — built for </span><span class="ai">AI agents</span><span>.</span></p>'+
      '<p class="sub">Publication-quality plots with zero learning curve.</p>';

    var POCS = [
      { id:"K1", rec:true, name:"Solid teal · Neutral-gray soft",
        d:"Primary pops in teal; secondary is a quiet neutral chip — clear hierarchy, two distinct colours, no teal-on-teal.",
        pri:"p-solid", sec:"s-gray" },
      { id:"K2", name:"Solid teal · Ghost (no fill)",
        d:"Primary teal; secondary is a borderless ghost that only fills on hover. Minimal, lets the primary lead.",
        pri:"p-solid", sec:"s-ghost" },
      { id:"K3", name:"Soft teal · Neutral-gray soft",
        d:"Both soft (no solid fill) — gentler; teal vs gray keeps them distinct. Matches the 'soft is better' note.",
        pri:"p-soft", sec:"s-gray" },
      { id:"K4", name:"Ink (near-black) · Soft teal",
        d:"Primary is neutral ink, secondary carries the teal — inverts the accent so the brand colour sits on the AI/Agents action.",
        pri:"p-ink", sec:"s-softteal" },
      { id:"K5", name:"Soft teal · Teal ghost",
        d:"All-teal but two weights (filled vs ghost). Closest to current; included for comparison.",
        pri:"p-soft", sec:"s-tealghost" },
    ];
    var g = document.getElementById("g");
    POCS.forEach(function(p){
      var s=document.createElement("section"); s.className="poc";
      s.innerHTML='<span class="lbl'+(p.rec?' rec':'')+'">'+p.id+(p.rec?' · rec':'')+'</span>'+
        '<p class="d">'+p.name+' — '+p.d+'</p>'+HERO+
        '<div class="cta"><a class="b '+p.pri+'">Get Started →</a><a class="b '+p.sec+'">AI / Agents →</a></div>';
      g.appendChild(s);
    });
    document.getElementById("tt").addEventListener("click",function(){
      var r=document.documentElement; r.classList.toggle("dark"); r.classList.toggle("light");
      document.body.setAttribute("data-theme", r.classList.contains("dark")?"dark":"light");
    });
  </script>
</body>
</html>
