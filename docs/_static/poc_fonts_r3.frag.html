var DM_FONT_GROUPS = [{"title": "Workhorse", "items": ["roboto", "inter", "source_sans"]}, {"title": "Display", "items": ["inter_display"]}, {"title": "Technical", "items": ["ibm_plex_sans"]}, {"title": "Multilingual", "items": ["noto_sans"]}, {"title": "Condensed", "items": ["noto_semicondensed", "noto_condensed"]}, {"title": "Korean & CJK", "items": ["pretendard", "paperlogy", "noto_cjk"]}, {"title": "Monospace & Symbols", "items": ["ibm_plex_mono", "jetbrains_mono", "source_code_pro", "roboto_mono", "noto_math"]}];
</script>

<script>
/* ============================================================
   Faceted font browser R3 — palette-twin.
   Reads DM_FONT_DATA / DM_FONT_ORDER / DM_FONT_GROUPS (inlined
   above). Scoped to #dm-fbr3; the docs own the light/dark theme.
   Signature: the rail IS the categorical-explorer rail, and the
   weight ladder IS a copyable swatch strip.
   ============================================================ */
(function () {
  "use strict";

  var ROOT = document.getElementById("dm-fbr3");
  if (!ROOT) return;

  // ---- helpers ------------------------------------------------
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var toastEl = ROOT.querySelector("#fbr3-toast");
  var toastTimer = null;
  function showToast(html) {
    toastEl.innerHTML = html;
    toastEl.classList.add("show");
    if (toastTimer) clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toastEl.classList.remove("show"); }, 1600);
  }
  function copyText(text, label) {
    var done = function () { showToast("Copied <b>" + esc(label) + "</b>"); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(done, function () { legacyCopy(text, done); });
    } else { legacyCopy(text, done); }
  }
  function legacyCopy(text, done) {
    var ta = document.createElement("textarea");
    ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    ROOT.appendChild(ta); ta.select();
    try { document.execCommand("copy"); done(); } catch (e) { /* no-op */ }
    ROOT.removeChild(ta);
  }
  function flash(el) {
    if (!el) return;
    el.classList.add("copied");
    setTimeout(function () { el.classList.remove("copied"); }, 900);
  }

  // ---- data model --------------------------------------------
  var DATA = window.DM_FONT_DATA || {};
  var ORDER = window.DM_FONT_ORDER || Object.keys(DATA);
  var GROUPS = window.DM_FONT_GROUPS || [];
  var MONO_GROUP = "Monospace & Symbols";
  var LAT = "The dartwork designs beautiful data artworks.";

  function uniq(arr) {
    var seen = {}, out = [];
    arr.forEach(function (v) { if (!seen[v]) { seen[v] = 1; out.push(v); } });
    return out;
  }

  var FAMILIES = ORDER.map(function (key) {
    var f = DATA[key];
    return {
      key: key, raw: f, name: f.name, mpl: f.mpl,
      group: f.group, script: f.script, isMono: f.group === MONO_GROUP,
      weightCount: f.weights.length,
      hay: [f.name, f.desc, f.personality, f.intent, f.mpl, f.script, f.group, f.application]
        .join(" ").toLowerCase()
    };
  });
  var BYKEY = {};
  FAMILIES.forEach(function (f) { BYKEY[f.key] = f; });

  var GROUP_TITLES = GROUPS.map(function (g) { return g.title; });
  var SCRIPTS = uniq(FAMILIES.map(function (f) { return f.script; }));

  // per-family glyph for the mini + tiles (script-aware)
  function famGlyph(f) {
    if (/Math/.test(f.script)) return "∑π";       // ∑π
    if (/한글/.test(f.script)) return "가A";     // 가A
    if (/CJK/.test(f.script)) return "한字";         // 한字
    return "Ag";
  }

  // ---- facets -------------------------------------------------
  var FACETS = [
    { facet: "group", label: "Group", values: GROUP_TITLES },
    { facet: "script", label: "Script", values: SCRIPTS },
    { facet: "style", label: "Style", values: ["Sans", "Mono"] }
  ];

  function famMatches(f, facet, value) {
    switch (facet) {
      case "group": return f.group === value;
      case "script": return f.script === value;
      case "style": return value === "Mono" ? f.isMono : !f.isMono;
    }
    return false;
  }

  var sel = { group: new Set(), script: new Set(), style: new Set() };
  var state = { query: "", customText: "", glyphMode: "letters" };
  var openKeys = new Set();

  function passesFacet(f, facet) {
    var s = sel[facet];
    if (s.size === 0) return true;
    var ok = false;
    s.forEach(function (v) { if (famMatches(f, facet, v)) ok = true; });
    return ok;
  }
  function passesSearch(f) { return state.query === "" || f.hay.indexOf(state.query) !== -1; }
  function isVisible(f) {
    return passesSearch(f) && passesFacet(f, "group") && passesFacet(f, "script") && passesFacet(f, "style");
  }
  // count if this value were added, holding OTHER facets + search fixed
  function chipCount(facet, value) {
    return FAMILIES.filter(function (f) {
      if (!passesSearch(f)) return false;
      for (var k in sel) { if (k === facet) continue; if (!passesFacet(f, k)) return false; }
      return famMatches(f, facet, value);
    }).length;
  }
  function anyActive() {
    if (state.query !== "") return true;
    for (var k in sel) if (sel[k].size) return true;
    return false;
  }

  // representative face + glyph for a facet mini-preview
  function repFace(facet, value) {
    for (var i = 0; i < FAMILIES.length; i++) if (famMatches(FAMILIES[i], facet, value)) return FAMILIES[i].raw.regular;
    return FAMILIES[0].raw.regular;
  }
  function repGlyph(facet, value) {
    if (facet === "style") return "Ag";
    for (var i = 0; i < FAMILIES.length; i++) if (famMatches(FAMILIES[i], facet, value)) return famGlyph(FAMILIES[i]);
    return "Ag";
  }

  // ---- rail ---------------------------------------------------
  var facetsEl = ROOT.querySelector("#fbr3-facets");
  function railHTML() {
    var h = "";
    FACETS.forEach(function (spec) {
      h += '<div class="fh">' + esc(spec.label) + "</div>";
      spec.values.forEach(function (value) {
        var on = sel[spec.facet].has(value);
        var ct = chipCount(spec.facet, value);
        var empty = ct === 0 && !on;
        var face = repFace(spec.facet, value);
        h += '<button type="button" class="ri' + (on ? " on" : "") + (empty ? " empty" : "") + '"' +
          ' data-facet="' + spec.facet + '" data-value="' + esc(value) + '" aria-pressed="' + on + '">' +
          '<span class="rmini" style="font-family:\'' + face + "', var(--dm-f-sys)\">" + esc(repGlyph(spec.facet, value)) + "</span>" +
          '<span class="rnm">' + esc(value) + "</span>" +
          '<span class="rct">' + ct + "</span>" +
          "</button>";
      });
    });
    return h;
  }
  facetsEl.addEventListener("click", function (e) {
    var ri = e.target.closest(".ri");
    if (!ri || ri.classList.contains("empty")) return;
    var facet = ri.dataset.facet, value = ri.dataset.value;
    var s = sel[facet];
    if (s.has(value)) s.delete(value); else s.add(value);
    render();
  });

  // ---- search / clear ----------------------------------------
  var searchEl = ROOT.querySelector("#fbr3-search");
  var searchWrap = ROOT.querySelector("#fbr3-rsearch");
  var searchClear = ROOT.querySelector("#fbr3-rsx");
  searchEl.addEventListener("input", function () {
    state.query = searchEl.value.trim().toLowerCase();
    searchWrap.classList.toggle("on", searchEl.value !== "");
    render();
  });
  searchClear.addEventListener("click", function () {
    searchEl.value = ""; state.query = "";
    searchWrap.classList.remove("on"); searchEl.focus(); render();
  });
  var clearBtn = ROOT.querySelector("#fbr3-clear");
  clearBtn.addEventListener("click", clearAll);
  function clearAll() {
    for (var k in sel) sel[k].clear();
    state.query = ""; searchEl.value = ""; searchWrap.classList.remove("on");
    render();
  }

  // ---- top controls: preview text + tile glyph ---------------
  var textEl = ROOT.querySelector("#fbr3-text");
  textEl.addEventListener("input", function () {
    state.customText = textEl.value;
    updateSpecimens();
  });
  var segEl = ROOT.querySelector("#fbr3-seg");
  segEl.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-g]");
    if (!b) return;
    state.glyphMode = b.dataset.g;
    segEl.querySelectorAll("button").forEach(function (x) { x.classList.toggle("on", x.dataset.g === state.glyphMode); });
    updateTiles();
  });

  // ---- python highlight (mirrors palette pyHi) ---------------
  var PYKW = { "import": "kn", "from": "kn", "as": "k", "def": "k", "return": "k", "for": "k", "in": "k", "None": "kc", "True": "kc", "False": "kc" };
  function pyHi(code) {
    return code.split("\n").map(function (line) {
      if (/^\s*#/.test(line)) return '<span class="c1">' + esc(line) + "</span>";
      var imp = /^\s*(import|from)\b/.test(line), nameCls = imp ? "nn" : "n", out = "";
      var re = /(\s+)|('[^']*'|"[^"]*")|(\b\d+\b)|([A-Za-z_]\w*)|(.)/g, m;
      while ((m = re.exec(line))) {
        if (m[1]) out += '<span class="w">' + m[1] + "</span>";
        else if (m[2]) out += '<span class="' + (m[2][0] === "'" ? "s1" : "s2") + '">' + esc(m[2]) + "</span>";
        else if (m[3]) out += '<span class="mi">' + m[3] + "</span>";
        else if (m[4]) { var w = m[4]; out += '<span class="' + (PYKW[w] || nameCls) + '">' + w + "</span>"; }
        else { var ch = m[5], cc = (ch === "(" || ch === ")" || ch === ",") ? "p" : ((ch === "." || ch === "=") ? "o" : ""); out += cc ? '<span class="' + cc + '">' + esc(ch) + "</span>" : esc(ch); }
      }
      return out;
    }).join("\n");
  }
  function snippetFor(f) {
    return 'import dartwork_mpl as dm\ndm.set_theme()\nplt.rcParams["font.family"] = "' + f.mpl + '"';
  }

  // ---- card ---------------------------------------------------
  var grid = ROOT.querySelector("#fbr3-grid");
  var CHEV = '<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"></path></svg>';

  function tileGlyph(f) { return state.glyphMode === "numbers" ? "012" : famGlyph(f); }

  function cardHTML(f) {
    var reg = f.raw.regular;
    var open = openKeys.has(f.key);
    var isKR = f.group === "Korean & CJK";
    var mainText = state.customText || (isKR ? LAT : f.raw.sample);
    var glyph = tileGlyph(f);

    var tiles = f.raw.weights.map(function (w) {
      return '<button type="button" class="ws" data-w="' + w.num + '">' +
        '<span class="ws-tile" style="font-family:\'' + w.face + "', var(--dm-f-sys); font-weight:" + w.num + '">' + esc(glyph) + "</span>" +
        '<span class="ws-lb">' + esc(w.label) + ' <span class="ws-num">' + w.num + "</span></span>" +
        "</button>";
    }).join("");

    var badges = '<span class="fbadge">' + f.weightCount + " wt</span>" +
      '<span class="fbadge script">' + esc(f.script) + "</span>" +
      (f.isMono ? '<span class="fbadge mono">Mono</span>' : "");

    var krLine = isKR
      ? '<p class="fspec kr" style="font-family:\'' + reg + "', var(--dm-f-sys); display:" + (state.customText ? "none" : "block") + '">' + esc(f.raw.sample) + "</p>"
      : "";

    var detail =
      '<div class="fsec"><p class="flbl">Hero</p><p class="fhero" style="font-family:\'' + reg + "', var(--dm-f-sys)\">" + esc(f.raw.hero) + "</p></div>" +
      '<div class="fsec"><p class="flbl">Numerals &amp; symbols</p><p class="fnum" style="font-family:\'' + reg + "', var(--dm-f-mono)\">0123456789 &nbsp; ., $ %</p></div>" +
      '<div class="fsec"><p class="flbl">Why this face</p><p class="fwhy">' + esc(f.raw.intent) + "</p></div>" +
      '<div class="fsec"><p class="flbl">rcParams snippet</p><div class="code highlight"><button type="button" class="csnip-copy">Copy</button><pre>' + pyHi(snippetFor(f)) + "</pre></div></div>";

    return '<div class="fcard' + (open ? " open" : "") + '" data-key="' + f.key + '">' +
      '<div class="fhead">' +
        '<button type="button" class="fexpand" aria-expanded="' + open + '">' +
          '<span class="fname" style="font-family:\'' + reg + "', var(--dm-f-sys)\">" + esc(f.name) + "</span>" + CHEV +
        "</button>" +
        '<div class="fside">' +
          '<button type="button" class="d-key" title="Copy mpl family name">' + esc(f.mpl) + "</button>" +
          '<div class="fbadges">' + badges + "</div>" +
        "</div>" +
      "</div>" +
      '<p class="fspec main" style="font-family:\'' + reg + "', var(--dm-f-sys)\">" + esc(mainText) + "</p>" +
      krLine +
      '<div class="wstrip">' + tiles + "</div>" +
      '<div class="fdetail">' + detail + "</div>" +
    "</div>";
  }

  function emptyHTML() {
    return '<div class="empty"><div class="eg">( ˘ ³˘)</div>' +
      "<h4>No families match</h4>" +
      "<p>Your filters are narrower than the library. Clear a facet to widen the search.</p>" +
      '<button type="button" id="fbr3-emptyclear">Clear all filters</button></div>';
  }

  // grid interactions (delegated — survives re-render)
  grid.addEventListener("click", function (e) {
    var dk = e.target.closest(".d-key");
    if (dk) { var f1 = BYKEY[dk.closest(".fcard").dataset.key]; copyText(f1.mpl, f1.mpl); flash(dk); return; }
    var ws = e.target.closest(".ws");
    if (ws) { var w = ws.dataset.w; copyText("fontweight=" + w, "fontweight=" + w); flash(ws); return; }
    var cp = e.target.closest(".csnip-copy");
    if (cp) { var f2 = BYKEY[cp.closest(".fcard").dataset.key]; copyText(snippetFor(f2), "rcParams snippet"); flash(cp); return; }
    var ec = e.target.closest("#fbr3-emptyclear");
    if (ec) { clearAll(); return; }
    var ex = e.target.closest(".fexpand");
    if (ex) {
      var card = ex.closest(".fcard"), key = card.dataset.key;
      if (openKeys.has(key)) openKeys.delete(key); else openKeys.add(key);
      var nowOpen = openKeys.has(key);
      card.classList.toggle("open", nowOpen);
      ex.setAttribute("aria-expanded", String(nowOpen));
    }
  });

  // in-place updates (no re-render → no flashing while typing)
  function updateSpecimens() {
    grid.querySelectorAll(".fcard").forEach(function (card) {
      var f = BYKEY[card.dataset.key], isKR = f.group === "Korean & CJK";
      var main = card.querySelector(".fspec.main"), kr = card.querySelector(".fspec.kr");
      if (main) main.textContent = state.customText || (isKR ? LAT : f.raw.sample);
      if (kr) kr.style.display = state.customText ? "none" : "block";
    });
  }
  function updateTiles() {
    grid.querySelectorAll(".fcard").forEach(function (card) {
      var f = BYKEY[card.dataset.key], t = tileGlyph(f);
      card.querySelectorAll(".ws-tile").forEach(function (el) { el.textContent = t; });
    });
  }

  // ---- render -------------------------------------------------
  var liveEl = ROOT.querySelector("#fbr3-live");
  var railCountEl = ROOT.querySelector("#fbr3-rcount");
  function render() {
    facetsEl.innerHTML = railHTML();
    var visible = FAMILIES.filter(isVisible);
    liveEl.textContent = visible.length;
    railCountEl.textContent = visible.length;
    clearBtn.disabled = !anyActive();
    grid.innerHTML = visible.length ? visible.map(cardHTML).join("") : emptyHTML();
  }

  render();
})();
</script>
</div>
