<!doctype html>
<!--
  discrete_palette_pocs.html — candidate DISCRETE categorical palettes for
  dartwork-mpl, one set per use-context (report / scientific / infographic),
  each rendered as swatches + a mini bar mock + a mini multi-line mock so the
  palette is judged IN USE, not as abstract chips. Designed in OKLCH, CVD-aware,
  grayscale/print-checked (see the rationale doc). Links real dartwork tokens
  for page chrome; palette colors are the candidates themselves. Theme toggle.
  Serve from docs/_static: python3 -m http.server 8137
-->
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dartwork — discrete palette candidates</title>
  <link rel="stylesheet" href="dartwork-design.css" />
  <link rel="stylesheet" href="dm-interactive.css" />
  <style>
    body { margin:0; background:var(--dm-bg-page); color:var(--dm-gray-12);
      font-family:var(--dm-f-sys,"Inter",system-ui,sans-serif); letter-spacing:-.003em; }
    .wrap { max-width:980px; margin:0 auto; padding:36px 24px 120px; }
    .bar { position:sticky; top:0; z-index:50; display:flex; align-items:center; justify-content:space-between;
      gap:12px; padding:12px 16px; margin:-36px -24px 16px; background:var(--dm-bg-panel);
      border-bottom:1px solid var(--dm-border-faint); flex-wrap:wrap; }
    .bar .t { font-size:15px; font-weight:700; }
    .bar p { margin:0; font-size:12.5px; color:var(--dm-text-muted); flex-basis:100%; line-height:1.5; }
    .tt { background:var(--dm-bg-panel); color:var(--dm-gray-12); border:1px solid var(--dm-border);
      border-radius:999px; padding:6px 13px; font:inherit; font-size:13px; cursor:pointer; }
    .ctx { margin-top:40px; }
    .ctx > h2 { font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.07em;
      color:var(--dm-accent-11); padding-bottom:8px; border-bottom:1px solid var(--dm-border-faint); }
    .pal { margin-top:20px; padding:20px; border:1px solid var(--dm-border-faint); border-radius:var(--dm-radius-5); }
    .pal-h { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
    .pal-id { font-family:var(--dm-f-mono,monospace); font-size:11px; font-weight:600; color:#fff;
      background:var(--dm-accent-9); border-radius:6px; padding:2px 8px; }
    .pal-id.rec { background:var(--dm-accent-11); }
    .pal-n { font-size:16px; font-weight:700; margin:0; }
    .pal-c { font-size:12px; color:var(--dm-text-muted); }
    .pal-r { width:100%; margin:4px 0 0; font-size:12.5px; color:var(--dm-text-muted); line-height:1.5; }
    .sw-strip { display:flex; gap:8px; margin:16px 0; flex-wrap:wrap; }
    .sw { width:72px; }
    .sw .chip { height:46px; border-radius:var(--dm-radius-3); }
    .sw .hx { font-family:var(--dm-f-mono,monospace); font-size:10px; color:var(--dm-text-muted); margin-top:4px; text-align:center; }
    .sw .nm { font-size:9.5px; color:var(--dm-text-muted); text-align:center; opacity:.8; }
    .mocks { display:grid; grid-template-columns:1fr 1fr; gap:18px; margin-top:6px; }
    @media (max-width:640px){ .mocks { grid-template-columns:1fr; } }
    .mock { border:1px solid var(--dm-border-faint); border-radius:var(--dm-radius-4); padding:12px; }
    .mock .mt { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.05em; color:var(--dm-text-muted); margin:0 0 8px; }
    .notes { margin-top:14px; font-size:11.5px; color:var(--dm-text-muted); line-height:1.55; display:grid; gap:3px; }
    .notes b { color:var(--dm-gray-12); font-weight:600; }
    .gray-toggle { margin-left:auto; }
    svg { display:block; width:100%; height:auto; }
    .gs svg { filter:grayscale(1); }   /* grayscale-preview toggle per palette */
  </style>
</head>
<body class="yue">
  <div class="wrap">
    <div class="bar">
      <span class="t">dartwork — discrete palette candidates</span>
      <button class="tt" id="tt" type="button">◐ theme</button>
      <p>Two candidates per context, each shown as swatches + a bar mock + a line mock (judge it IN USE). "B&amp;W" per palette previews grayscale (print) survival. Full design rationale in the criteria doc.</p>
    </div>
    <div id="g"></div>
  </div>

  <script>
    const PALS = {
      report: [
        { id:"R1", rec:false, name:"Report · Neutral", count:5, rationale:"Conservative, print-safe; muted 35–50% chroma signals institutional gravity. Anchored on house teal. For white-page PDFs, board decks.",
          colors:[["#12a594","Teal"],["#6b5b54","Taupe"],["#2d5a6d","Slate Blue"],["#a85a4f","Dusty Rust"],["#5a6f5f","Sage"]],
          cvd:"HIGH (deuter/protan); tritan medium", print:"Med-high grayscale (tight L 40–55, add markers); high CMYK", when:"Financial reports, investor/board decks, prospectuses" },
        { id:"R2", rec:true, name:"Report · Vivid", count:6, rationale:"Bolder 6-color: higher saturation + wider lightness spread (30–65%) for on-screen clarity; keeps CVD + print safety. For digital-first decks/dashboards.",
          colors:[["#12a594","Teal"],["#1f3a5f","Deep Navy"],["#c85a3a","Warm Coral"],["#4a7c59","Forest"],["#9b6b3d","Brown"],["#5a6b7f","Gray-Blue"]],
          cvd:"HIGH (deuter/protan); tritan medium", print:"Med-high grayscale (L 30–55); high CMYK", when:"Digital-first reports, quarterly/ESG dashboards, web decks" },
      ],
      scientific: [
        { id:"S1", rec:true, name:"Okabe-Ito Refined (standard)", count:5, rationale:"The gold-standard CVD-safe set (Okabe-Ito 2008). Hue spacing on a colorblind-safe wheel; mandatory-grade for Nature/Science/PLOS. Muted, austere.",
          colors:[["#E69F00","Orange"],["#0173B2","Blue"],["#029E73","Green"],["#CC79A7","Pink"],["#56B4E9","Sky"]],
          cvd:"PASS all 3 types >95% (gold standard)", print:"PASS grayscale + CMYK (L 45–70, ≥15% ΔL)", when:"Top-tier journals w/ CVD mandate; any publication figure" },
        { id:"S2", rec:false, name:"Dartwork Scientific (teal-anchored)", count:6, rationale:"Journal-grade rigor + dartwork brand: anchors on house teal, extends with CVD-safe hues. More hue-diverse than Okabe-Ito, still publication-safe.",
          colors:[["#12a594","Teal"],["#E67E22","Burnt Orange"],["#2E86AB","Navy"],["#A23B72","Mauve"],["#1B998B","Forest Teal"],["#6C757D","Slate"]],
          cvd:"PASS deuter/protan >90%; tritan >85%", print:"PASS grayscale + CMYK (L 40–55)", when:"Dartwork publications/reports where brand teal is desired" },
      ],
      infographic: [
        { id:"I1", rec:true, name:"Mosaic", count:8, rationale:"Warm/cool split (3 warm + 3 cool + 2 neutral) spanning the OKLCH wheel; balanced, no single dominator. Center lightness dip maximizes screen contrast.",
          colors:[["#C41E3A","Crimson"],["#FF6B35","Tangerine"],["#FDB833","Marigold"],["#12A594","Teal"],["#0066CC","Cobalt"],["#5B4B8A","Iris"],["#6B7280","Slate"],["#2D3E50","Charcoal"]],
          cvd:"HIGH (warm hue-ramp + cool cluster + neutrals)", print:"HIGH grayscale (staggered L 32–66)", when:"Editorial dashboards 8+ KPIs, mixed-sentiment infographics" },
        { id:"I2", rec:false, name:"Spectrum", count:8, rationale:"Full hue-wheel traversal (red→yellow→green→cyan→blue→magenta), max perceptual spacing (~60h apart), staggered lightness. Bold, high-contrast, 'pops'.",
          colors:[["#E63946","Red"],["#F4D35E","Yellow"],["#52B788","Green"],["#06D6A0","Seafoam"],["#118AB2","Blue"],["#D946EF","Magenta"],["#F97316","Orange"],["#06B6D4","Sky"]],
          cvd:"MEDIUM-HIGH (some red/orange adjacency in deuter)", print:"HIGH grayscale (alternating L)", when:"Complex 8+ category infographics, vivid editorial graphics" },
      ],
    };

    function bars(cols){
      const h=[62,40,78,52,70,46,58,66], n=cols.length, bw=100/n, g=2;
      let s='<svg viewBox="0 0 100 50" preserveAspectRatio="none">';
      for(let i=0;i<n;i++){ const x=i*bw+g/2, w=bw-g, bh=h[i%h.length]*0.45, y=50-bh;
        s+=`<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${bh.toFixed(1)}" rx="0.6" fill="${cols[i]}"/>`; }
      return s+'</svg>';
    }
    function lines(cols){
      const n=cols.length;
      let s='<svg viewBox="0 0 100 50" preserveAspectRatio="none">';
      for(let i=0;i<n;i++){ const base=8+i*(34/n); let d='';
        for(let x=0;x<=100;x+=10){ const y=44 - base - Math.sin((x/100)*3.14159*1.5 + i)*6 - (x/100)*4; d+=(x===0?'M':'L')+x+' '+y.toFixed(1)+' '; }
        s+=`<path d="${d}" fill="none" stroke="${cols[i]}" stroke-width="1.6"/>`; }
      return s+'</svg>';
    }

    const g=document.getElementById("g");
    const CTXLABEL={report:"Report — business / financial / investment",scientific:"Scientific — journal / publication (CVD-safe)",infographic:"Infographic — editorial / dashboard (vivid)"};
    Object.keys(PALS).forEach(ctx=>{
      const sec=document.createElement("section"); sec.className="ctx";
      sec.innerHTML='<h2>'+CTXLABEL[ctx]+'</h2>';
      PALS[ctx].forEach(p=>{
        const cols=p.colors.map(c=>c[0]);
        const sw=p.colors.map(c=>'<div class="sw"><div class="chip" style="background:'+c[0]+'"></div><div class="hx">'+c[0]+'</div><div class="nm">'+c[1]+'</div></div>').join('');
        const card=document.createElement("div"); card.className="pal";
        card.innerHTML=
          '<div class="pal-h"><span class="pal-id'+(p.rec?' rec':'')+'">'+p.id+(p.rec?' · rec':'')+'</span>'+
          '<h3 class="pal-n">'+p.name+'</h3><span class="pal-c">'+p.count+' colors</span>'+
          '<button class="tt gray-toggle" type="button" data-gs>B&amp;W ◑</button>'+
          '<p class="pal-r">'+p.rationale+'</p></div>'+
          '<div class="sw-strip" data-mock>'+sw+'</div>'+
          '<div class="mocks" data-mock><div class="mock"><p class="mt">grouped bars</p>'+bars(cols)+'</div>'+
          '<div class="mock"><p class="mt">multi-line</p>'+lines(cols)+'</div></div>'+
          '<div class="notes"><div><b>CVD:</b> '+p.cvd+'</div><div><b>Print/B&amp;W:</b> '+p.print+'</div><div><b>Use:</b> '+p.when+'</div></div>';
        card.querySelector('[data-gs]').addEventListener('click',function(){
          card.querySelectorAll('[data-mock]').forEach(m=>m.classList.toggle('gs'));
        });
        sec.appendChild(card);
      });
      g.appendChild(sec);
    });
    document.getElementById("tt").addEventListener("click",function(){
      var r=document.documentElement; r.classList.toggle("dark"); r.classList.toggle("light");
      document.body.setAttribute("data-theme", r.classList.contains("dark")?"dark":"light");
    });
  </script>
</body>
</html>
