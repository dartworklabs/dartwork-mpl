<div class="evolution-container">
  <div class="evolution-header">
    <h3 class="evolution-title">The Evolution of a Plot</h3>
    <p class="evolution-subtitle">Drag the slider to experience the dartwork-mpl pipeline step-by-step.</p>
  </div>
  <div class="evolution-images">
    <img id="evo-img-0" class="evo-img is-active">
    <img id="evo-img-1" class="evo-img">
    <img id="evo-img-2" class="evo-img">
    <img id="evo-img-3" class="evo-img">
  </div>

  <script>
    // Resolve _images/ regardless of where this widget is embedded.
    // sphinx-gallery's "step" SVGs land in _images/, not _static/.
    (function () {
      var here = window.location.pathname;
      var base;
      if (here.indexOf("/_static/") !== -1) {
        base = "../_images/";
      } else {
        var dirs = here.replace(/^\/+|\/+[^\/]*$/g, "").split("/").filter(Boolean);
        var up = dirs.length > 0 ? "../".repeat(dirs.length) : "";
        base = up + "_images/";
      }
      for (var i = 0; i < 4; i++) {
        document.getElementById("evo-img-" + i).src = base + "evolution_step" + (i + 1) + ".svg";
      }
    })();
  </script>
  <div class="evolution-controls">
    <input type="range" class="dm-slider" id="evo-slider" min="0" max="3" step="0.02" value="0" aria-label="Plot evolution step">
    <div class="evo-labels" role="group" aria-label="Plot evolution milestones">
      <button class="evo-label dm-chip is-active" type="button" data-evo="0" aria-pressed="true">1. Base</button>
      <button class="evo-label dm-chip" type="button" data-evo="1" aria-pressed="false">2. Apply Style</button>
      <button class="evo-label dm-chip" type="button" data-evo="2" aria-pressed="false">3. Label & Format</button>
      <button class="evo-label dm-chip" type="button" data-evo="3" aria-pressed="false">4. Smart Layout</button>
    </div>
  </div>
  <div class="evolution-description" id="evo-desc">
    <!-- Updated via JS -->
  </div>
</div>

<style>
.evolution-container {
  margin: 2rem 0;
  border: 1px solid var(--dm-border-faint);
  border-radius: var(--dm-radius-4);
  padding: var(--dm-space-5);
  background: var(--dm-bg-panel);
  box-shadow: var(--dm-shadow-1);
}
.evolution-title {
  margin-top: 0;
  margin-bottom: var(--dm-space-2);
}
.evolution-subtitle {
  margin-bottom: var(--dm-space-5);
  color: var(--dm-text-muted);
  font-size: var(--dm-type-body-size);
}
.evolution-images {
  position: relative;
  width: 100%;
  aspect-ratio: 2.5 / 1;
  overflow: hidden;
  margin-bottom: var(--dm-space-5);
  background: var(--dm-bg-page);
  border-radius: var(--dm-radius-3);
  border: 1px solid var(--dm-border-faint);
}
@media (max-width: 768px) {
  .evolution-images { aspect-ratio: 1.5 / 1; }
}
.evo-img {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: contain;
  opacity: 0;
  will-change: opacity;
}
.evo-img.is-active { opacity: 1; z-index: 2; }
.evolution-controls { display: flex; flex-direction: column; gap: var(--dm-space-3); margin-bottom: var(--dm-space-5); }
#evo-slider {
  width: 100%;
  cursor: pointer;
}
.evo-labels {
  display: flex;
  flex-wrap: wrap;
  gap: var(--dm-space-2);
  justify-content: space-between;
}
.evo-label.dm-chip {
  cursor: pointer;
  font-size: var(--dm-type-label-size);
  line-height: var(--dm-type-label-line);
  color: var(--dm-text-muted);
}
.evo-label.dm-chip.is-active,
.evo-label.dm-chip[aria-pressed="true"] {
  color: var(--dm-i-active-text);
  background: var(--dm-i-active-soft);
  border-color: var(--dm-i-soft-border);
  font-weight: 700;
}
.evolution-description {
  font-size: var(--dm-type-body-size);
  color: var(--dm-text);
  min-height: 4em;
  padding: var(--dm-space-4);
  background: var(--dm-bg-subtle);
  border-left: 4px solid var(--dm-i-active-line);
  border-radius: 0 var(--dm-radius-3) var(--dm-radius-3) 0;
}
</style>

<script>
const evoSlider = document.getElementById('evo-slider');
const evoLabels = document.querySelectorAll('.evo-label');
const evoDesc = document.getElementById('evo-desc');
const descs = [
  "<strong>Raw Matplotlib.</strong> Generic aesthetics, unformatted ticks, overlapping titles, and poorly aligned manual panel labels.",
  "<strong>dm.style.use('report').</strong> Instantly elevates aesthetics with the Open Color palette and elegant typography. No boilerplate required.",
  "<strong>dm.set_decimal() & dm.label_axes().</strong> Ticks are perfectly formatted intuitively. Panel labels (a) & (b) are automatically and precisely aligned.",
  "<strong>dm.simple_layout().</strong> Artist-measured margins resolve cut-offs and awkward spacing deterministically. Publication-ready."
];

function updateEvo(val) {
  for (let i = 0; i <= 3; i++) {
    const img = document.getElementById(`evo-img-${i}`);
    if (img) {
      const opacity = Math.max(0, 1 - Math.abs(val - i));
      img.style.opacity = opacity;
      img.style.zIndex = opacity > 0.5 ? 2 : 1;
      img.classList.toggle('is-active', opacity > 0.5);
    }
  }

  const nearest = Math.round(val);
  evoLabels.forEach((l, i) => {
    const selected = i === nearest;
    l.classList.toggle('is-active', selected);
    l.setAttribute('aria-pressed', selected ? 'true' : 'false');
  });
  if (evoDesc) evoDesc.innerHTML = descs[nearest];
}

function setEvo(val) {
  if (evoSlider) {
    evoSlider.value = val;
    updateEvo(val);
  }
}

if (evoSlider) {
  evoSlider.addEventListener('input', (e) => updateEvo(parseFloat(e.target.value)));
  evoLabels.forEach((label) => {
    label.addEventListener('click', () => setEvo(parseFloat(label.dataset.evo || '0')));
  });
  updateEvo(0);
}
</script>
