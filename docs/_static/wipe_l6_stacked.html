<style>
  /* Wipe slider — Stacked area composition (id-scoped to #dm-wipe-l6_stacked) */
  #dm-wipe-l6_stacked {
    position: relative;
    width: 100%;
    max-width: 720px;
    margin: 1.5em auto 1.6em;
    overflow: hidden;
    border-radius: 6px;
    border: 1px solid #e4e2dd;
    cursor: col-resize;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    background: #fbfaf7;
  }
  html.dark #dm-wipe-l6_stacked,
  body[data-theme="dark"] #dm-wipe-l6_stacked {
    background: #14141d;
    border-color: #2a2a36;
  }
  #dm-wipe-l6_stacked img {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: none;
  }
  #dm-wipe-l6_stacked .wipe-overlay {
    position: absolute;
    inset: 0;
    overflow: hidden;
  }
  #dm-wipe-l6_stacked .wipe-overlay img {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  #dm-wipe-l6_stacked .wipe-divider {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    background: #fff;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.35);
    z-index: 10;
    pointer-events: none;
  }
  #dm-wipe-l6_stacked .wipe-handle {
    position: absolute;
    top: 50%;
    transform: translate(-50%, -50%);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    z-index: 11;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
  }
  #dm-wipe-l6_stacked .wipe-handle svg {
    width: 16px;
    height: 16px;
    fill: #555;
  }
  #dm-wipe-l6_stacked .wipe-tag {
    position: absolute;
    bottom: 8px;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 0.7em;
    font-weight: 700;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    z-index: 5;
    pointer-events: none;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #fff;
  }
  #dm-wipe-l6_stacked .wipe-tag.before {
    left: 8px;
    background: rgba(180, 65, 65, 0.85);
  }
  #dm-wipe-l6_stacked .wipe-tag.after {
    right: 8px;
    background: rgba(13, 148, 136, 0.85);
  }
</style>

<div id="dm-wipe-l6_stacked">
  <!-- base layer = dartwork after -->
  <img id="dm-wipe-l6_stacked-base" alt="dartwork-mpl — Stacked area composition" />
  <!-- overlay layer = vanilla before, clipped from the left -->
  <div class="wipe-overlay" id="dm-wipe-l6_stacked-ov">
    <img id="dm-wipe-l6_stacked-overimg" alt="vanilla matplotlib — Stacked area composition" />
  </div>
  <div class="wipe-divider" id="dm-wipe-l6_stacked-div" style="left: 50%"></div>
  <div class="wipe-handle"  id="dm-wipe-l6_stacked-handle" style="left: 50%">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M8.5 5l-5 7 5 7V5zm7 0v14l5-7-5-7z"/>
    </svg>
  </div>
  <span class="wipe-tag before">vanilla</span>
  <span class="wipe-tag after">dartwork</span>
</div>

<script>
  (function () {
    var here = window.location.pathname;
    var base;
    if (here.indexOf("/_static/") !== -1) {
      base = "landing_pocs/";
    } else {
      var dirs = here.replace(/^\/+|\/+[^\/]*$/g, "").split("/").filter(Boolean);
      var up = dirs.length > 0 ? "../".repeat(dirs.length) : "";
      base = up + "_static/landing_pocs/";
    }
    var slug = "06_stacked";
    document.getElementById("dm-wipe-l6_stacked-base").src    = base + "poc_" + slug + "_after.svg";
    document.getElementById("dm-wipe-l6_stacked-overimg").src = base + "poc_" + slug + "_before.svg";

    var slider  = document.getElementById("dm-wipe-l6_stacked");
    var overlay = document.getElementById("dm-wipe-l6_stacked-ov");
    var divider = document.getElementById("dm-wipe-l6_stacked-div");
    var handle  = document.getElementById("dm-wipe-l6_stacked-handle");
    overlay.style.clipPath = "inset(0 50% 0 0)";
    var dragging = false;

    function setPos(x) {
      var r = slider.getBoundingClientRect();
      var pct = Math.max(0, Math.min(1, (x - r.left) / r.width));
      var rightPct = ((1 - pct) * 100).toFixed(2);
      overlay.style.clipPath = "inset(0 " + rightPct + "% 0 0)";
      divider.style.left = (pct * 100).toFixed(2) + "%";
      handle.style.left  = (pct * 100).toFixed(2) + "%";
    }
    slider.addEventListener("pointerdown", function (e) {
      dragging = true;
      try { slider.setPointerCapture(e.pointerId); } catch (err) {}
      setPos(e.clientX);
    });
    slider.addEventListener("pointermove", function (e) {
      if (dragging) setPos(e.clientX);
    });
    slider.addEventListener("pointerup",     function () { dragging = false; });
    slider.addEventListener("pointercancel", function () { dragging = false; });
  })();
</script>
