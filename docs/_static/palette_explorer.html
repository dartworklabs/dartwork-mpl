<!doctype html>
<!--
  palette_explorer.html — the docs-integrated dartwork palette explorer.
  Single active palette at a time: a width-filling family card grid · color-count
  slider (2–8, live subset) · B&W toggle (grayscale-separability check) · an EXPLICIT
  chart-type chip selector with 8 shapes (line/stacked-area/scatter/bubble/bar/
  lollipop/waffle/heatmap) — click chips to show/hide each, or quick-pick 4 / 8, so
  one palette is compared across every chart shape at once · per-swatch hover (hex) ·
  copy (hex list + Python snippet using dm.*). Built on dm-interactive; theme follows
  the host docs (no in-widget theme toggle). Palette data is GENERATED
  (scripts/gen_palettes.py, CIELAB, B&W+CVD verified) and injected into PALETTES below.
-->
<html lang="en" class="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>dartwork — palette explorer</title>
  <link rel="stylesheet" href="dartwork-design.css" />
  <link rel="stylesheet" href="dm-interactive.css" />
  <style>
    body { margin:0; background:var(--dm-bg-page); color:var(--dm-gray-12);
      font-family:var(--dm-f-sys,"Inter",system-ui,sans-serif); letter-spacing:-.003em; }
    .wrap { max-width:920px; margin:0 auto; padding:32px 24px 110px; }
    .hint { margin:0 0 18px; font-size:13px; color:var(--dm-text-muted); line-height:1.55; }
    .hint b { color:var(--dm-gray-12); font-weight:600; }

    /* family picker — width-filling card grid, grouped by family */
    .pgrid { display:grid; grid-template-columns:repeat(auto-fill,minmax(184px,1fr));
      gap:7px 8px; margin-bottom:24px; align-items:stretch; }
    .fam-head { grid-column:1/-1; display:flex; align-items:baseline; gap:8px;
      font-size:.62rem; font-weight:700; text-transform:uppercase; letter-spacing:.08em;
      color:var(--dm-text-muted); margin:16px 0 1px; padding-bottom:6px;
      border-bottom:1px solid var(--dm-border-faint); }
    .fam-head:first-child { margin-top:0; }
    .fam-head .fh-note { font-size:.62rem; font-weight:500; letter-spacing:0; text-transform:none;
      color:var(--dm-gray-9); }
    .pchip { appearance:none; text-align:left; background:var(--dm-bg-page); font:inherit;
      border:1px solid var(--dm-border-faint); border-radius:9px; padding:8px 9px 9px;
      cursor:pointer; display:flex; flex-direction:column; gap:7px;
      transition:border-color .14s, box-shadow .14s, background .14s; }
    .pchip:hover { border-color:var(--dm-border); background:var(--dm-gray-a2); }
    .pchip.on { border-color:var(--dm-accent-8); background:var(--dm-accent-2);
      box-shadow:0 0 0 1px var(--dm-accent-8) inset; }
    .pchip .mini { display:flex; height:15px; border-radius:4px; overflow:hidden; }
    .pchip .mini i { flex:1; }
    .pchip .nm { font-size:12px; font-weight:550; color:var(--dm-gray-12); line-height:1.25; }
    .pchip.on .nm { color:var(--dm-accent-11); }

    /* stage */
    .stage { border:1px solid var(--dm-border-faint); border-radius:var(--dm-radius-5); padding:20px; }
    .s-head { display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; }
    .s-name { font-size:17px; font-weight:700; margin:0; }
    .s-band { font-size:11.5px; color:var(--dm-text-muted); font-family:var(--dm-f-mono,monospace); }
    .s-ctrls { margin-left:auto; display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
    .ctrl { background:var(--dm-gray-3); color:var(--dm-gray-12); border:0; border-radius:var(--dm-radius-3);
      padding:4px 10px; font:inherit; font-size:11.5px; cursor:pointer; }
    .ctrl.on { background:var(--dm-accent-3); color:var(--dm-accent-11); font-weight:600; }
    .countwrap { display:inline-flex; align-items:center; gap:7px; font-size:11.5px; color:var(--dm-text-muted); }
    .countwrap input[type=range]{ width:104px; accent-color:var(--dm-accent-9); }

    .strip { display:flex; gap:6px; margin:16px 0 4px; }
    .sw { flex:1; min-width:0; position:relative; }
    .sw .chip { height:40px; border-radius:var(--dm-radius-2); cursor:pointer; }
    .sw .hx { font-family:var(--dm-f-mono,monospace); font-size:9px; color:var(--dm-text-muted); text-align:center; margin-top:3px; overflow:hidden; }
    .sw .tip { position:absolute; bottom:calc(100% + 6px); left:50%; transform:translateX(-50%);
      background:var(--dm-gray-12); color:var(--dm-bg-page); font-size:10.5px; font-family:var(--dm-f-mono,monospace);
      padding:3px 7px; border-radius:5px; white-space:nowrap; opacity:0; pointer-events:none; transition:opacity .12s; z-index:5; }
    .sw:hover .tip { opacity:1; }

    /* chart-type chip selector (explicit multi-select) */
    .chartbar { display:flex; align-items:center; gap:6px; flex-wrap:wrap; margin:16px 0 2px; }
    .chartbar .lbl { font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
      color:var(--dm-text-muted); margin-right:2px; }
    .chartbar .qsep { font-size:.66rem; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
      color:var(--dm-text-muted); margin-left:8px; }
    /* font-weight stays constant across states so toggling never changes a chip's width */
    .cchip { appearance:none; background:var(--dm-gray-3); color:var(--dm-gray-12); border:1px solid transparent;
      border-radius:999px; padding:4px 12px; font:inherit; font-size:11.5px; font-weight:500; cursor:pointer;
      transition:background .12s,color .12s,border-color .12s; }
    .cchip:hover { background:var(--dm-gray-a4); }
    .cchip.on { background:var(--dm-accent-3); color:var(--dm-accent-11); border-color:var(--dm-accent-7); }
    .cchip.quick { background:transparent; border:1px dashed var(--dm-border); color:var(--dm-text-muted); }
    .cchip.quick:hover { background:var(--dm-gray-a3); color:var(--dm-gray-12); }
    .cchip.quick.on { background:var(--dm-accent-3); color:var(--dm-accent-11); border-color:var(--dm-accent-7); border-style:solid; }
    .qgroup { margin-left:auto; display:inline-flex; align-items:center; gap:6px; }

    /* plots — one panel per selected chart type */
    .plots-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(228px,1fr)); gap:14px; margin-top:14px; }
    .pcell { border:1px solid var(--dm-border-faint); border-radius:var(--dm-radius-5);
      padding:12px 14px; background:var(--dm-bg-page); }
    .pcell .pl { font-size:10.5px; font-weight:600; text-transform:uppercase; letter-spacing:.06em;
      color:var(--dm-text-muted); margin-bottom:10px; }
    .plots-grid.gs svg, .strip.gs svg, .strip.gs .chip { filter:grayscale(1); }
    svg { display:block; width:100%; height:auto; }

    .meta { margin-top:14px; font-size:12px; color:var(--dm-text-muted); line-height:1.6; display:grid; gap:4px; }
    .meta b { color:var(--dm-gray-12); font-weight:600; }
    .code { margin-top:14px; position:relative; background:var(--dm-i-code-surface); border-radius:var(--dm-radius-4);
      padding:12px 44px 12px 14px; font-family:var(--dm-f-mono,monospace); font-size:12px; color:var(--dm-gray-12); white-space:pre; overflow-x:auto; }
    .copybtn { position:absolute; top:8px; right:8px; background:transparent; border:1px solid var(--dm-border-faint);
      border-radius:6px; padding:3px 9px; font:inherit; font-size:11px; color:var(--dm-text-muted); cursor:pointer; }
    .copybtn:hover { background:var(--dm-accent-3); color:var(--dm-accent-11); border-color:var(--dm-accent-7); }
    .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:var(--dm-gray-12);
      color:var(--dm-bg-page); padding:8px 16px; border-radius:999px; font-size:12.5px; opacity:0; transition:opacity .2s; pointer-events:none; }
    .toast.show { opacity:1; }
  </style>
</head>

      cols:["#035f5a","#e77a6f","#358645","#c3b5ff","#8f5915","#e290d8","#0892c4","#d8d678"],
      intent:"MANY categories with maximum punch — a curated, high-contrast set rather than Vivid's even rainbow. For presentations, posters, and dashboards that must pop, where each category should grab attention from across the room.",
      design:"Opens on house teal, then 7 vivid deliberately UNeven hues (high chroma 48), staggered even L* ladder 36→84. Retuned so no two collapse under color-blindness.",
      application:"8-category bars / scatter on slides and posters. Confident, energetic, attention-grabbing.",
      bw:"min ΔL* 6.7", cvd:"d8.1 / p7.7 / t13.3" },
    warm_gray:   { name:"Warm Gray", fam:"Neutral", band:"neutral · warm taupe ramp",
      cols:["#3a342e","#514a44","#69625b","#827b74","#9d958e","#b7afa8","#d3cbc3","#efe7df"],
      intent:"A hue-free ordered ramp with a WARM taupe or greige cast — for cream paper, editorial warmth, or warm brand systems. Encodes magnitude or rank without implying any category, staying soft and print-friendly from light to dark.",
      design:"8-step L* ramp 22→92 at a warm hue (h≈70), chroma ≈ 5. Pure lightness ⇒ perfect B&W + CVD.",
      application:"Warm-toned heat tables, ordered bars / area, backgrounds on cream stock.",
      bw:"min ΔL* 9.7", cvd:"d8.9 / p9.0 / t8.9" },
    cool_gray:   { name:"Cool Gray", fam:"Neutral", band:"neutral · cool slate ramp",
      cols:["#2d363d","#434d54","#5b656c","#737d85","#8d97a0","#a7b2bb","#c2ced6","#deeaf3"],
      intent:"A hue-free ordered ramp with a COOL slate or blue cast — for tech, clinical, or cool brand systems. Encodes magnitude or rank without implying any category, holding a crisp, neutral tone the whole way from light to dark.",
      design:"8-step L* ramp 22→92 at a cool hue (h≈250), chroma ≈ 6. Perfect B&W + CVD.",
      application:"Cool-toned heat tables, ordered encodings, UI backgrounds.",
      bw:"min ΔL* 9.7", cvd:"d9.0 / p8.9 / t9.0" },
    focus:       { name:"Teal Accent", fam:"Emphasis", band:"1 teal accent + 7 neutrals",
      cols:["#065a51","#5c646b","#70787f","#848d93","#99a2a9","#aeb7be","#c4cdd5","#dae4eb"],
      intent:"Highlight ONE series while everything else recedes to gray — the storytelling staple, color the one thing. House teal marks the salient series and graded neutrals carry the rest, keeping attention exactly where you point it.",
      design:"Slot 0 = house teal (salient), slots 1-7 = graded neutrals on an even L* ladder 34→90. Pair with Warm Accent for the warm-highlight version, or combine the two accent colors to highlight a second series.",
      application:"Single-series emphasis in line / bar charts, explanatory figures, slide builds.",
      bw:"min ΔL* 7.8", cvd:"d7.3 / p7.3 / t7.3" },
    focus_warm:  { name:"Warm Accent", fam:"Emphasis", band:"1 warm accent + 7 neutrals",
      cols:["#8d302b","#5c646b","#70787f","#848d93","#99a2a9","#aeb7be","#c4cdd5","#dae4eb"],
      intent:"Highlight one series with a WARM coral accent instead of teal — for warmth, alerts, or when teal clashes with the content. Coral marks the salient line and graded neutrals mute everything else quietly into the background.",
      design:"Slot 0 = coral (h≈32, salient), slots 1-7 = graded neutrals, even L* ladder 34→90.",
      application:"Single-series emphasis where a warm highlight reads better (e.g., risk / attention).",
      bw:"min ΔL* 7.8", cvd:"d7.3 / p7.3 / t7.3" },
  };
  const ORDER = ["teal_seq","indigo_seq","coral_seq","teal_indigo","forest","warm_cool","blue_orange","teal_coral","trustworthy","corporate","muted","dusty","spectrum","bold","accessible","gray_seq","warm_gray","cool_gray","focus","focus_warm","coolwarm","teal_amber_div","earth","jewel"];

  const state = { pal:"trustworthy", n:8, gs:false, charts:["line","area","scatter","bubble","bar","lollipop","waffle","heatmap"] };

  // ── plot renderers (SVG); take a color list ──
  const VB='0 0 100 56';
  const P = {
    line(c){ const n=c.length; let s=`<svg viewBox="${VB}" preserveAspectRatio="none">`;
      for(let i=0;i<n;i++){ const yc=n>1?9+i*(38/(n-1)):28; let d='';
        for(let x=0;x<=100;x+=1.25){ const t=x/100; const y=yc+Math.sin(t*4.6+i*0.9)*3.5-(t-0.5)*(i-n/2)*1.8; d+=(x===0?'M':'L')+x.toFixed(2)+' '+y.toFixed(2)+' '; }
        s+=`<path d="${d}" fill="none" stroke="${c[i]}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>`; }
      return s+'</svg>'; },
    scatter(c){ const n=c.length; let s=`<svg viewBox="${VB}">`;
      for(let i=0;i<n;i++){ const cx=12+(i/(n-1||1))*76, cy=15+((i*37)%28);
        for(let k=0;k<11;k++){ const a=i*2.3+k*1.7; s+=`<circle cx="${(cx+Math.cos(a)*9+Math.sin(k*3.1)*2.6).toFixed(1)}" cy="${(cy+Math.sin(a)*9+Math.cos(k*2.2)*2.6).toFixed(1)}" r="2" fill="${c[i]}" opacity="0.82"/>`; } }
      return s+'</svg>'; },
    area(c){ const n=c.length, S=48, acc=new Array(S+1).fill(54); let s=`<svg viewBox="${VB}" preserveAspectRatio="none">`;
      for(let i=0;i<n;i++){ let top='',bot='';
        for(let xi=0;xi<=S;xi++){ const x=xi*(100/S), v=(46/n)*(0.85+0.34*Math.sin(xi*0.22+i*0.95)), y0=acc[xi], y1=acc[xi]-v; acc[xi]=y1; top+=(xi===0?'M':'L')+x.toFixed(2)+' '+y1.toFixed(2)+' '; bot=x.toFixed(2)+' '+y0.toFixed(2)+' '+bot; }
        s+=`<path d="${top}L${bot}Z" fill="${c[i]}" opacity="0.96"/>`; }
      return s+'</svg>'; },
    bar(c){ const n=c.length, g=2.2, bw=100/n, h=[40,28,48,34,44,30,38,46]; let s=`<svg viewBox="${VB}" preserveAspectRatio="none">`;
      for(let i=0;i<n;i++){ const x=i*bw+g/2, bh=h[i%8]; s+=`<rect x="${x.toFixed(1)}" y="${(52-bh).toFixed(1)}" width="${(bw-g).toFixed(1)}" height="${bh}" rx="0.8" fill="${c[i]}"/>`; }
      return s+'</svg>'; },
    heatmap(c){ const n=c.length, cw=100/n, rows=5, rh=56/rows; let s=`<svg viewBox="${VB}">`;
      for(let i=0;i<n;i++){ for(let r=0;r<rows;r++){ s+=`<rect x="${(i*cw).toFixed(1)}" y="${(r*rh).toFixed(1)}" width="${cw.toFixed(1)}" height="${rh.toFixed(1)}" fill="${c[i]}" opacity="${(0.4+r*0.14).toFixed(2)}"/>`; } } return s+'</svg>'; },
    bubble(c){ const n=c.length; let s=`<svg viewBox="${VB}">`;
      for(let i=0;i<n;i++){ const cx=12+(i/(n-1||1))*76, cy=16+((i*29)%26);
        for(let k=0;k<5;k++){ const a=i*1.7+k*2.2, rr=1.6+((i+k*3)%4)*1.4; s+=`<circle cx="${(cx+Math.cos(a)*8).toFixed(1)}" cy="${(cy+Math.sin(a)*8).toFixed(1)}" r="${rr.toFixed(1)}" fill="${c[i]}" opacity="0.68"/>`; } }
      return s+'</svg>'; },
    lollipop(c){ const n=c.length, g=100/(n+1); let s=`<svg viewBox="${VB}">`;
      for(let i=0;i<n;i++){ const x=g*(i+1), y=52-(14+Math.abs(Math.sin(i*1.5+0.4))*32); s+=`<line x1="${x.toFixed(1)}" y1="52" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${c[i]}" stroke-width="1.4"/><circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" fill="${c[i]}"/>`; }
      return s+'</svg>'; },
    waffle(c){ const n=c.length, cols=12, rows=5, cell=56/rows, cw=100/cols, total=cols*rows; const raw=[]; let t=0; for(let i=0;i<n;i++){ const v=0.6+Math.abs(Math.sin(i*1.7+0.2)); raw.push(v); t+=v; }
      const cnt=raw.map(v=>Math.max(1,Math.round(total*v/t)));
      let s=`<svg viewBox="${VB}">`, idx=0;
      for(let ci=0;ci<n;ci++){ for(let k=0;k<cnt[ci]&&idx<total;k++,idx++){ const r=Math.floor(idx/cols), col=idx%cols; s+=`<rect x="${(col*cw+0.6).toFixed(2)}" y="${(r*cell+0.6).toFixed(2)}" width="${(cw-1.2).toFixed(2)}" height="${(cell-1.2).toFixed(2)}" rx="1" fill="${c[ci]}"/>`; } }
      return s+'</svg>'; },
  };
  const ALLPLOTS=["line","area","scatter","bubble","bar","lollipop","waffle","heatmap"];
  const PLABEL={line:"line",area:"stacked area",scatter:"scatter",bubble:"bubble",bar:"bar",lollipop:"lollipop",waffle:"waffle",heatmap:"heatmap"};
  const SET4=["line","bar","scatter","heatmap"];
  state.charts = ALLPLOTS.slice();  // all 8 by default
  const sameSet=(a,b)=>a.length===b.length&&a.every(x=>b.includes(x));
  const qon=set=>sameSet(state.charts,set)?' on':'';

  function active(){ const p=PALETTES[state.pal]; return p.cols.slice(0,state.n); }

  const FAM_NOTE={Sequential:"ordered amount",Analogous:"one-mood arc",Duo:"two opposed groups",Balanced:"everyday default",Muted:"soft / editorial",Spectrum:"many categories",Accessible:"CVD-mandatory",Neutral:"hue-free ramp",Emphasis:"highlight one",Diverging:"around a midpoint",Tone:"a specific mood"};
  function renderFamilies(){
    const fams={}; ORDER.forEach(k=>{ const f=PALETTES[k].fam; (fams[f]=fams[f]||[]).push(k); });
    let html='';
    Object.keys(fams).forEach(f=>{
      html+='<div class="fam-head">'+f+(FAM_NOTE[f]?'<span class="fh-note">'+FAM_NOTE[f]+'</span>':'')+'</div>';
      fams[f].forEach(k=>{
        const mini=PALETTES[k].cols.map(c=>'<i style="background:'+c+'"></i>').join('');
        html+='<button class="pchip'+(k===state.pal?' on':'')+'" data-pal="'+k+'">'+
          '<span class="mini">'+mini+'</span><span class="nm">'+PALETTES[k].name+'</span></button>';
      });
    });
    document.getElementById("fams").innerHTML=html;
    document.querySelectorAll('[data-pal]').forEach(b=>b.addEventListener('click',()=>{ state.pal=b.dataset.pal; state.n=8; renderAll(); }));
  }
  function pySnippet(){ const p=PALETTES[state.pal], cs=active();
    return "import dartwork_mpl as dm\n# "+p.name+"  ("+state.n+" colors)\ndm.set_cycle(dm.get_palette('"+state.pal+"', n="+state.n+"))\n# or explicit:\n# cols = "+JSON.stringify(cs); }
  function renderStage(){
    const p=PALETTES[state.pal], cs=active();
    const strip=cs.map(c=>'<div class="sw"><div class="tip">'+c+'</div><div class="chip" style="background:'+c+'"></div><div class="hx">'+c+'</div></div>').join('');
    const grid=ALLPLOTS.filter(pt=>state.charts.includes(pt)).map(pt=>'<div class="pcell"><div class="pl">'+PLABEL[pt]+'</div>'+P[pt](cs)+'</div>').join('');
    const chips=ALLPLOTS.map(pt=>'<button class="cchip'+(state.charts.includes(pt)?' on':'')+'" data-ct="'+pt+'">'+PLABEL[pt]+'</button>').join('');
    const st=document.getElementById("stage"); st.className="stage";
    st.innerHTML=
      '<div class="s-head"><h2 class="s-name">'+p.name+'</h2><span class="s-band">'+p.band+'</span>'+
      '<div class="s-ctrls">'+
      '<span class="countwrap">colors <input type="range" min="2" max="8" value="'+state.n+'" id="cnt"><b id="cntv">'+state.n+'</b></span>'+
      '<button class="ctrl'+(state.gs?' on':'')+'" id="bw">B&amp;W</button></div></div>'+
      '<div class="strip'+(state.gs?' gs':'')+'" id="strip">'+strip+'</div>'+
      '<div class="chartbar"><span class="lbl">charts</span>'+chips+'<span class="qgroup"><span class="qsep">show</span><button class="cchip quick'+qon(SET4)+'" data-q="4">4</button><button class="cchip quick'+qon(ALLPLOTS)+'" data-q="8">8</button></span></div>'+
      '<div class="plots-grid'+(state.gs?' gs':'')+'" id="plots">'+grid+'</div>'+
      '<div class="meta"><div><b>Intent:</b> '+p.intent+'</div><div><b>Design:</b> '+p.design+'</div>'+
      '<div><b>Application:</b> '+p.application+'</div>'+
      '<div><b>B&amp;W:</b> '+p.bw+' · <b>CVD:</b> '+p.cvd+'</div></div>'+
      '<div class="code" id="code">'+pySnippet().replace(/</g,"&lt;")+'<button class="copybtn" id="cpy">copy</button></div>';
    st.querySelector('#cnt').addEventListener('input',e=>{ state.n=+e.target.value; renderStage(); });
    st.querySelector('#bw').addEventListener('click',()=>{ state.gs=!state.gs; renderStage(); });
    st.querySelectorAll('[data-ct]').forEach(b=>b.addEventListener('click',()=>{ const pt=b.dataset.ct, i=state.charts.indexOf(pt); if(i>=0){ if(state.charts.length>1) state.charts.splice(i,1); } else state.charts.push(pt); renderStage(); }));
    st.querySelectorAll('[data-q]').forEach(b=>b.addEventListener('click',()=>{ const q=b.dataset.q; state.charts=(q==='4'?SET4.slice():ALLPLOTS.slice()); renderStage(); }));
    st.querySelector('#cpy').addEventListener('click',()=>{ navigator.clipboard&&navigator.clipboard.writeText(pySnippet()); toast(); });
  }
  function renderAll(){ renderFamilies(); renderStage(); }
  let tT; function toast(){ const t=document.getElementById("toast"); t.classList.add("show"); clearTimeout(tT); tT=setTimeout(()=>t.classList.remove("show"),1200); }
  renderAll();
  </script>
</body>
</html>
