name: Publish to PyPI

# A v*.*.* tag (cut on main) builds and publishes once the owner approves
# the `pypi` environment. main only receives merges
# from develop that already passed CI, so nothing is re-tested here.
# PyPI trusted publishing: no token; the publisher is registered on PyPI for
# this repository and this workflow file name.

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The owner approves every upload here (ADR 0010). PyPI's trusted
    # publisher is bound to this environment name.
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Tag must match the pyproject version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROJ="$(uv version --short)"
          [ "$TAG" = "$PROJ" ] || { echo "::error::tag v$TAG != pyproject $PROJ"; exit 1; }

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A pre-release tag (v0.8.0a1, v0.8.0rc1) must not become "latest".
          case "$GITHUB_REF_NAME" in
            *a[0-9]*|*b[0-9]*|*rc[0-9]*) PRE="--prerelease" ;;
            *) PRE="" ;;
          esac
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes --verify-tag $PRE
