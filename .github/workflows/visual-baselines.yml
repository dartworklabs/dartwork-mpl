name: Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: read

# Generate replacement baselines explicitly on the trusted Ubuntu runner.
jobs:
  baselines:
    runs-on: [self-hosted, ml-main]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate baselines
        env:
          MPLBACKEND: Agg
        run: uv run pytest tests/visual/test_visual_pixels.py --mpl-generate-path=tests/visual/baseline -q

      - name: Upload baselines
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-baselines
          path: tests/visual/baseline/
