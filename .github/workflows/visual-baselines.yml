name: Visual Baselines

on:
  workflow_dispatch:

permissions:
  contents: read

# Generate replacement baselines explicitly on the trusted Ubuntu runner.
jobs:
  baselines:
    runs-on: [self-hosted, ml-main]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Generate baselines
        env:
          MPLBACKEND: Agg
        run: uv run pytest tests/visual/test_visual_pixels.py --mpl-generate-path=tests/visual/baseline -q

      - name: Upload baselines
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-baselines
          path: tests/visual/baseline/
