name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Allow a newer push to cancel an in-flight pre-commit run on the same ref.
concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

# Runs on a disposable GitHub-hosted machine for pull requests and pushes
# alike (public repository: hosted minutes are free; see ci.yml).
jobs:
  pre-commit:
    name: Run pre-commit on changed files
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # pre-commit installs its hooks in isolated environments. setup-python
      # also keeps pip off the runner's externally managed Python.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      # CI lint owns whole-package mypy in the locked all-extras environment.
      # Skipping only this system hook removes the need for uv/project sync;
      # the isolated Ruff hooks retain their broader all-files coverage.
      # pre-commit/action caches the per-hook environments under
      # ~/.cache/pre-commit, keyed off the .pre-commit-config.yaml hash,
      # so subsequent runs only pay the network cost when a hook is bumped.
      - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        env:
          SKIP: mypy
