name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

# Allow a newer push to cancel an in-flight pre-commit run on the same ref.
concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

# Public PR validation runs on disposable GitHub-hosted machines.
# Other events retain the existing ml-main route.
jobs:
  pre-commit:
    name: Run pre-commit on changed files
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted", "ml-main"]') }}
    steps:
      - uses: actions/checkout@v6
      # pre-commit installs its hooks in isolated environments. setup-python
      # also keeps pip off the self-hosted runner's externally managed Python.
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # CI lint owns whole-package mypy in the locked all-extras environment.
      # Skipping only this system hook removes the need for uv/project sync;
      # the isolated Ruff hooks retain their broader all-files coverage.
      # pre-commit/action caches the per-hook environments under
      # ~/.cache/pre-commit, keyed off the .pre-commit-config.yaml hash,
      # so subsequent runs only pay the network cost when a hook is bumped.
      - uses: pre-commit/action@v3.0.1
        env:
          SKIP: mypy
