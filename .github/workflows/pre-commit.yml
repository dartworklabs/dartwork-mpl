name: pre-commit

on:
  pull_request:
  push:
    branches: [main]

# Allow a newer push to cancel an in-flight pre-commit run on the same ref.
concurrency:
  group: pre-commit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pre-commit:
    name: Run pre-commit on changed files
    runs-on: [self-hosted, ml-main]
    steps:
      - uses: actions/checkout@v6
      # The local mypy hook shells out to ``uv run --frozen mypy`` so the runner
      # needs ``uv`` on PATH before pre-commit fires.
      #
      # setup-uv MUST run before setup-python. setup-uv prepends
      # ``~/.local/bin`` to PATH, and on the ml-main runner that directory
      # holds the ``python``/``python3`` launcher that execs a uv-managed
      # interpreter (dotfiles #94, 2026-09-11). uv-managed interpreters carry a
      # PEP 668 EXTERNALLY-MANAGED marker, so with that launcher first on PATH
      # ``pre-commit/action``'s ``python -m pip install pre-commit`` dies with
      # ``error: externally-managed-environment`` before any hook runs.
      # Running setup-python last puts its toolcache interpreter back in front.
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # Pre-populate the uv-managed venv from the locked deps so the local
      # mypy hook (`uv run --frozen mypy`) has every optional dependency
      # available without re-resolving. `--frozen` guarantees the hook never
      # rewrites uv.lock (which previously produced spurious "files were
      # modified by this hook" failures on this required check).
      - name: Sync uv environment (frozen, all extras + dev)
        run: uv sync --frozen --all-extras --dev
      # pre-commit/action caches the per-hook environments under
      # ~/.cache/pre-commit, keyed off the .pre-commit-config.yaml hash,
      # so subsequent runs only pay the network cost when a hook is bumped.
      - uses: pre-commit/action@v3.0.1
