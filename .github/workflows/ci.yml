name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# Cancel superseded PR validation; push runs keep their existing behavior.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Public PR validation runs on disposable GitHub-hosted machines.
# Other events retain the existing ml-main route.
jobs:
  lint:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted", "ml-main"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Required pre-commit checks own all-files Ruff lint and formatting.
      # Keep package typing in the locked all-extras environment here.
      - name: Type check (mypy)
        run: uv run mypy src/dartwork_mpl/

  test:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted", "ml-main"]') }}
    # Override the repository's 3.10 pin so each matrix job tests its interpreter.
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      # Full history: tests/test_color_v6_quality_oracle.py runs
      # scripts/freeze_color_v5_quality.py, which resolves the frozen colour
      # baseline with `git rev-parse <sha>^{commit}`. A shallow checkout has
      # only the merge commit, so that lookup fails with "Needed a single
      # revision" and the generator exits 2.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Isolate matplotlib font discovery
        shell: bash
        run: |
          printf 'MPLCONFIGDIR=%s/matplotlib-%s\n' "$RUNNER_TEMP" "$UV_PYTHON" >> "$GITHUB_ENV"

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Keep the coverage gate on one representative interpreter. The
      # remaining matrix jobs still run the full test suite for version
      # compatibility, but skip coverage instrumentation.
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        env:
          MPLBACKEND: Agg
          # Python 3.12 supports sys.monitoring for this line-only gate.
          # Recheck compatibility before adding branches or dynamic contexts.
          COVERAGE_CORE: sysmon
          COVERAGE_DEBUG: core
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -v --cov --cov-report=term-missing --durations=30 \
            --junitxml="$RUNNER_TEMP/pytest-full.xml" 2>&1 | tee "$RUNNER_TEMP/pytest-summary.txt"

      - name: Run tests
        if: matrix.python-version != '3.12'
        env:
          MPLBACKEND: Agg
        shell: bash
        run: |
          set -euo pipefail
          uv run pytest -v --no-cov --durations=30 \
            --junitxml="$RUNNER_TEMP/pytest-full.xml" 2>&1 | tee "$RUNNER_TEMP/pytest-summary.txt"

      # Prove every protected module contributed a passing executed case in
      # the same full-suite run. A missing optional extra must not silently
      # skip a whole module. Pytest's own nonzero status still fails the job.
      - name: Assert MCP / integration tests actually ran
        if: matrix.python-version == '3.12'
        run: uv run --no-sync python scripts/check_integration_junit.py "$RUNNER_TEMP/pytest-full.xml"

      - name: Preserve test execution evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pytest-python-${{ matrix.python-version }}
          path: |
            ${{ runner.temp }}/pytest-full.xml
            ${{ runner.temp }}/pytest-summary.txt
          if-no-files-found: warn
          retention-days: 7

  # Exercise affected artifact contracts on both supported FastMCP majors.
  # The existing full-suite Python 3.12 guard remains the primary repo gate.
  test-mcp-artifacts:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted", "ml-main"]') }}
    env:
      UV_PYTHON: "3.12"
      MPLBACKEND: Agg
    strategy:
      matrix:
        fastmcp: ["2.13.3", "3.4.2"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install locked all-extras dependencies
        run: uv sync --frozen --all-extras --dev
      - name: Run artifact contracts and prove same-run execution
        shell: bash
        run: |
          set -euo pipefail
          unset DARTWORK_MPL_INPUT_POLICY
          task_store=$(mktemp -d "$RUNNER_TEMP/input-contracts.XXXXXX")
          trap 'rm -rf -- "$task_store"' EXIT
          export DARTWORK_MPL_ARTIFACT_DIR="$task_store/artifacts"
          export MPLCONFIGDIR="$task_store/matplotlib"
          runtime=(uv run --no-sync --with 'fastmcp==${{ matrix.fastmcp }}')
          "${runtime[@]}" python -c 'import json, sys; from importlib.metadata import version; assert sys.version_info[:2] == (3, 12); assert version("fastmcp") == "${{ matrix.fastmcp }}"; print(json.dumps({"python": sys.version, "fastmcp": version("fastmcp"), "mcp": version("mcp")}))' | tee "$RUNNER_TEMP/artifact-runtime.json"
          "${runtime[@]}" pytest tests/mcp/artifacts -q --no-cov \
            --junitxml="$RUNNER_TEMP/pytest-artifacts.xml" 2>&1 | tee "$RUNNER_TEMP/artifact-summary.txt"
          uv run --no-sync python scripts/check_integration_junit.py \
            "$RUNNER_TEMP/pytest-artifacts.xml" --scope artifacts
      - name: Preserve artifact runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-artifacts-${{ matrix.fastmcp }}
          path: |
            ${{ runner.temp }}/artifact-runtime.json
            ${{ runner.temp }}/pytest-artifacts.xml
            ${{ runner.temp }}/artifact-summary.txt
          if-no-files-found: warn
          retention-days: 7

  # Sanity check: the *base* install (no [mcp] extra) must still
  # import, render, and save. Catches regressions where a
  # core module accidentally requires fastmcp at import time.
  test-no-extras:
    env:
      UV_PYTHON: "3.12"
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted", "ml-main"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install with NO extras
        run: uv sync --no-dev
      - name: Base-install smoke (import + exercise core, no extras/dev)
        run: |
          uv run --no-sync python -c "
          from importlib.util import find_spec

          # Prove uv did not sync default dev dependencies back into this
          # environment, and that optional extras remain optional.
          for module in ('pytest', 'sphinx', 'pandas', 'fastmcp', 'IPython', 'fastapi'):
              assert find_spec(module) is None, f'{module} unexpectedly installed'

          import matplotlib
          matplotlib.use('Agg')
          import os
          import tempfile

          import matplotlib.pyplot as plt

          import dartwork_mpl as dm

          # A pure attribute check can't catch a hard import (pandas /
          # fastmcp) that fires at *call* time, so exercise the core render
          # path end to end on the bare (no extras, no dev) install.
          assert callable(dm.figsize)
          assert callable(dm.simple_layout)
          assert callable(dm.get_agent_doc)
          assert callable(dm.agent_doc_path)
          assert dm.AGENT_DOCS
          dm.style.use('scientific')
          fig, ax = plt.subplots(figsize=dm.figsize('8cm', 'wide'))
          ax.plot([0, 1, 2], [1, 3, 2], color=dm.colors('blue', n=3)[0], lw=dm.lw(0))
          ax.set_xlabel('x', fontsize=dm.fs(0))
          dm.simple_layout(fig)
          with tempfile.TemporaryDirectory() as d:
              dm.save_formats(fig, os.path.join(d, 'smoke'), formats=('png',))
              assert os.path.exists(os.path.join(d, 'smoke.png'))
          print('OK: base install imports + renders cleanly')
          "

  visual:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted", "ml-main"]') }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Visual regression (pixel baselines)
        env:
          MPLBACKEND: Agg
        run: uv run pytest tests/visual/test_visual_pixels.py --mpl -v --no-cov

      - name: Upload diff images on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: visual-diffs
          path: /tmp/pytest-mpl-*/**

  # Build the docs on every PR (the deploy workflow only runs on main, so
  # without this a doc-breaking change isn't caught until after merge).
  # Two gates: (1) -W turns Sphinx warnings into build failures; (2) the
  # ``builder-inited`` hook rejects stale generated authorities before deploy.
  docs:
    if: github.event_name == 'pull_request'
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted", "ml-main"]') }}
    # Pin the docs build to a single modern interpreter. Without this,
    # `uv sync` floats the build venv to the requires-python floor (3.10),
    # whose gallery execution hit an environment-specific color-resolution
    # failure the 3.11+ build does not. The docs are interpreter-agnostic
    # (build-only job), so pin to 3.12 for a deterministic, known-good build.
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Caches the incremental-build state: Sphinx doctrees (skip re-parsing
      # unchanged pages) and the matplotlib font cache (skip the cold-start
      # font scan). Key invalidates when any docs/package Python source OR
      # asset *data* (color authority, mplstyle, colormaps, prompt corpus)
      # changes — a data-only change alters rendered output, so it must bust
      # the cache too.
      - name: Cache Sphinx doctrees + matplotlib font cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            docs/_build/doctrees
            ~/.cache/matplotlib
          key: docs-${{ runner.os }}-${{ hashFiles('docs/**/*.py', 'src/dartwork_mpl/**/*.py', 'src/dartwork_mpl/asset/**', 'uv.lock') }}
          restore-keys: |
            docs-${{ runner.os }}-

      # Cache the generated sphinx-gallery tree (rst + images + the
      # per-example ``.py.md5`` stamps). sphinx-gallery re-executes an
      # example only when its source ``.py`` md5 changes, and the
      # purge_stale_gallery_artifacts hook drops only orphaned outputs —
      # so restoring this tree lets an unchanged-example build skip the
      # 70+ example executions that dominate the docs build (~9 min → ~1).
      # The key folds in the example sources, the package source AND its
      # asset data (examples import dartwork_mpl and render with its
      # palettes/styles, so a data-only color-authority change must regenerate
      # images), conf, the build hooks, and the
      # lockfile; any change forces a fresh full rebuild. No restore-keys on
      # purpose: a partial (prefix) restore could serve stale images for an
      # unchanged example whose library-side output actually changed.
      - name: Cache sphinx-gallery output
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: docs/examples_gallery
          key: gallery-${{ runner.os }}-${{ hashFiles('docs/examples_source/**', 'src/dartwork_mpl/**/*.py', 'src/dartwork_mpl/asset/**', 'docs/conf.py', 'docs/_ext/build_hooks.py', 'uv.lock') }}

      # The diagrams PoC page (docs/internals/diagrams_poc.md) uses
      # sphinx.ext.graphviz to render the auto-extracted module dependency
      # graph (and its Diagrams-Python architecture script also shells out
      # to the same `dot` binary). Ubuntu runners ship without it.
      - name: Install Graphviz for hosted PR builds
        if: github.event_name == 'pull_request'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y graphviz

      - name: Verify Graphviz (dot binary for sphinx.ext.graphviz)
        # ml-main has Graphviz preinstalled; hosted PR builds install it above.
        run: dot -V

      - name: Verify packaged color authorities
        run: |
          set -euo pipefail
          uv run python scripts/build_color_v6_ssot.py \
            --baseline-commit 12d16bac22dee790bd0696ca92a814a797dc728b \
            --output /tmp/dartwork-color-v6-ssot.json
          cmp /tmp/dartwork-color-v6-ssot.json src/dartwork_mpl/asset/color/color_v6_ssot.json
          uv run python -m dartwork_mpl._colors._build --check

      - name: Compare frozen and live color systems
        run: uv run python scripts/compare_color_systems.py --output build/color-system-comparison --check

      - name: Verify generated color documentation assets
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          uv run python docs/_static/scripts/build_categorical_explorer.py --check
          uv run python docs/_static/scripts/build_colormap_explorer.py --check
          uv run python docs/color_system/generate_theory_figures.py --check

      - name: Upload color-system comparison
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: color-system-comparison
          path: build/color-system-comparison
          if-no-files-found: warn

      - name: Build documentation (warnings = errors)
        env:
          MPLBACKEND: Agg
        run: uv run sphinx-build -b html -W --keep-going -d docs/_build/doctrees docs docs/_build/html

      # The Sphinx hook rejects a stale llms-full.txt without rewriting it.
      # Keep this diff guard as a defense against any accidental tracked write
      # introduced by a future build extension.
      - name: Assert docs build left llms-full.txt untouched
        run: |
          if ! git diff --quiet -- llms-full.txt; then
            echo "::error::The docs build mutated llms-full.txt. Authority hooks must verify without writing. Regenerate explicitly before CI."
            git --no-pager diff -- llms-full.txt | head -60
            exit 1
          fi
