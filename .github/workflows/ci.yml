name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Ruff lint
        run: uv run ruff check src/ tests/

      - name: Ruff format check
        run: uv run ruff format --check src/ tests/

      - name: Type check (mypy)
        run: uv run mypy src/dartwork_mpl/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Keep the coverage gate on one representative interpreter. The
      # remaining matrix jobs still run the full test suite for version
      # compatibility, but skip coverage instrumentation and the duplicate
      # integration smoke below.
      - name: Run tests with coverage
        if: matrix.python-version == '3.12'
        env:
          MPLBACKEND: Agg
        run: uv run pytest tests/ -v --cov --cov-report=term-missing

      - name: Run tests
        if: matrix.python-version != '3.12'
        env:
          MPLBACKEND: Agg
        run: uv run pytest tests/ -v --no-cov

      # Explicit guardrail: the integration / MCP / CLI / drift tests
      # all import ``fastmcp`` via ``pytest.importorskip``. With
      # ``--all-extras`` they should never skip, but the silent-skip
      # mode of importorskip means a regression in the extras
      # mapping would hide them from the main pytest pass. This
      # step parses the run output and fails if **any** of those
      # files contributed zero collected items.
      - name: Assert MCP / integration tests actually ran
        if: matrix.python-version == '3.12'
        env:
          MPLBACKEND: Agg
        run: |
          uv run pytest \
            tests/test_mcp.py \
            tests/test_integration.py \
            tests/test_cli.py \
            tests/test_drift.py \
            -v --no-cov \
          | tee /tmp/integration-output.log
          # Fail if any of the files collected 0 items (silent skip
          # of an entire file would otherwise pass CI). The summary
          # line looks like ``=== 27 passed in 1.5s ===``.
          if grep -E "no tests ran|0 passed" /tmp/integration-output.log; then
            echo "::error::Integration tests collected 0 items"
            exit 1
          fi

  # Sanity check: the *base* install (no [mcp] extra) must still
  # import and pass the non-MCP tests. Catches regressions where a
  # core module accidentally requires fastmcp at import time.
  test-no-extras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Set up Python
        run: uv python install 3.12
      - name: Install with NO extras
        run: uv sync --no-dev
      - name: Import smoke (must not require fastmcp)
        run: |
          uv run python -c "
          import dartwork_mpl as dm
          # Public surface must import without [mcp].
          assert callable(dm.figsize)
          assert callable(dm.simple_layout)
          assert callable(dm.get_agent_doc)
          assert callable(dm.agent_doc_path)
          assert dm.AGENT_DOCS
          print('OK: base install imports cleanly')
          "

  # Build the docs on every PR (the deploy workflow only runs on main, so
  # without this a doc-breaking change isn't caught until after merge).
  # Two gates: (1) -W turns Sphinx warnings into build failures; (2) the
  # ``builder-inited`` hook regenerates llms-full.txt, so a stale committed
  # copy (upstream edited but llms-full.txt not rebuilt) fails the drift check.
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Caches the incremental-build state: Sphinx doctrees (skip re-parsing
      # unchanged pages) and the matplotlib font cache (skip the cold-start
      # font scan). Key invalidates when any docs or package Python source
      # changes.
      - name: Cache Sphinx doctrees + matplotlib font cache
        uses: actions/cache@v4
        with:
          path: |
            docs/_build/doctrees
            ~/.cache/matplotlib
          key: docs-${{ runner.os }}-${{ hashFiles('docs/**/*.py', 'src/dartwork_mpl/**/*.py', 'uv.lock') }}
          restore-keys: |
            docs-${{ runner.os }}-

      # Cache the generated sphinx-gallery tree (rst + images + the
      # per-example ``.py.md5`` stamps). sphinx-gallery re-executes an
      # example only when its source ``.py`` md5 changes, and the
      # purge_stale_gallery_artifacts hook drops only orphaned outputs —
      # so restoring this tree lets an unchanged-example build skip the
      # 70+ example executions that dominate the docs build (~9 min → ~1).
      # The key folds in the example sources, the package source (examples
      # import dartwork_mpl, so a library change must regenerate images),
      # conf, the build hooks, and the lockfile; any change forces a fresh
      # full rebuild. No restore-keys on purpose: a partial (prefix)
      # restore could serve stale images for an unchanged example whose
      # library-side output actually changed.
      - name: Cache sphinx-gallery output
        uses: actions/cache@v4
        with:
          path: docs/examples_gallery
          key: gallery-${{ runner.os }}-${{ hashFiles('docs/examples_source/**', 'src/dartwork_mpl/**/*.py', 'docs/conf.py', 'docs/_ext/build_hooks.py', 'uv.lock') }}

      # The diagrams PoC page (docs/internals/diagrams_poc.md) uses
      # sphinx.ext.graphviz to render the auto-extracted module dependency
      # graph (and its Diagrams-Python architecture script also shells out
      # to the same `dot` binary). Ubuntu runners ship without it.
      - name: Install Graphviz (dot binary for sphinx.ext.graphviz)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build documentation (warnings = errors)
        env:
          MPLBACKEND: Agg
        run: uv run sphinx-build -b html -W --keep-going -d docs/_build/doctrees docs docs/_build/html

      # The Sphinx build rewrites llms-full.txt in place. If it differs from
      # the committed copy, an upstream agent-doc source was edited without
      # rebuilding. (Generated SVG/HTML assets are non-deterministic, so the
      # guard is scoped to llms-full.txt only — never the asset tree.)
      - name: Assert llms-full.txt is in sync
        run: |
          if ! git diff --quiet -- llms-full.txt; then
            echo "::error::llms-full.txt is stale — rebuild docs (uv run sphinx-build -b html docs docs/_build/html) and commit the regenerated file."
            git --no-pager diff -- llms-full.txt | head -60
            exit 1
          fi
