name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# A newer push to the same PR or branch cancels the run it supersedes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # uv gives a download 30 s by default; a stalled connection ran past it.
  UV_HTTP_TIMEOUT: "120"
  UV_PYTHON: "3.12"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "uv.lock"
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync ruff format --check
      - run: uv run --no-sync basedpyright
      # A plain `pip install dartwork-mpl` (runtime dependencies only) must
      # import and draw.
      - name: Runtime-only smoke
        env:
          MPLBACKEND: Agg
        run: |
          uv sync --frozen --no-dev
          uv run --no-sync python -c "
          import matplotlib.pyplot as plt, dartwork_mpl as dm
          dm.style.use('scientific')
          fig, ax = plt.subplots(figsize=dm.figsize('8cm', 'wide'))
          ax.plot([0, 1, 2], [1, 3, 2])
          dm.simple_layout(fig)
          fig.savefig('/tmp/smoke.png')
          "

  # The whole suite, including the two aesthetic gates: the shipped-colour
  # digests (tests/test_shipped_colors_hash.py) and the pixel baselines
  # (tests/visual, compared only under --mpl).
  test:
    runs-on: ubuntu-24.04
    env:
      MPLBACKEND: Agg
      # The bar-label readability tests read the saved PDF through
      # Ghostscript; here a missing gs fails them instead of skipping.
      DARTWORK_MPL_REQUIRE_GHOSTSCRIPT: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "uv.lock"
      - name: Install Ghostscript
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y ghostscript
      - run: uv sync --frozen
      - name: Run tests
        run: uv run --no-sync pytest -q -n auto --dist worksteal --mpl --mpl-results-path="$RUNNER_TEMP/mpl-results"
      - name: Upload pixel diffs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: visual-diffs
          path: ${{ runner.temp }}/mpl-results
          if-no-files-found: ignore
          retention-days: 7
