name: Deploy Sphinx Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: [self-hosted, ml-main]
    # Pin the docs build to a single modern interpreter (see ci.yml docs job):
    # retain the known-good 3.12 build rather than following the 3.11 pin.
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true
          prune-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Cache the generated sphinx-gallery tree so an unchanged-example
      # deploy skips the 70+ example executions (the build's dominant
      # cost). sphinx-gallery's md5 stamps re-run only changed examples;
      # the key folds in example sources + package source + conf + hooks
      # + lockfile, so any change forces a fresh full rebuild (no
      # restore-keys — a partial restore could ship stale images).
      - name: Cache sphinx-gallery output
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: docs/examples_gallery
          key: gallery-${{ runner.os }}-${{ hashFiles('docs/examples_source/**', 'src/dartwork_mpl/**/*.py', 'src/dartwork_mpl/asset/**', 'docs/conf.py', 'docs/_ext/build_hooks.py', 'uv.lock') }}

      # The diagrams PoC page (docs/internals/diagrams_poc.md) renders a
      # sphinx.ext.graphviz directive (auto-extracted module dep graph).
      # Without the `dot` binary the build aborts with "graphviz_dot
      # executable not found". Mirrors the verification step in ci.yml.
      - name: Verify Graphviz (dot binary for sphinx.ext.graphviz)
        # ml-main 러너에 미리 설치돼 있다. 러너에는 passwordless sudo 가
        # 없으므로 설치 대신 존재만 확인하고, 없으면 즉시 실패시킨다.
        run: dot -V

      - name: Verify packaged color authorities
        run: |
          set -euo pipefail
          uv run python scripts/build_color_v6_ssot.py \
            --baseline-commit 12d16bac22dee790bd0696ca92a814a797dc728b \
            --output /tmp/dartwork-color-v6-ssot.json
          cmp /tmp/dartwork-color-v6-ssot.json src/dartwork_mpl/asset/color/color_v6_ssot.json
          uv run python -m dartwork_mpl._colors._build --check

      - name: Compare frozen and live color systems
        run: uv run python scripts/compare_color_systems.py --output build/color-system-comparison --check

      - name: Verify generated color documentation assets
        env:
          MPLBACKEND: Agg
        run: |
          set -euo pipefail
          uv run python docs/_static/scripts/build_categorical_explorer.py --check
          uv run python docs/_static/scripts/build_colormap_explorer.py --check
          uv run python docs/color_system/generate_theory_figures.py --check

      - name: Upload color-system comparison
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: color-system-comparison
          path: build/color-system-comparison
          if-no-files-found: warn

      - name: Build documentation
        env:
          MPLBACKEND: Agg
        # -W --keep-going: collect every warning, then fail the build (and
        # therefore block the Pages deploy) if any remain. Mirrors the PR-time
        # gate in ci.yml so main can't deploy docs that CI would have rejected.
        run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html -w docs/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sphinx-build-log
          path: docs/build.log
          retention-days: 7

      # The build hooks verify generated authorities without rewriting them.
      # Catch an accidental tracked write before publishing the Pages bundle.
      - name: Assert docs build left llms-full.txt untouched
        run: |
          if ! git diff --quiet -- llms-full.txt; then
            echo "::error::The docs build mutated llms-full.txt. Authority hooks must verify without writing. Regenerate explicitly before CI."
            git --no-pager diff -- llms-full.txt | head -60
            exit 1
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: [self-hosted, ml-main]
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
