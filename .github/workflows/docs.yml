name: Deploy Sphinx Docs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Pin the docs build to a single modern interpreter (see ci.yml docs job):
    # `uv sync` otherwise floats to the requires-python floor (3.10), whose
    # gallery execution hit an environment-specific failure 3.11+ does not.
    env:
      UV_PYTHON: "3.12"
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --dev

      # Cache the generated sphinx-gallery tree so an unchanged-example
      # deploy skips the 70+ example executions (the build's dominant
      # cost). sphinx-gallery's md5 stamps re-run only changed examples;
      # the key folds in example sources + package source + conf + hooks
      # + lockfile, so any change forces a fresh full rebuild (no
      # restore-keys — a partial restore could ship stale images).
      - name: Cache sphinx-gallery output
        uses: actions/cache@v4
        with:
          path: docs/examples_gallery
          key: gallery-${{ runner.os }}-${{ hashFiles('docs/examples_source/**', 'src/dartwork_mpl/**/*.py', 'docs/conf.py', 'docs/_ext/build_hooks.py', 'uv.lock') }}

      # The diagrams PoC page (docs/internals/diagrams_poc.md) renders a
      # sphinx.ext.graphviz directive (auto-extracted module dep graph).
      # Without the `dot` binary the build aborts with "graphviz_dot
      # executable not found". Mirrors the apt-get step in ci.yml.
      - name: Install Graphviz (dot binary for sphinx.ext.graphviz)
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build documentation
        env:
          MPLBACKEND: Agg
        # -W --keep-going: collect every warning, then fail the build (and
        # therefore block the Pages deploy) if any remain. Mirrors the PR-time
        # gate in ci.yml so main can't deploy docs that CI would have rejected.
        run: uv run sphinx-build -b html -W --keep-going docs docs/_build/html -w docs/build.log

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: sphinx-build-log
          path: docs/build.log
          retention-days: 7

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
