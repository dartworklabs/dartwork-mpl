[project]
name = "dartwork-mpl"
version = "0.4.0"
description = "Enhanced matplotlib styling, color management, and utility library for publication-quality figures"
readme = "README.md"
license = { text = "MIT" }
keywords = ["matplotlib", "visualization", "color", "styling", "publication"]
authors = [
    { name = "Sangwon Lee", email = "lsw91.main@gmail.com" },
    { name = "Wonjun Choi", email = "wonjunn.choi@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "colorspacious>=1.1.2",
    "ipython>=8.32.0",
    "matplotlib>=3.10.1",
    "numpy>=1.26",
    "palettable>=3.3.3",
    "pyyaml>=6.0",
    "scipy>=1.15.2",
]

[project.urls]
Homepage = "https://github.com/dartworklabs/dartwork-mpl"
Documentation = "https://dartworklabs.github.io/dartwork-mpl/"
Repository = "https://github.com/dartworklabs/dartwork-mpl"
Issues = "https://github.com/dartworklabs/dartwork-mpl/issues"

[project.scripts]
dartwork-mpl-mcp = "dartwork_mpl.cli:main"
ui = "dartwork_mpl.ui.__main__:main"

[project.optional-dependencies]
mcp = [
    # Cap below 4 — 3.x is the latest tested major; 4.x has not been
    # vetted and may rename/remove the introspection APIs we use.
    "fastmcp>=2.13.3,<4",
    "httpx>=0.27.0",
]
ui = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.27.0",
    "InquirerPy>=0.3.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Explicit sdist whitelist. Without this, hatch defaults to "everything
# not in .gitignore", which sweeps in worktree caches, docs/_build, .venv
# leftovers, etc. — easily pushing the tarball past PyPI's 100 MB
# per-file ceiling. We ship just the package + license + top-level
# metadata; the bundled fonts (~87 MB) live under src/dartwork_mpl/asset
# and are picked up by the package include.
[tool.hatch.build.targets.sdist]
include = [
    "src/dartwork_mpl",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dartwork_mpl"]

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "myst-parser>=4.0.1",
    "notebook>=7.4.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "shibuya>=2025.11.10",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-gallery>=0.19.0",
    "sphinx-markdown-builder>=0.6.8",
    "sphinx-tabs>=3.4.7",
]

# Test configuration and commands
# Run tests with: uv run pytest
# Run specific test: uv run pytest tests/test_color_view.py
# Run with coverage: uv run pytest --cov=src/dartwork_mpl --cov-report=html

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dartwork_mpl"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# E402: Module level import not at top of file
# These files intentionally modify sys.path before importing
"docs/color_system/generate_assets.py" = ["E402"]
"docs/fonts/generate_assets.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
check_untyped_defs = true
# asset/prompt/05-templates/*.py are bundled documentation samples,
# not package source. They are intentionally untyped scripts.
exclude = [
    'asset/prompt/05-templates/.*\.py$',
]

[tool.coverage.run]
source = ["src/dartwork_mpl"]
omit = ["*/ui/*", "*/mcp/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
