[project]
name = "dartwork-mpl"
version = "0.4.2"
description = "Enhanced matplotlib styling, color management, and utility library for publication-quality figures"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["matplotlib", "visualization", "color", "styling", "publication"]
authors = [
    { name = "Sangwon Lee", email = "lsw91.main@gmail.com" },
    { name = "Wonjun Choi", email = "wonjunn.choi@gmail.com" }
]
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Framework :: Matplotlib",
    "Typing :: Typed",
]
dependencies = [
    "colorspacious>=1.1.2",
    "ipython>=8.32.0",
    "matplotlib>=3.10.1",
    "numpy>=1.26",
    "palettable>=3.3.3",
    "pyyaml>=6.0",
    "scipy>=1.15.2",
]

[project.urls]
Homepage = "https://dartworklabs.github.io/dartwork-mpl/"
Repository = "https://github.com/dartworklabs/dartwork-mpl"
Issues = "https://github.com/dartworklabs/dartwork-mpl/issues"
Changelog = "https://github.com/dartworklabs/dartwork-mpl/blob/main/CHANGELOG.md"

[project.scripts]
dartwork-mpl-mcp = "dartwork_mpl.cli:main"
dartwork-mpl-ui = "dartwork_mpl.ui.__main__:main"

[project.optional-dependencies]
mcp = [
    # Cap below 4 — 3.x is the latest tested major; 4.x has not been
    # vetted and may rename/remove the introspection APIs we use.
    "fastmcp>=2.13.3,<4",
    "httpx>=0.27.0",
]
ui = [
    "fastapi>=0.110.0",
    "pydantic>=2.0.0",
    "uvicorn[standard]>=0.27.0",
    "InquirerPy>=0.3.4",
]

[build-system]
# Pin below the next major so a future hatchling 2.x can't silently
# change sdist/wheel file-selection (force-include, only-include)
# behaviour mid-release. 1.27+ is what the package is tested against.
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

# Explicit sdist whitelist. Without this, hatch defaults to "everything
# not in .gitignore", which sweeps in worktree caches (`.claude/`),
# docs/_build, dev-only docs/examples, and similar cruft. ``include``
# is *additive* on top of hatch's default file discovery, so we use
# ``only-include`` to make the whitelist authoritative. The bundled
# fonts (~70 MB) live under src/dartwork_mpl/asset and are picked up
# transitively because src/dartwork_mpl is whitelisted.
[tool.hatch.build.targets.sdist]
only-include = [
    "src/dartwork_mpl",
    "LICENSE",
    "README.md",
    "CHANGELOG.md",
    "pyproject.toml",
    # Agent entry-point files (T1; see
    # docs/superpowers/specs/2026-05-01-ai-readiness-0.5-roadmap.md).
    "CLAUDE.md",
    "AGENTS.md",
    "llms.txt",
    "llms-full.txt",
]

[tool.hatch.build.targets.wheel]
packages = ["src/dartwork_mpl"]

# Agent entry-point files are bundled inside the wheel under
# ``dartwork_mpl/asset/agent/`` so installations from PyPI can read
# them via ``importlib.resources``. The repo-root copies remain the
# canonical source for GitHub-raw fetches.
#
# Destinations are package-relative — Hatch does NOT strip ``src/``
# for ``force-include`` the way it does for the ``packages = [...]``
# entries above. Writing ``src/dartwork_mpl/...`` here would land the
# files outside the importable package tree at install time, so
# ``importlib.resources`` couldn't reach them under
# ``dartwork_mpl.asset.agent``.
[tool.hatch.build.targets.wheel.force-include]
"CLAUDE.md" = "dartwork_mpl/asset/agent/CLAUDE.md"
"AGENTS.md" = "dartwork_mpl/asset/agent/AGENTS.md"
"llms.txt" = "dartwork_mpl/asset/agent/llms.txt"
"llms-full.txt" = "dartwork_mpl/asset/agent/llms-full.txt"

[dependency-groups]
dev = [
    "mypy>=1.8.0",
    "myst-parser>=4.0.1",
    "notebook>=7.4.1",
    "openpyxl>=3.1.5",
    "pandas>=2.2.3",
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "shibuya>=2025.11.10",
    "sphinx>=8.1.3",
    "sphinx-copybutton>=0.5.2",
    "sphinx-design>=0.6.1",
    "sphinx-gallery>=0.19.0",
    "sphinx-markdown-builder>=0.6.8",
    "sphinx-tabs>=3.4.7",
]

# Test configuration and commands
# Run tests with: uv run pytest
# Run specific test: uv run pytest tests/test_color_view.py
# Run with coverage: uv run pytest --cov=src/dartwork_mpl --cov-report=html

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--tb=short",
]

[tool.ruff]
line-length = 80
target-version = "py310"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = true
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "BLE",
    "RET",
    "SIM",
    "PERF",
    "RUF",
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["dartwork_mpl"]
split-on-trailing-comma = false

[tool.ruff.lint.per-file-ignores]
# RUF001/002/003 (ambiguous unicode in strings/docstrings/comments):
# documentation and examples intentionally use mathematical and Greek
# characters (×, σ, α, γ, ∪, ℝ, −, ∨, –) as content. They are not
# confusable identifiers, and the rule adds noise without value here.
"docs/**/*.py" = ["RUF001", "RUF002", "RUF003"]
"examples/**/*.py" = ["RUF001", "RUF002", "RUF003"]
# E402: these scripts intentionally modify sys.path before importing.
# W293: docs/color_system/generate_assets.py embeds a JavaScript
# template string whose blank lines carry whitespace as part of the
# rendered HTML output, not Python source style.
"docs/color_system/generate_assets.py" = ["E402", "W293"]
"docs/fonts/generate_assets.py" = ["E402"]
# BLE001 + PERF203: these asset generators run a best-effort batch loop
# that must continue past any individual failure (one broken example
# shouldn't abort the whole build). The blind-except + try/except-in-
# loop pattern is intentional.
"docs/api/generate_assets.py" = ["BLE001", "PERF203"]
"docs/usage_guide/generate_assets.py" = ["BLE001", "PERF203"]
# Tests legitimately use unused unpacked variables (e.g. fig, ax tuples
# where only one is asserted), nested context managers, manual list
# comprehensions, blind excepts in cleanup code, ambiguous unicode in
# docstrings illustrating actual user input, and dict iteration that
# explicitly tests keys-vs-values intent. These ruff rules add noise
# without value in test code.
"tests/**/*.py" = [
    "RUF059",
    "SIM117",
    "RUF043",
    "PERF401",
    "PERF102",
    "SIM105",
    "BLE001",
    "RUF002",
]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
# asset/prompt/05-templates/*.py are bundled documentation samples,
# not package source. They are intentionally untyped scripts.
exclude = [
    'asset/prompt/05-templates/.*\.py$',
]

# FastMCP and FastAPI route/tool/resource decorators are dynamically
# typed at the framework level; under `ignore_missing_imports = true`
# they resolve to `Any`, which trips mypy's strict
# `disallow_untyped_decorators` on every handler. The handlers are
# correctly typed in the source — the decorator is the only `Any`.
# Same story for Pydantic `BaseModel` subclasses in the UI layer:
# the base class resolves to `Any`, which trips
# `disallow_subclassing_any`. Relax these two checks for the affected
# subpackages only; the rest of the package keeps full strict mode.
[[tool.mypy.overrides]]
module = ["dartwork_mpl.mcp.*", "dartwork_mpl.ui.*"]
disallow_untyped_decorators = false
disallow_subclassing_any = false

# InquirerPy's `inquirer` submodule exposes `text` and `select` via
# dynamic attribute access; they are not listed in `__all__`, so mypy
# strict raises attr-defined on every access.  Skipping follow_imports
# for the whole InquirerPy namespace suppresses those false positives
# without touching the call sites.
[[tool.mypy.overrides]]
module = ["InquirerPy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.coverage.run]
source = ["src/dartwork_mpl"]
# mcp/ is the agentic core and is exercised by tests/test_mcp.py +
# tests/test_integration.py, so it stays in the report (omitting it
# hid the agentic surface behind an inflated headline number). ui/ is
# the optional `dartwork-mpl-ui` viewer (FastAPI app + a 1.5k-line HTML
# template) whose web layer is not unit-tested; it is omitted so the
# core fail-under threshold reflects covered code, not the viewer.
omit = ["*/ui/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
# Regression gate: the suite currently sits at ~86% with mcp/ included.
# 80 leaves a little headroom for incidental churn while still failing
# the build if a substantial chunk of new code ships untested (the prior
# state had no gate at all, so coverage could silently regress to zero).
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.",
    "if TYPE_CHECKING:",
]
